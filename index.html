// Construit les données factuelles du bilan (sans les rédiger) pour les transmettre à l'IA,
// qui se charge d'en faire une synthèse fluide plutôt qu'un listing à puces.
// Le bilan d'accréditation (dernière étape du cycle) n'est pas qu'un bilan de l'année en
// cours : c'est la compilation des 3 bilans annuels précédents que la HAS examine réellement
// pour délivrer ou renouveler l'accréditation.
function isAccreditationStage(e, year){
  return year === stagesFor(e).length - 1;
}
function compiledYearsForAccreditation(e, year){
  return [year-3, year-2, year-1].filter(y=>y>=0);
}

// Le contenu collé depuis le SIAM peut être long, et un bilan (surtout un bilan
// d'accréditation, qui compile 3 années) peut compter jusqu'à 63 activités : sans plafond, le
// prompt copié pour l'IA — et la synthèse elle-même — deviendrait vite illisible. On retient
// l'essentiel de chaque contenu plutôt que de tout reprendre verbatim ; ce n'est pas un résumé
// intelligent (on a retiré l'appel IA pour la RGPD), mais ça garde le prompt et la synthèse
// exploitables.
function truncateForPrompt(text, maxLen){
  maxLen = maxLen || 320;
  if (!text) return "";
  const t = text.trim();
  if (t.length <= maxLen) return t;
  return t.slice(0, maxLen).trim() + "…";
}

function buildBilanFactsAccreditation(e, year){
  const stages = stagesFor(e);
  const compiledYears = compiledYearsForAccreditation(e, year);
  const activitesParPilier = PILIERS.map(p=>{
    const parActivite = {};
    compiledYears.forEach(y=>{
      const statuts = getBilanStatuts(e, y);
      const contenus = getBilanContenus(e, y);
      p.activites.forEach((a,ai)=>{
        const key = p.id+"_"+ai;
        if (statuts[key]==="realise" || statuts[key]==="en_cours"){
          const nom = a.nom.replace(" (OBLIGATOIRE)","");
          if (!parActivite[nom]) parActivite[nom] = { annees:[], contenu:"" };
          parActivite[nom].annees.push(stages[y]);
          const c = contenus[key];
          const detail = truncateForPrompt(c && (c.simplifie||c.texte));
          if (detail && !parActivite[nom].contenu) parActivite[nom].contenu = detail;
        }
      });
    });
    return {
      pilier: p.nom,
      activites: Object.entries(parActivite).map(([nom,v])=>({ nom, annees:v.annees, contenu:v.contenu })),
    };
  });
  const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;
  const attenduPeriode = attendu * (compiledYears.length || 1);
  const themesEias = (e.dossiersEias||[]).map(d=> d.titre + (d.motsCles&&d.motsCles.length ? " ("+d.motsCles.join(", ")+")" : ""));
  return {
    etape: stages[year],
    periodeCouverte: compiledYears.map(y=>stages[y]),
    engage: e.nom,
    composition: e.type==="equipe" ? e.membres.length+" médecins engagés" : "exercice individuel — "+e.modeExercice,
    eiasSurLaPeriode: e.eiasRealises + "/" + attenduPeriode + " (comptage cumulatif suivi par l'application, à vérifier sur la période exacte)",
    themesEias,
    activitesParPilier,
    appreciation: getBilanAppreciation(e, year),
  };
}

function buildBilanFacts(e, year){
  const statuts = getBilanStatuts(e, year);
  const contenus = getBilanContenus(e, year);
  const valence = getBilanValence(e, year);
  const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;
  const p1a0 = statuts["p1_0"], p3a0 = statuts["p3_0"];
  const activitesParPilier = PILIERS.map(p=>{
    const items = p.activites.map((a,ai)=>({a, key:p.id+"_"+ai})).filter(o=> statuts[o.key]==="realise" || statuts[o.key]==="en_cours");
    return {
      pilier: p.nom,
      activites: items.map(o=>{
        const c = contenus[o.key];
        return { nom: o.a.nom.replace(" (OBLIGATOIRE)",""), contenu: truncateForPrompt(c && (c.simplifie||c.texte)) };
      }),
    };
  });
  const themesEias = (e.dossiersEias||[]).map(d=> d.titre + (d.motsCles&&d.motsCles.length ? " ("+d.motsCles.join(", ")+")" : ""));
  const valenceLignes = [];
  if (valence.pluridisciplinaire) valenceLignes.push("pluridisciplinaire");
  if (valence.pluriprofessionnelle) valenceLignes.push("pluriprofessionnelle");
  return {
    etape: stagesFor(e)[year],
    engage: e.nom,
    composition: e.type==="equipe" ? e.membres.length+" médecins engagés" : "exercice individuel — "+e.modeExercice,
    preRequis: {
      rmm: p1a0==="realise", checklist: p3a0==="realise", formation: true,
      eias: e.eiasRealises+"/"+attendu,
    },
    valence: valenceLignes,
    themesEias,
    activitesParPilier,
    appreciation: getBilanAppreciation(e, year),
  };
}

// Corrige les erreurs JSON les plus fréquentes : retours à la ligne bruts dans une chaîne
// (le JSON strict l'interdit), guillemets "intelligents" introduits par Word/RTF, espaces
// insécables, et balises de code résiduelles.
function sanitizeJsonText(raw){
  let t = raw.replace(/```json|```/gi, "").trim();
  // Caractères invisibles fréquents lors d'un copier-coller depuis une page web (BOM,
  // espaces/liants de largeur nulle) : invisibles à l'œil mais qui cassent JSON.parse.
  t = t.replace(/[\uFEFF\u200B\u200C\u200D]/g, "");
  // Retire un éventuel texte avant/après l'objet JSON (préambule de l'IA)
  const firstBrace = t.indexOf("{");
  const lastBrace = t.lastIndexOf("}");
  if (firstBrace > 0 || lastBrace < t.length - 1){
    if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace){
      t = t.slice(firstBrace, lastBrace + 1);
    }
  }
  // Guillemets typographiques -> guillemets droits (Word/RTF les substituent automatiquement)
  t = t.replace(/[\u201C\u201D\u201E\u201F]/g, '"').replace(/[\u2018\u2019\u201A\u201B]/g, "'");
  // Espaces insécables et espaces fines -> espace normal
  t = t.replace(/[\u00A0\u202F]/g, " ");

  // Échappe les retours à la ligne / tabulations bruts, mais seulement à l'intérieur
  // d'une chaîne JSON (sinon on casserait la structure de l'objet).
  let out = "";
  let inString = false;
  let escaped = false;
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if (inString){
      if (escaped){ out += ch; escaped = false; continue; }
      if (ch === "\\"){ out += ch; escaped = true; continue; }
      if (ch === '"'){ out += ch; inString = false; continue; }
      if (ch === "\n"){ out += "\\n"; continue; }
      if (ch === "\r"){ continue; }
      if (ch === "\t"){ out += "\\t"; continue; }
      out += ch;
    } else {
      if (ch === '"'){ inString = true; out += ch; continue; }
      out += ch;
    }
  }
  return out;
}

function parseEiasResponse(textBlock){
  const cleaned = sanitizeJsonText(textBlock);
  let parsed;
  try{
    parsed = JSON.parse(cleaned);
  }catch(err){
    const pos = (err.message.match(/position (\d+)/)||[])[1];
    const snippet = pos ? cleaned.slice(Math.max(0, pos-40), Number(pos)+40) : cleaned.slice(0,120);
    throw new Error("réponse JSON invalide même après nettoyage — extrait autour de l'erreur : « ..." + snippet + "... »");
  }
  if (!parsed.critique) parsed.critique = { pointsForts:"", pointsAmeliorer:"", complementExpert:"" };
  if (parsed.critique.complementExpert === undefined) parsed.critique.complementExpert = "";
  if (!parsed.synthese) parsed.synthese = {};
  if (!parsed.synthese.motsCles) parsed.synthese.motsCles = [];
  return parsed;
}

/* ============================ DIDACTICIEL (apercu) ============================ */
function normalizeSearch(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function stripNumbering(s){ return (s||"").replace(/^\d+\)\s*/, "").trim(); }
// Insère un nouveau thème du répertoire à sa place alphabétique (et non en fin de liste),
// pour que le répertoire reste facilement navigable au fil des ajouts.
function insertRepertoireAlphabetically(entry){
  const norm = normalizeSearch(entry.motcle);
  let idx = DIDACTICIEL_REPERTOIRE.findIndex(e=> normalizeSearch(e.motcle) > norm);
  if (idx === -1) idx = DIDACTICIEL_REPERTOIRE.length;
  DIDACTICIEL_REPERTOIRE.splice(idx, 0, entry);
  return idx;
}

// Destinataire effectif d'un mail : l'adresse propre de l'engagé si elle est renseignée
// (permet une surcharge manuelle, ex. secrétariat dédié pour une équipe) ; à défaut, pour une
// équipe, l'adresse du référent actuel — automatiquement à jour si le référent change, sans
// qu'il faille penser à corriger une adresse d'équipe qui n'existerait pas par ailleurs.
function resolveMailRecipient(e){
  if (e.email) return e.email;
  if (e.type === "equipe"){
    const referent = resolveTeamMembers(e).find(m=>m.role==="referent");
    if (referent && referent.email) return referent.email;
  }
  return e.email || "";
}

function matchRepertoire(kw){
  const norm = normalizeSearch(stripNumbering(kw));
  return DIDACTICIEL_REPERTOIRE.find(e => normalizeSearch(e.motcle) === norm);
}

// Concordance Didacticiel par pilier <-> Répertoire : renvoie les mots-clés saisis sur une
// activité qui ne correspondent à aucun thème ni mot-clé approfondi déjà répertorié.
function computeUnknownKeywords(motscles){
  return (motscles||[]).filter(kw=>{
    const norm = normalizeSearch(stripNumbering(kw));
    return !DIDACTICIEL_REPERTOIRE.some(e=> normalizeSearch(e.motcle)===norm || e.approfondis.some(a=>normalizeSearch(a)===norm));
  });
}

// Un mail (mailto:) ne peut contenir que du texte brut : impossible d'avoir un texte de lien
// cliquable ("cliquez ici"). En revanche, la quasi-totalité des messageries transforment
// automatiquement une URL complète en lien cliquable à l'affichage — on inclut donc les URL
// telles quelles, ce qui reste fonctionnel pour le destinataire.
function buildDidacticielSnippetForBilan(e, year){
  const annotations = getBilanAnnotations(e, year);
  const lines = [];
  PILIERS.forEach(p=> p.activites.forEach((a,ai)=>{
    const key = p.id+"_"+ai;
    if (!annotations[key]) return;
    const nom = a.nom.replace(" (OBLIGATOIRE)","");
    lines.push("• " + nom + (a.attendus ? " — " + a.attendus : ""));
    if (a.exemple) lines.push("   💡 Exemple : " + a.exemple);
    (a.motscles||[]).forEach(k=>{
      const match = matchRepertoire(k);
      if (match && match.liens.length){
        match.liens.forEach(l=> lines.push("   ↳ " + l.label + " : " + l.url));
      }
    });
  }));
  return lines.length ? "\n\nPour aller plus loin sur les points abordés cette année :\n" + lines.join("\n") : "";
}

// Même principe que buildDidacticielSnippetForBilan, mais pour une sélection libre d'activités
// choisie directement dans le Didacticiel (hors contexte d'un bilan précis) — regroupée par
// pilier pour rester lisible dans un mail.
function buildDidacticielSnippetForSelection(selection){
  if (!selection) return "";
  const lines = [];
  PILIERS.forEach(p=>{
    const items = [];
    p.activites.forEach((a,ai)=>{
      const key = p.id+"_"+ai;
      if (!selection[key]) return;
      const nom = a.nom.replace(" (OBLIGATOIRE)","");
      items.push("• " + nom + (a.attendus ? " — " + a.attendus : ""));
      if (a.exemple) items.push("   💡 Exemple : " + a.exemple);
      (a.motscles||[]).forEach(k=>{
        const match = matchRepertoire(k);
        if (match && match.liens.length){
          match.liens.forEach(l=> items.push("   ↳ " + l.label + " : " + l.url));
        }
      });
    });
    if (items.length){ lines.push(p.nom + " :"); lines.push(...items); lines.push(""); }
  });
  return lines.join("\n").trim();
}

      <div class="field"><label>Tolérance de retard (jours)</label><input type="number" id="rgTolerance" value="${REGLES_GESTION.toleranceRetardJours}" min="1" /></div>
      <div class="field"><label>Seuil ratio 1 EIAS / médecin (effectif max)</label><input type="number" id="rgRatioSeuil" value="${REGLES_GESTION.eiasRatioSeuil}" min="1" /></div>
      <div class="field"><label>Plafond EIAS au-delà des exceptions</label><input type="number" id="rgPlafondAuDela" value="${REGLES_GESTION.eiasPlafondAuDela}" min="1" /></div>
    </div>
    <div class="field"><label>Exceptions effectif → EIAS attendus (format « 7:6, 8:7, 9:8, 10:9 »)</label>
      <input type="text" id="rgExceptions" value="${escapeHtml(Object.entries(REGLES_GESTION.eiasExceptions).map(([k,v])=>k+":"+v).join(", "))}" />
    </div>
    <div class="field"><label>Adresse mail de la Responsable Accréditation (copie systématique sur les mails à l'engagé)</label>
      <input type="text" id="rgResponsableEmail" value="${escapeHtml(REGLES_GESTION.responsableAccreditationEmail||"")}" placeholder="mnodanche@cfar.org" />
    </div>
    <div class="field"><label>Aide — rappel des procédures (affiché dans Actions, laisser vide pour le texte par défaut)</label>
      <textarea rows="6" id="rgAideProcedures" placeholder="Laisser vide pour conserver le texte par défaut…">${escapeHtml(REGLES_GESTION.aideProcedures||"")}</textarea>
    </div>
    <button class="btn small" id="saveReglesBtn">Enregistrer</button>
    <a class="linklike" id="cancelReglesBtn" style="margin-left:10px;">Annuler</a>
  </div>` : `
  <div class="card">
    <div class="muted-small">Délai de traitement HAS : <b>${REGLES_GESTION.delaiTraitementJours} j</b> · Tolérance de retard : <b>${REGLES_GESTION.toleranceRetardJours} j</b> · EIAS attendus : 1/médecin jusqu'à <b>${REGLES_GESTION.eiasRatioSeuil}</b>, puis selon exceptions, plafond <b>${REGLES_GESTION.eiasPlafondAuDela}</b>.<br/>
    Copie systématique des mails à : <b>${escapeHtml(REGLES_GESTION.responsableAccreditationEmail||"non renseignée")}</b>
    <a class="linklike" id="editReglesBtn" style="font-size:11.5px; margin-left:8px;">✎ Modifier les règles de gestion</a></div>
  </div>`) : "";

  const referentielBar = isAdmin ? `
  <div class="card" style="border-color:#0E7C6E; background:#F2FBF9;">
    <div class="card-head">
      <div><div class="card-title">📦 Diffuser la mise à jour à tous les experts</div><div class="card-desc">La méthode recommandée — le même principe que pour MTC Consultation</div></div>
    </div>
    ${STATE.referentielImportedPending ? `<div class="badge warn" style="display:block; padding:8px 10px; margin-bottom:10px;">⚠️ Vous avez importé un référentiel qui n'est encore chargé qu'en mémoire — il sera perdu à la prochaine ouverture du fichier tant que vous n'aurez pas cliqué ci-dessous ET déposé le fichier obtenu sur GitHub.</div>` : ""}
    <button class="btn" id="exportUpdatedAppBtn">💾 Exporter l'application mise à jour (index.html)</button>
    <div class="muted-small" style="margin-top:8px;">Génère un fichier <code>index.html</code> identique à celui-ci, mais avec le référentiel, les règles de gestion et les modèles de mail actuellement en mémoire. Déposez-le sur GitHub à la place de l'ancien (« Add file » → « Upload files » → « Commit changes ») : chaque expert n'a alors qu'à faire <b>⌘+Maj+R</b> pour recevoir la mise à jour — rien d'autre à faire de leur côté.</div>
  </div>
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Référentiel seul (JSON) — usage avancé</div><div class="card-desc">Pour échanger juste le référentiel sans republier tout le fichier</div></div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn small" id="exportReferentielBtn">⬇️ Exporter le référentiel (JSON)</button>
      <label class="btn secondary small" style="cursor:pointer;">📥 Importer un référentiel
        <input type="file" id="importReferentielInput" accept="application/json,.json" style="display:none;" />
      </label>
    </div>
    <div class="muted-small" style="margin-top:8px;">À réserver aux cas où republier tout le fichier n'est pas pratique dans l'immédiat. Une fois l'application mise à jour diffusée (ci-dessus), ce fichier JSON n'est plus nécessaire.</div>
  </div>` : "";

  const exportBar = isAdmin ? `
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Export « Didacticiel Accréditation »</div><div class="card-desc">Page autonome, présentable, à déposer sur le site du CFAR</div></div>
      <button class="btn small" id="exportDidacticielBtn">⬇️ Exporter la page web</button>
    </div>
    <div class="muted-small">Génère un fichier HTML unique, mis en forme, réunissant les piliers et le répertoire — prêt à être déposé manuellement sur cfar.org. Une publication réellement automatique nécessiterait une intégration côté CFAR (API ou CMS) qui dépasse ce prototype local (cf. spécification §10 sur l'architecture).</div>
  </div>` : "";

  const selectionCount = Object.values(STATE.didacticielSelection||{}).filter(Boolean).length;
  const trackedForSend = ENGAGES.filter(e=>e.type!=="membre_equipe").slice().sort((a,b)=>(a.nomFamille||a.nom).localeCompare(b.nomFamille||b.nom));
  const selectionBar = (view === "piliers") ? `
  <div class="card" style="background:#F2FBF9; border-color:#0E7C6E;">
    <div class="card-title" style="margin-bottom:8px;">📬 Adresser une sélection du didacticiel à un engagé</div>
    <div class="muted-small" style="margin-bottom:10px;">Cochez les activités utiles (attendus, mots-clés et liens) — pour répondre à une question ponctuelle, sans envoyer tout le didacticiel.</div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <b>${selectionCount} activité(s) sélectionnée(s)</b>
      <button class="btn secondary small" id="clearDidacticielSelectionBtn" ${selectionCount?"":"disabled"}>Tout désélectionner</button>
      <button class="btn secondary small" id="exportSelectionBtn" ${selectionCount?"":"disabled"}>⬇️ Exporter la sélection (page web)</button>
    </div>
    ${selectionCount ? `
    <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
      <select id="didacticielTargetEngage" style="max-width:280px;">
        <option value="">— Choisir un engagé —</option>
        ${trackedForSend.map(e=>`<option value="${e.id}">${escapeHtml(e.nom)}</option>`).join("")}
      </select>
      <button class="btn small" id="sendSelectionBtn">✉️ Envoyer à cet engagé</button>
    </div>` : ""}
  </div>` : "";

  let body = "";
  if (view === "piliers"){
    body = PILIERS.map(p=>{
      const acts = p.activites.map((a,ai)=>{
        const key = p.id+"_"+ai;
        const editing = STATE.didacticielEditKey === key;
        const kwChips = (a.motscles||[]).map(k=>{
          const match = matchRepertoire(k);
          if (!match){
            return `<span class="kw-chip off" data-kw-noresource="${escapeHtml(k)}" style="cursor:pointer;">${escapeHtml(k)}</span>`;
          }
          if (match.liens.length === 1){
            return `<span class="kw-chip" data-open-link="${escapeHtml(match.liens[0].url)}" style="cursor:pointer;">${escapeHtml(k)}</span>`;
          }
          return `<span class="kw-chip" data-jump-mot="${escapeHtml(match.motcle)}" style="cursor:pointer;">${escapeHtml(k)}</span>`;
        }).join("") || `<span class="muted-small">Aucun mot-clé renseigné</span>`;

        const editBlock = editing ? `
          <div style="margin-top:8px; padding:10px; background:#fbfcfe; border:1px dashed var(--border); border-radius:8px;">
            <div class="section-label">Titre de l'activité</div>
            <input type="text" id="editNom_${key}" value="${escapeHtml(a.nom||"")}" />
            <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; margin-top:8px;">
              <input type="checkbox" id="editObligatoire_${key}" ${a.obligatoire?"checked":""} /> Activité obligatoire pour ce pilier
            </label>
            <div class="section-label" style="margin-top:8px;">Attendus (reformulation simple du jargon SIAM)</div>
            <textarea rows="3" id="editAttendus_${key}">${escapeHtml(a.attendus||"")}</textarea>
            <div class="section-label" style="margin-top:8px;">💡 Exemple concret (pour aider l'engagé à comprendre à quoi ça ressemble en vrai)</div>
            <textarea rows="3" id="editExemple_${key}" placeholder="Ex. : « Votre service organise une RMM tous les 2 mois... »">${escapeHtml(a.exemple||"")}</textarea>
            <div class="section-label" style="margin-top:8px;">Mots-clés</div>
            <div id="motclesChips_${key}">
              ${(STATE.editingMotscles || a.motscles || []).map(k=>`<span class="kw-chip" style="cursor:default;">${escapeHtml(k)} <a data-remove-motcle="${escapeHtml(k)}" data-remove-motcle-key="${key}" style="margin-left:4px; color:inherit; text-decoration:none; font-weight:800;">✕</a></span>`).join("") || `<span class="muted-small">Aucun mot-clé pour l'instant</span>`}
            </div>
            <div style="display:flex; gap:8px; margin-top:8px;">
              <input type="text" id="motcleAddInput_${key}" list="repertoireDatalist" placeholder="Choisir dans la liste ou taper un nouveau mot-clé…" style="flex:1;" />
              <button type="button" class="btn secondary small" data-add-motcle-key="${key}">+ Ajouter</button>
            </div>
            <datalist id="repertoireDatalist">
              ${DIDACTICIEL_REPERTOIRE.map(r=>`<option value="${escapeHtml(r.motcle)}">`).join("")}
            </datalist>
            <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
              <button class="btn small" data-save-activite="${key}">Enregistrer</button>
              <button class="btn secondary small" data-cancel-edit="${key}">Annuler</button>
              <button class="btn secondary small" data-remove-activite="${key}" style="color:var(--danger); margin-left:auto;">🗑️ Retirer cette activité</button>
            </div>
          </div>` : "";

        const adminLink = isAdmin ? `<a class="linklike" data-edit-activite="${key}" style="font-size:11.5px; margin-left:8px;">${editing?"":"✎ Modifier"}</a>` : "";
        const selected = !!(STATE.didacticielSelection && STATE.didacticielSelection[key]);

        return `
        <div class="activite-row" style="flex-direction:column; align-items:stretch;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <label class="txt" style="display:flex; align-items:flex-start; gap:8px; cursor:pointer;">
              <input type="checkbox" data-select-activite="${key}" ${selected?"checked":""} style="margin-top:3px;" />
              <span><b>${escapeHtml(a.nom)}</b>${a.obligatoire?'<span class="obl-tag">OBLIGATOIRE</span>':''}${adminLink}</span>
            </label>
          </div>
          ${a.attendus ? `<div class="muted-small" style="margin-top:5px;"><b>Attendus :</b> ${escapeHtml(a.attendus)}</div>` : ""}
          ${a.exemple ? `<div class="muted-small" style="margin-top:5px; background:#FFFBEA; padding:6px 8px; border-radius:6px;">💡 <b>Exemple concret :</b> ${escapeHtml(a.exemple)}</div>` : ""}
          <div style="margin-top:6px;">${kwChips}</div>
          ${editBlock}
        </div>`;
      }).join("");

      const editingPilier = STATE.didacticielEditPilier === p.id;
      const pilierEditBlock = editingPilier ? `
        <div style="padding:10px 14px; background:#fbfcfe; border-top:1px dashed var(--border);">
          <div class="section-label">Nom du pilier</div>
          <input type="text" id="editPilierNom_${p.id}" value="${escapeHtml(p.nom)}" />
          <div class="section-label" style="margin-top:8px;">Description / pré-requis</div>
          <input type="text" id="editPilierReq_${p.id}" value="${escapeHtml(p.req)}" />
          <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn small" data-save-pilier="${p.id}">Enregistrer</button>
            <button class="btn secondary small" data-cancel-edit-pilier>Annuler</button>
            <button class="btn secondary small" data-remove-pilier="${p.id}" style="color:var(--danger); margin-left:auto;">🗑️ Supprimer ce pilier</button>
          </div>
        </div>` : "";

      return `<div class="pilier-block">
        <div class="pilier-header" style="background:${(PILIER_COLORS[p.id]||{}).bg||'#f7f9fc'}; border-left:4px solid ${(PILIER_COLORS[p.id]||{}).text||'var(--navy)'};">
          <div><div class="name" style="color:${(PILIER_COLORS[p.id]||{}).text||'var(--navy)'};">${p.nom}</div><div class="req">${p.req}</div></div>
          ${isAdmin ? `<a class="linklike" data-edit-pilier="${p.id}" style="font-size:11.5px;">${editingPilier?"Fermer":"✎ Modifier le pilier"}</a>` : ""}
        </div>
        ${pilierEditBlock}
        ${acts}
        ${isAdmin ? `<div class="activite-row"><a class="linklike" data-add-activite="${p.id}">+ Ajouter une activité à ce pilier</a></div>` : ""}
      </div>`;
    }).join("");
    if (isAdmin){
      body += `<div class="card" style="text-align:center;"><a class="linklike" id="addPilierBtn">+ Ajouter un pilier</a></div>`;
    }
    if (isAdmin && STATE.pendingConcordance && STATE.pendingConcordance.length){
      const themeNames = DIDACTICIEL_REPERTOIRE.map(e=>e.motcle);
      const concordanceCard = `
      <div class="card" style="background:#FFF8E8; border-color:#f0dca8;">
        <div class="card-title" style="margin-bottom:8px;">⚠️ Mots-clés non répertoriés (${STATE.pendingConcordance.length})</div>
        <div class="muted-small" style="margin-bottom:10px;">Ces mots-clés, saisis sur une activité, n'existent pas encore dans le répertoire — choisissez comment les y intégrer.</div>
        ${STATE.pendingConcordance.map((kw,ci)=>`
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid #f0dca8;">
            <b style="min-width:160px;">${escapeHtml(kw)}</b>
            <select id="concordanceChoice_${ci}" style="max-width:260px;">
              <option value="__new__">➕ Nouveau thème</option>
              ${themeNames.map(t=>`<option value="${escapeHtml(t)}">Ajouter au thème « ${escapeHtml(t)} »</option>`).join("")}
            </select>
            <button class="btn small" data-resolve-concordance="${ci}">Ajouter</button>
            <a class="linklike" data-ignore-concordance="${ci}" style="font-size:11.5px;">Ignorer</a>
          </div>`).join("")}
      </div>`;
      body = concordanceCard + body;
    }
  } else {
    const q = normalizeSearch(STATE.didacticielSearch);
    const filtered = q ? DIDACTICIEL_REPERTOIRE.filter(e=>{
      const hay = normalizeSearch(e.motcle + " " + e.approfondis.join(" "));
      return hay.includes(q);
    }) : DIDACTICIEL_REPERTOIRE;

    const linkIcon = { biblio:"📄", autre:"🎬", formation:"🎓" };
    const linkLabel = { biblio:"Bibliographie", autre:"Autre lien / vidéo", formation:"Formation" };

    const items = filtered.map(e=>{
      const idx = DIDACTICIEL_REPERTOIRE.indexOf(e);
      const key = e.motcle;
      const isOpen = STATE.didacticielOpen === key;
      const editingRep = STATE.editingRepertoire === idx;
      const approfondisHtml = e.approfondis.length
        ? `<div style="margin-top:8px;">${e.approfondis.map(a=>`<span class="kw-chip" style="cursor:default;">${escapeHtml(a)}</span>`).join("")}</div>`
        : "";
      const liensHtml = e.liens.length
        ? `<div style="margin-top:10px; display:flex; flex-direction:column; gap:5px;">
            ${e.liens.map(l=>`<a href="${escapeHtml(l.url)}" target="_blank" rel="noopener" class="linklike" style="font-size:12.8px;">${linkIcon[l.type]||"🔗"} ${escapeHtml(l.label)} <span class="muted-small">(${linkLabel[l.type]})</span></a>`).join("")}
          </div>`
        : `<div class="muted-small" style="margin-top:8px;">Aucun lien répertorié pour ce mot-clé.</div>`;

      const editBlock = editingRep ? `
        <div style="padding:12px 14px; background:#fbfcfe; border-top:1px dashed var(--border);">
          <div class="section-label">Nom du thème / mot-clé principal</div>
          <input type="text" id="editRepMotcle_${idx}" value="${escapeHtml(e.motcle)}" />
          <div class="section-label" style="margin-top:8px;">Mots-clés approfondis (séparés par des virgules)</div>
          <input type="text" id="editRepApprofondis_${idx}" value="${escapeHtml(e.approfondis.join(", "))}" />
          <div class="section-label" style="margin-top:8px;">Liens (vidéo, bibliographie, formation…)</div>
          ${e.liens.map((l,li)=>`
            <div style="display:flex; gap:6px; margin-bottom:6px; align-items:center; flex-wrap:wrap;">
              <select id="editRepLienType_${idx}_${li}" style="max-width:130px;">
                <option value="biblio" ${l.type==="biblio"?"selected":""}>Bibliographie</option>
                <option value="autre" ${l.type==="autre"?"selected":""}>Vidéo / Autre</option>
                <option value="formation" ${l.type==="formation"?"selected":""}>Formation</option>
              </select>
              <input type="text" id="editRepLienLabel_${idx}_${li}" placeholder="Libellé" value="${escapeHtml(l.label)}" style="flex:1; min-width:120px;" />
              <input type="text" id="editRepLienUrl_${idx}_${li}" placeholder="https://…" value="${escapeHtml(l.url)}" style="flex:2; min-width:160px;" />
              <a class="linklike" data-remove-lien="${idx}_${li}" style="color:var(--danger);">✕</a>
            </div>`).join("")}
          <a class="linklike" data-add-lien="${idx}" style="font-size:12px;">+ Ajouter un lien</a>
          <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn small" data-save-repertoire="${idx}">Enregistrer</button>
            <button class="btn secondary small" data-cancel-repertoire>Annuler</button>
            <a class="linklike" data-remove-repertoire="${idx}" style="color:var(--danger); margin-left:auto;">🗑️ Retirer ce thème</a>
          </div>
        </div>` : "";

      const isAdminRep = STATE.currentExpert && STATE.currentExpert.isAdmin;
      return `
        <div class="pilier-block" id="repentry_${escapeHtml(key).replace(/[^a-zA-Z0-9]/g,"_")}">
          <div class="pilier-header" style="cursor:pointer;">
            <div class="name" data-toggle-mot="${escapeHtml(key)}" style="flex:1;">${escapeHtml(e.motcle)}</div>
            <div class="req" style="display:flex; align-items:center; gap:8px;">
              ${isAdminRep ? `<a class="linklike" data-edit-repertoire="${idx}" style="font-size:11px;">✎ Modifier</a>` : ""}
              <span data-toggle-mot="${escapeHtml(key)}">${e.liens.length} ressource(s)${e.approfondis.length? " · "+e.approfondis.length+" mot(s)-clé(s) approfondi(s)":""} ${isOpen?"▾":"▸"}</span>
            </div>
          </div>
          ${isOpen ? `<div style="padding:12px 14px;">${approfondisHtml}${liensHtml}</div>` : ""}
          ${editBlock}
        </div>`;
    }).join("");

    body = `
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">Répertoire des mots-clés et ressources</div><div class="card-desc">${DIDACTICIEL_REPERTOIRE.length} mots-clés, ${DIDACTICIEL_REPERTOIRE.reduce((s,e)=>s+e.liens.length,0)} liens</div></div>
      </div>
      <input type="text" id="didacticielSearchInput" placeholder="Rechercher un mot-clé (ex. « erreur médicamenteuse », « check-list », « ALARM »…)" value="${escapeHtml(STATE.didacticielSearch||"")}" />
      <div class="muted-small" style="margin:8px 0 14px;">${filtered.length} / ${DIDACTICIEL_REPERTOIRE.length} mots-clés affichés${STATE.didacticielSearch ? ` — <a class="linklike" id="clearDidacticielSearch">réinitialiser</a>` : ""}</div>
      ${items || `<div class="muted-small">Aucun mot-clé ne correspond à cette recherche.</div>`}
      ${isAdmin ? `<div style="margin-top:14px;"><a class="linklike" id="addRepertoireBtn">+ Ajouter un thème</a></div>` : ""}
    </div>`;
  }

  return `${pillsHtml}${selectionBar}${adminBanner}${reglesGestionBlock}${referentielBar}${exportBar}${body}`;
}

function attachDidacticielEvents(){
  document.querySelectorAll("[data-view]").forEach(el=>{
    el.onclick = ()=> setState({ didacticielView: el.getAttribute("data-view") });
  });

  const searchInput = document.getElementById("didacticielSearchInput");
  if (searchInput){
    searchInput.oninput = ()=>{ STATE.didacticielSearch = searchInput.value; render(); const el = document.getElementById("didacticielSearchInput"); if (el){ el.focus(); el.selectionStart = el.value.length; } };
  }
  const clearBtn = document.getElementById("clearDidacticielSearch");
  if (clearBtn) clearBtn.onclick = ()=> setState({ didacticielSearch:"" });
  document.querySelectorAll("[data-toggle-mot]").forEach(el=>{
    el.onclick = ()=>{
      const key = el.getAttribute("data-toggle-mot");
      setState({ didacticielOpen: STATE.didacticielOpen === key ? null : key });
    };
  });
  document.querySelectorAll("[data-jump-mot]").forEach(el=>{
    el.onclick = ()=>{
      const mot = el.getAttribute("data-jump-mot");
      setState({ didacticielView:"repertoire", didacticielOpen: mot, didacticielSearch:"" });
      setTimeout(()=>{
        const target = document.getElementById("repentry_"+mot.replace(/[^a-zA-Z0-9]/g,"_"));
        if (target && target.scrollIntoView) target.scrollIntoView({ behavior:"smooth", block:"center" });
      }, 60);
    };
  });
  document.querySelectorAll("[data-open-link]").forEach(el=>{
    el.onclick = ()=> window.open(el.getAttribute("data-open-link"), "_blank", "noopener");
  });
  document.querySelectorAll("[data-kw-noresource]").forEach(el=>{
    el.onclick = ()=> toast("Aucune fiche répertoriée pour « " + el.getAttribute("data-kw-noresource") + " » pour l'instant.");
  });

  document.querySelectorAll("[data-edit-activite]").forEach(el=>{
    el.onclick = ()=>{
      const key = el.getAttribute("data-edit-activite");
      const idx = key.lastIndexOf("_");
      const pilier = PILIERS.find(p=>p.id===key.slice(0, idx));
      const a = pilier && pilier.activites[parseInt(key.slice(idx+1))];
      setState({ didacticielEditKey: key, editingMotscles: a ? [...(a.motscles||[])] : [] });
    };
  });
  document.querySelectorAll("[data-cancel-edit]").forEach(el=>{
    el.onclick = ()=> setState({ didacticielEditKey:null, editingMotscles:null });
  });
  document.querySelectorAll("[data-add-motcle-key]").forEach(el=>{
    el.onclick = ()=>{
      const key = el.getAttribute("data-add-motcle-key");

      const val = (input.value||"").trim();
      if (!val) return;
      if (!STATE.editingMotscles) STATE.editingMotscles = [];
      const already = STATE.editingMotscles.some(k=> normalizeSearch(k)===normalizeSearch(val));
      if (already){ toast("« " + val + " » est déjà dans la liste."); return; }
      STATE.editingMotscles.push(val);
      render();
    };
  });
  document.querySelectorAll("[data-remove-motcle]").forEach(el=>{
    el.onclick = ()=>{
      const kw = el.getAttribute("data-remove-motcle");
      if (!STATE.editingMotscles) return;
      STATE.editingMotscles = STATE.editingMotscles.filter(k=>k!==kw);
      render();
    };
  });
  document.querySelectorAll("[data-save-activite]").forEach(el=>{
    el.onclick = ()=>{
      const key = el.getAttribute("data-save-activite");
      const idx = key.lastIndexOf("_");
      const pid = key.slice(0, idx), ai = parseInt(key.slice(idx+1));
      const pilier = PILIERS.find(p=>p.id===pid);
      if (!pilier) return;
      const nomEl = document.getElementById("editNom_"+key);
      const oblEl = document.getElementById("editObligatoire_"+key);
      const attendusEl = document.getElementById("editAttendus_"+key);
      const exempleEl = document.getElementById("editExemple_"+key);
      if (nomEl) pilier.activites[ai].nom = nomEl.value.trim() || pilier.activites[ai].nom;
      if (oblEl) pilier.activites[ai].obligatoire = oblEl.checked;
      pilier.activites[ai].attendus = attendusEl.value;
      pilier.activites[ai].exemple = exempleEl ? exempleEl.value : (pilier.activites[ai].exemple || "");
      pilier.activites[ai].motscles = STATE.editingMotscles || pilier.activites[ai].motscles || [];
      const unknown = computeUnknownKeywords(pilier.activites[ai].motscles);
      unknown.forEach(kw=>{ if (!STATE.pendingConcordance.includes(kw)) STATE.pendingConcordance.push(kw); });
      setState({ didacticielEditKey:null, editingMotscles:null });
      toast(unknown.length ? "Mis à jour — " + unknown.length + " mot(s)-clé(s) non répertorié(s) à résoudre ci-dessus." : "Mis à jour pour cette session (administrateur).");
    };

  document.querySelectorAll("[data-remove-activite]").forEach(el=>{
    el.onclick = ()=>{
      const key = el.getAttribute("data-remove-activite");
      const idx = key.lastIndexOf("_");
      const pid = key.slice(0, idx), ai = parseInt(key.slice(idx+1));
      const pilier = PILIERS.find(p=>p.id===pid);
      if (!pilier) return;

      const ok = window.confirm("Retirer définitivement l'activité « " + nom + " » du pilier « " + pilier.nom + " » ?\n\nLes bilans déjà saisis pour cette activité (les années passées) ne seront pas supprimés, mais l'activité n'apparaîtra plus pour les bilans futurs.");

  document.querySelectorAll("[data-edit-repertoire]").forEach(el=>{
    el.onclick = ()=> setState({ editingRepertoire: parseInt(el.getAttribute("data-edit-repertoire")) });

  const cancelRepBtn = document.querySelector("[data-cancel-repertoire]");
  if (cancelRepBtn) cancelRepBtn.onclick = ()=> setState({ editingRepertoire:null });
  function syncRepertoireFieldsToEntry(idx){

        if (urlEl) l.url = urlEl.value.trim();
      });
      entry.liens = entry.liens.filter(l=>l.label && l.url);

      toast("Thème enregistré.");

  document.querySelectorAll("[data-remove-repertoire]").forEach(el=>{
    el.onclick = ()=>{
      const idx = parseInt(el.getAttribute("data-remove-repertoire"));
      const entry = DIDACTICIEL_REPERTOIRE[idx];
      if (!entry) return;
      const ok = window.confirm("Retirer définitivement le thème « " + entry.motcle + " » du répertoire ?\n\nLes mots-clés déjà saisis sur des activités qui pointaient vers ce thème ne seront plus reconnus comme répertoriés.");

      DIDACTICIEL_REPERTOIRE.splice(idx,1);

  const addRepertoireBtn = document.getElementById("addRepertoireBtn");

  document.querySelectorAll("[data-resolve-concordance]").forEach(el=>{
    el.onclick = ()=>{

      if (kw === undefined) return;
      const choiceSel = document.getElementById("concordanceChoice_"+ci);
      const choice = choiceSel.value;
      if (choice === "__new__"){
        insertRepertoireAlphabetically({ motcle:kw, approfondis:[], liens:[] });

      } else {
        const theme = DIDACTICIEL_REPERTOIRE.find(e=>e.motcle===choice);

      render();

  document.querySelectorAll("[data-ignore-concordance]").forEach(el=>{
    el.onclick = ()=>{

      render();
    };

    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if (Array.isArray(data)){
          PILIERS = data; // compatibilité avec un ancien export (piliers seuls)
        } else if (data && Array.isArray(data.piliers)){
          PILIERS = data.piliers;
          if (data.reglesGestion && typeof data.reglesGestion === "object"){
            REGLES_GESTION = Object.assign({}, REGLES_GESTION, data.reglesGestion);
          }
          if (data.repertoire && Array.isArray(data.repertoire)){
            DIDACTICIEL_REPERTOIRE = data.repertoire;

        } else {
          throw new Error("format non reconnu (attendu : tableau de piliers, ou objet { piliers, reglesGestion })");
        }
        setState({ referentielImportedPending:true });
        toast("Référentiel chargé en mémoire (" + PILIERS.length + " pilier(s)) — ATTENTION, ce n'est pas encore permanent : cliquez maintenant sur « Exporter l'application mise à jour » ci-dessus et déposez ce fichier sur GitHub, sinon cet import sera perdu à la prochaine ouverture.", 12000);
      }catch(err){
        toast("Import impossible : " + err.message);
      }
    };
    reader.onerror = ()=> toast("Impossible de lire ce fichier.");

  const editReglesBtn = document.getElementById("editReglesBtn");

    const newExceptions = {};

  const sendSelectionBtn = document.getElementById("sendSelectionBtn");

    if (!resolveMailRecipient(target)) toast("Astuce : renseignez l'adresse mail de cet engagé (ou du référent d'équipe) pour préremplir le destinataire.");
    window.open(buildMailUrl(resolveMailRecipient(target), subject, body), "_blank");
  };

// Génère un fichier HTML autonome et personnalisé, à envoyer à l'engagé (ou au référent
// d'équipe) : il y retrouve sa frise, les attendus/exemples/mots-clés du didacticiel, et ce qui
// a déjà été renseigné pour lui — il complète, puis exporte un fichier chiffré à renvoyer à son
// expert. Ce sens (expert → engagé) n'est volontairement pas chiffré : il ne contient que le
// référentiel et ce que l'expert sait déjà de son propre engagé.
function buildEspaceEngageHtml(e, year){
  const isAccred = isAccreditationStage(e, year);
  const yearsToInclude = (isAccred ? compiledYearsForAccreditation(e, year) : []).concat([year]);
  const stages = stagesFor(e);
  const dates = stageDates(e);
  const friseStages = stages.map((s,i)=>({ label:s, date: dates[i].toISOString().slice(0,10) }));
  const todayPct = computeTodayMarkerPercent(dates);

  const piliersData = PILIERS.map(p=>({
    id:p.id, nom:p.nom, req:p.req,
    activites: p.activites.map(a=>{
      // Le fichier Espace Engagé est autonome : il n'a pas accès au répertoire de Kit CFAR.
      // On résout donc ici, une bonne fois, chaque mot-clé vers ses liens (recommandations,
      // vidéos, bibliographie...) pour que l'engagé en bénéficie directement — c'est là tout
      // l'intérêt d'un didacticiel interactif plutôt qu'une simple liste d'intitulés.
      const ressources = (a.motscles||[]).map(k=>{
        const match = matchRepertoire(k);
        return match ? { motcle: match.motcle, liens: match.liens } : { motcle: k, liens: [] };
      }).filter(r=> r.liens.length > 0);
      return { nom:a.nom.replace(" (OBLIGATOIRE)",""), obligatoire:!!a.obligatoire, attendus:a.attendus||"", exemple:a.exemple||"", ressources:ressources };
    })
  }));

  const reponses = {};
  yearsToInclude.forEach(y=>{
    const statuts = getBilanStatuts(e, y);
    const contenus = getBilanContenus(e, y);
    const yd = {};
    PILIERS.forEach(p=>p.activites.forEach((a,ai)=>{
      const key = p.id+"_"+ai;
      const c = contenus[key];
      yd[key] = { texte: (c && c.texte) || "", realise: statuts[key]==="realise" || statuts[key]==="en_cours" };
    }));
    reponses["y"+y] = yd;
  });

  const eeData = {
    engageNom: e.nom,
    etapeActuelle: stages[year],
    isAccreditation: isAccred,
    years: yearsToInclude.map(y=>({ key:"y"+y, label: stages[y], isCurrent: y===year })),
    frise: { stages: friseStages, todayPct: todayPct, currentIndex: year },
    piliers: piliersData,
    reponses: reponses,
    generePar: STATE.currentExpert.name,
    genereLe: TODAY.toISOString().slice(0,10),
  };

  return ESPACE_ENGAGE_TEMPLATE.replace("__EE_DATA_JSON__", JSON.stringify(eeData));
}

<body><div id="root"></div>
<script>
var EE_DATA = __EE_DATA_JSON__;
// ==== Script interne de l'Espace Engagé ====
// Convention volontaire : chaînes JS délimitées par des guillemets doubles (") pour tout texte
// contenant une apostrophe française, guillemets simples (') pour les attributs HTML à
// l'intérieur. Aucun caractère d'échappement n'est utilisé : une barre oblique inverse serait
// interprétée une première fois lors de l'incorporation de ce script dans le gabarit du
// générateur de Kit CFAR, avant même d'atteindre ce script — mieux vaut l'éviter entièrement.

function eeEscapeHtml(s){
  s = String(s == null ? "" : s);
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function eeNormalizeSearch(s){
  return String(s||"").toLowerCase().normalize("NFD").replace(/[\\u0300-\\u036f]/g,"");
}
var eeLinkIcon = { biblio:"📄", autre:"🎬", formation:"🎓" };
var eeLinkLabel = { biblio:"Bibliographie", autre:"Vidéo / Autre", formation:"Formation" };

var EE_STATE = { activeYear: EE_DATA.years[EE_DATA.years.length-1].key };

function eeRender(){
  var root = document.getElementById("root");
  var html = "";

  html += "<div class='ee-header'>";
  html += "<div class='ee-eyebrow'>CFAR &middot; Accréditation</div>";
  html += "<h1>Espace Engagé</h1>";
  html += "<div class='ee-sub'>" + eeEscapeHtml(EE_DATA.engageNom) + " &mdash; " + eeEscapeHtml(EE_DATA.etapeActuelle) + "</div>";
  html += "</div>";

  html += "<div class='ee-card ee-info'>";
  html += "<p>Bonjour, votre expert vous invite à compléter ci-dessous les activités que vous avez réalisées, à l’aide des attendus, exemples et ressources du didacticiel. Une fois terminé, exportez votre réponse (bouton en bas de page) et renvoyez le fichier généré à votre expert.</p>";
  html += "</div>";

  html += "<div class='ee-card'>";
  html += "<div class='ee-section-label'>Je ne sais pas où renseigner ce que j’ai fait ?</div>";
  html += "<p class='ee-muted'>Tapez un mot-clé (le nom d’un protocole, d’une formation, d’une activité...) pour trouver directement la bonne case ci-dessous.</p>";
  html += "<input type='text' id='eeSearchInput' placeholder='Ex. : check-list, RMM, formation douleur...' />";
  html += "<div id='eeSearchResults'></div>";
  html += "</div>";

  html += "<div class='ee-card ee-prerequis'>";
  html += "<div class='ee-section-label'>À ne pas oublier — pré-requis obligatoires</div>";
  html += "<ul class='ee-prerequis-list'>";
  html += "<li><b>RMM / CREX / REMED</b> — pilier « Sécurité des Patients »</li>";
  html += "<li><b>Check-list</b> utilisée au bloc (ou en réanimation) — pilier « Travail en équipe »</li>";
  html += "<li><b>Formation labellisée Gestion des Risques</b>, 12h sur 4 ans — pilier « Pratiques professionnelles »</li>";
  html += "</ul>";
  html += "<p class='ee-muted'>En plus de ces 3 activités obligatoires, il faut renseigner <b>au moins une activité supplémentaire par pilier</b> (5 piliers au total) — même une petite chose compte, votre expert vous aidera à la formuler si besoin.</p>";
  html += "</div>";

  html += "<div class='ee-card'>";
  html += "<div class='ee-section-label'>Mise à jour du référentiel</div>";
  html += "<p class='ee-muted'>Si votre expert vous signale une mise à jour (nouveaux exemples, mots-clés, liens...), chargez le fichier reçu ici — vos réponses déjà saisies sont conservées, seuls les attendus/exemples/ressources sont actualisés.</p>";
  html += "<input type='file' id='eeRefFile' accept='.json,application/json' />";
  html += "<button class='ee-btn-secondary' id='eeRefUpdateBtn'>Mettre à jour</button>";
  html += "<div id='eeRefMsg' class='ee-muted' style='margin-top:8px;'></div>";
  html += "</div>";

  html += eeRenderFrise();

  if (EE_DATA.years.length > 1){
    html += "<div class='ee-year-tabs'>";
    EE_DATA.years.forEach(function(y){
      var cls = "ee-year-tab" + (y.key === EE_STATE.activeYear ? " active" : "");
      html += "<button class='" + cls + "' data-year='" + y.key + "'>" + eeEscapeHtml(y.label) + (y.isCurrent ? " (année en cours)" : "") + "</button>";
    });
    html += "</div>";
  }

  var yearData = EE_DATA.reponses[EE_STATE.activeYear] || {};
  html += "<div class='ee-reset-row'><a href='#' id='eeResetBtn' class='ee-linklike'>Vider mes réponses pour cette année</a></div>";

  EE_DATA.piliers.forEach(function(p){
    html += "<div class='ee-pilier-block'>";
    html += "<div class='ee-pilier-header'><div class='ee-pilier-name'>" + eeEscapeHtml(p.nom) + "</div><div class='ee-pilier-req'>" + eeEscapeHtml(p.req) + "</div></div>";
    p.activites.forEach(function(a, ai){
      var key = p.id + "_" + ai;
      var rep = yearData[key] || { texte:"", realise:false };
      html += "<div class='ee-activite-row' id='act-" + key + "'>";
      html += "<label class='ee-activite-check'><input type='checkbox' data-check='" + key + "' " + (rep.realise ? "checked" : "") + " /> <b>" + eeEscapeHtml(a.nom) + "</b>" + (a.obligatoire ? " <span class='ee-obl-tag'>OBLIGATOIRE</span>" : "") + "</label>";
      if (a.attendus) html += "<div class='ee-muted'>Attendu : " + eeEscapeHtml(a.attendus) + "</div>";
      if (a.exemple) html += "<div class='ee-exemple'>Exemple : " + eeEscapeHtml(a.exemple) + "</div>";
      if (a.ressources && a.ressources.length){
        html += "<div class='ee-ressources'>";
        a.ressources.forEach(function(r, ri){
          var chipKey = key + "_r" + ri;
          if (r.liens.length === 1){
            var icon = eeLinkIcon[r.liens[0].type] || "🔗";
            html += "<a href='" + eeEscapeHtml(r.liens[0].url) + "' target='_blank' rel='noopener' class='ee-kw-chip'>" + icon + " " + eeEscapeHtml(r.motcle) + "</a>";
          } else {
            html += "<span class='ee-kw-chip' data-toggle-liens='" + chipKey + "'>" + eeEscapeHtml(r.motcle) + " (" + r.liens.length + ") &#9662;</span>";
          }
        });
        html += "</div>";
        a.ressources.forEach(function(r, ri){
          if (r.liens.length <= 1) return;
          var chipKey = key + "_r" + ri;
          html += "<div class='ee-liens-dropdown' id='liens_" + chipKey + "' style='display:none;'>";
          r.liens.forEach(function(l){
            var icon = eeLinkIcon[l.type] || "🔗";
            var typeLabel = eeLinkLabel[l.type] || "";
            html += "<a href='" + eeEscapeHtml(l.url) + "' target='_blank' rel='noopener' class='ee-ressource-link'>" + icon + " " + eeEscapeHtml(l.label) + " <span class='ee-ressource-type'>(" + typeLabel + ")</span></a>";
          });
          html += "</div>";
        });
      }
      html += "<textarea rows='3' data-texte='" + key + "' placeholder='Décrivez ici ce que vous avez fait pour cette activité...'>" + eeEscapeHtml(rep.texte) + "</textarea>";
      html += "</div>";
    });
    html += "</div>";
  });

  html += "<div class='ee-card ee-siam-reminder'>";
  html += "<b>Important :</b> une fois que votre expert vous aura confirmé que votre bilan est complet, pensez impérativement à recopier vous-même vos réponses validées dans le SIAM. Ce fichier ne s’y substitue pas.";
  html += "</div>";

  html += "<div class='ee-card'>";
  html += "<div class='ee-section-label'>Exporter mes réponses</div>";
  html += "<p class='ee-muted'>Choisissez un code que vous communiquerez à votre expert par un autre moyen que ce fichier (téléphone, SMS...) — il lui servira à ouvrir votre réponse.</p>";
  html += "<div class='ee-field'><label>Code de protection</label><input type='password' id='eeCode1' autocomplete='off' /></div>";
  html += "<div class='ee-field'><label>Confirmez le code</label><input type='password' id='eeCode2' autocomplete='off' /></div>";
  html += "<button class='ee-btn' id='eeExportBtn'>Exporter mes réponses (fichier chiffré)</button>";
  html += "<div id='eeExportMsg' class='ee-muted' style='margin-top:8px;'></div>";
  html += "</div>";

  root.innerHTML = html;
  eeAttachEvents();
}

function eeRenderFrise(){
  var html = "<div class='ee-card'><div class='ee-section-label'>Votre parcours</div>";
  html += "<div class='ee-stepper'>";
  html += "<div class='ee-today-marker' style='left:" + EE_DATA.frise.todayPct + "%;'><span class='ee-tag'>Aujourd’hui</span><span class='ee-arrow'>&#9660;</span></div>";
  EE_DATA.frise.stages.forEach(function(s, i){
    var cls = "ee-step" + (i === EE_DATA.frise.currentIndex ? " ee-step-current" : "");
    html += "<div class='" + cls + "'><div class='ee-step-label'>" + eeEscapeHtml(s.label) + "</div><div class='ee-step-date'>" + s.date + "</div></div>";
  });
  html += "</div></div>";
  return html;
}

function eeAttachEvents(){
  document.querySelectorAll("[data-year]").forEach(function(btn){
    btn.onclick = function(){ EE_STATE.activeYear = btn.getAttribute("data-year"); eeRender(); };
  });
  document.querySelectorAll("[data-check]").forEach(function(cb){
    cb.onchange = function(){
      var key = cb.getAttribute("data-check");
      if (!EE_DATA.reponses[EE_STATE.activeYear][key]) EE_DATA.reponses[EE_STATE.activeYear][key] = { texte:"", realise:false };
      EE_DATA.reponses[EE_STATE.activeYear][key].realise = cb.checked;
    };
  });
  document.querySelectorAll("[data-texte]").forEach(function(ta){
    ta.onblur = function(){
      var key = ta.getAttribute("data-texte");
      if (!EE_DATA.reponses[EE_STATE.activeYear][key]) EE_DATA.reponses[EE_STATE.activeYear][key] = { texte:"", realise:false };
      EE_DATA.reponses[EE_STATE.activeYear][key].texte = ta.value;
      if (ta.value.trim() && !EE_DATA.reponses[EE_STATE.activeYear][key].realise){
        EE_DATA.reponses[EE_STATE.activeYear][key].realise = true;
        eeRender();
      }
    };
  });
  var resetBtn = document.getElementById("eeResetBtn");
  if (resetBtn) resetBtn.onclick = function(ev){
    ev.preventDefault();
    var ok = window.confirm("Vider toutes vos réponses pour cette année ? Cette action ne peut pas être annulée.");
    if (!ok) return;
    var yd = EE_DATA.reponses[EE_STATE.activeYear];
    Object.keys(yd).forEach(function(k){ yd[k] = { texte:"", realise:false }; });
    eeRender();
  };
  var exportBtn = document.getElementById("eeExportBtn");
  if (exportBtn) exportBtn.onclick = function(){ eeDoExport(); };
  var refBtn = document.getElementById("eeRefUpdateBtn");
  if (refBtn) refBtn.onclick = function(){ eeDoRefUpdate(); };
  var searchInput = document.getElementById("eeSearchInput");
  if (searchInput) searchInput.oninput = function(){ eeDoSearch(searchInput.value); };
  document.querySelectorAll("[data-toggle-liens]").forEach(function(chip){
    chip.onclick = function(){
      var panel = document.getElementById("liens_" + chip.getAttribute("data-toggle-liens"));
      if (!panel) return;
      var isOpen = panel.style.display !== "none";
      // Un seul volet ouvert à la fois par activité, pour ne pas surcharger la page.
      document.querySelectorAll(".ee-liens-dropdown").forEach(function(p){ p.style.display = "none"; });
      panel.style.display = isOpen ? "none" : "flex";
    };
  });
}

function eeDoSearch(query){
  var resultsEl = document.getElementById("eeSearchResults");
  var q = eeNormalizeSearch(query.trim());
  if (!q){ resultsEl.innerHTML = ""; return; }
  var matches = [];
  EE_DATA.piliers.forEach(function(p){
    p.activites.forEach(function(a, ai){
      var haystack = eeNormalizeSearch(a.nom + " " + (a.attendus||"") + " " + (a.exemple||"") + " " + (a.ressources||[]).map(function(r){ return r.motcle; }).join(" "));
      if (haystack.indexOf(q) !== -1){
        matches.push({ key: p.id + "_" + ai, pilierNom: p.nom, activiteNom: a.nom });
      }
    });
  });
  if (!matches.length){
    resultsEl.innerHTML = "<div class='ee-muted' style='margin-top:8px;'>Aucune activité ne correspond — décrivez votre activité dans la case qui vous semble la plus proche, votre expert pourra la déplacer si besoin.</div>";
    return;
  }
  var html = "<div style='margin-top:8px; display:flex; flex-direction:column; gap:4px;'>";
  matches.slice(0, 8).forEach(function(m){
    html += "<a href='#' class='ee-search-result' data-goto-activite='" + m.key + "'><b>" + eeEscapeHtml(m.activiteNom) + "</b> <span class='ee-muted'>— " + eeEscapeHtml(m.pilierNom) + "</span></a>";
  });
  html += "</div>";
  resultsEl.innerHTML = html;
  document.querySelectorAll("[data-goto-activite]").forEach(function(el){
    el.onclick = function(ev){
      ev.preventDefault();
      var target = document.getElementById("act-" + el.getAttribute("data-goto-activite"));
      if (!target) return;
      target.scrollIntoView({ behavior:"smooth", block:"center" });
      target.classList.add("ee-highlight");
      setTimeout(function(){ target.classList.remove("ee-highlight"); }, 2000);
    };
  });
}

// Résout les mots-clés d'une activité vers leurs liens (recommandations, vidéos,
// bibliographie...) à partir d'un répertoire donné — même logique que Kit CFAR, reproduite
// localement puisque ce fichier autonome n'a pas accès à ses fonctions.
function eeResolveRessources(motscles, repertoire){
  var out = [];
  (motscles||[]).forEach(function(k){
    var norm = eeNormalizeSearch(k);
    var match = (repertoire||[]).find(function(e){ return eeNormalizeSearch(e.motcle) === norm; });
    if (match && match.liens && match.liens.length){
      out.push({ motcle: match.motcle, liens: match.liens });
    }
  });
  return out;
}

function eeDoRefUpdate(){
  var fileInput = document.getElementById("eeRefFile");
  var msg = document.getElementById("eeRefMsg");
  var file = fileInput.files && fileInput.files[0];
  if (!file){ msg.textContent = "Choisissez d’abord un fichier."; return; }
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      var newPiliers = data.piliers || data;
      var repertoire = data.repertoire || [];
      if (!Array.isArray(newPiliers)) throw new Error("le fichier ne contient pas de référentiel reconnaissable");
      var updated = 0;
      newPiliers.forEach(function(np){
        var existing = EE_DATA.piliers.find(function(p){ return p.id === np.id; });
        if (!existing){
          EE_DATA.piliers.push({ id:np.id, nom:np.nom, req:np.req, activites: (np.activites||[]).map(function(a){
            return { nom:a.nom, obligatoire:!!a.obligatoire, attendus:a.attendus||"", exemple:a.exemple||"", ressources: eeResolveRessources(a.motscles, repertoire) };
          }) });
          updated++;
          return;
        }
        existing.nom = np.nom;
        existing.req = np.req;
        (np.activites||[]).forEach(function(na, ai){
          if (!existing.activites[ai]) existing.activites[ai] = { nom:"", obligatoire:false, attendus:"", exemple:"", ressources:[] };
          existing.activites[ai].nom = na.nom;
          existing.activites[ai].obligatoire = !!na.obligatoire;
          existing.activites[ai].attendus = na.attendus || "";
          existing.activites[ai].exemple = na.exemple || "";
          existing.activites[ai].ressources = eeResolveRessources(na.motscles, repertoire);
        });
        updated++;
      });
      // EE_DATA.reponses n’est jamais touché ici : c’est tout l’intérêt de cette mise à jour
      // séparée, pour ne jamais perdre ce que l’engagé a déjà rempli, y compris sur plusieurs
      // années.
      eeRender();
      var newMsg = document.getElementById("eeRefMsg");
      if (newMsg) newMsg.textContent = "Référentiel mis à jour (" + updated + " pilier(s), avec leurs ressources) — vos réponses déjà saisies sont conservées.";
    }catch(err){
      msg.textContent = "Fichier non reconnu : " + err.message;
    }
  };
  reader.readAsText(file);
}

function eeArrayBufferToBase64(buf){
  var bytes = new Uint8Array(buf);
  var binary = "";
  for (var i=0; i<bytes.byteLength; i++){ binary += String.fromCharCode(bytes[i]); }
  return btoa(binary);
}

function eeDeriveKey(code, salt){
  var enc = new TextEncoder();
  return crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]).then(function(keyMaterial){
    return crypto.subtle.deriveKey(
      { name:"PBKDF2", salt: salt, iterations:100000, hash:"SHA-256" },
      keyMaterial, { name:"AES-GCM", length:256 }, false, ["encrypt"]
    );
  });
}

function eeDoExport(){
  var code1 = document.getElementById("eeCode1").value;
  var code2 = document.getElementById("eeCode2").value;
  var msg = document.getElementById("eeExportMsg");
  if (!code1 || code1.length < 4){ msg.textContent = "Choisissez un code d’au moins 4 caractères."; return; }
  if (code1 !== code2){ msg.textContent = "Les deux codes ne correspondent pas."; return; }
  msg.textContent = "Génération en cours...";

  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var payload = {
    engageNom: EE_DATA.engageNom,
    etapeActuelle: EE_DATA.etapeActuelle,
    reponses: EE_DATA.reponses,
    exporteLe: new Date().toISOString().slice(0,10)
  };
  var enc = new TextEncoder();
  var data = enc.encode(JSON.stringify(payload));

  eeDeriveKey(code1, salt).then(function(key){
    return crypto.subtle.encrypt({ name:"AES-GCM", iv: iv }, key, data);
  }).then(function(cipherBuf){
    var pack = {
      v: 1, type: "espace-engage-reponse",
      engageNom: EE_DATA.engageNom,
      salt: eeArrayBufferToBase64(salt),
      iv: eeArrayBufferToBase64(iv),
      data: eeArrayBufferToBase64(cipherBuf)
    };
    var json = JSON.stringify(pack, null, 2);
    var a = document.createElement("a");
    a.href = "data:application/json;charset=utf-8," + encodeURIComponent(json);
    a.download = "Reponse_" + EE_DATA.engageNom.replace(/[^a-z0-9]+/gi,"_").slice(0,40) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    msg.textContent = "Fichier téléchargé. Envoyez-le à votre expert, et communiquez-lui votre code par un autre moyen (téléphone, SMS...).";
    document.getElementById("eeCode1").value = "";
    document.getElementById("eeCode2").value = "";
  }).catch(function(err){
    msg.textContent = "Erreur lors du chiffrement : " + err.message;
  });
}

eeRender();

<\/script>

function buildDidacticielExportHtml(selection){
  const hasSelection = selection && Object.values(selection).some(Boolean);
  const usedMotscles = new Set();
  const pilierSections = PILIERS.map(p=>{
    const acts = p.activites.map((a,ai)=>{
      const key = p.id+"_"+ai;
      if (hasSelection && !selection[key]) return "";
      (a.motscles||[]).forEach(k=>usedMotscles.add(normalizeSearch(k)));
      const kws = (a.motscles||[]).map(k=>{
        const match = matchRepertoire(k);
        return match ? `<a href="#kw_${escapeHtml(match.motcle).replace(/[^a-zA-Z0-9]/g,"_")}">${escapeHtml(k)}</a>` : escapeHtml(k);
      }).join(", ");
      return `<div style="margin:0 0 16px; padding-bottom:14px; border-bottom:1px solid #E2E6ED;">
        <div style="font-weight:700; color:#1B2430;">${escapeHtml(a.nom)}${a.obligatoire?' <span style="color:#9A6400; font-size:11px; font-weight:800;">OBLIGATOIRE</span>':''}</div>
        ${a.attendus?`<div style="color:#667085; font-size:13px; margin-top:4px;"><b>Attendus :</b> ${escapeHtml(a.attendus)}</div>`:""}
        ${a.exemple?`<div style="background:#FFFBEA; padding:6px 8px; border-radius:6px; font-size:12.5px; margin-top:4px;">💡 <b>Exemple concret :</b> ${escapeHtml(a.exemple)}</div>`:""}
        ${kws?`<div style="font-size:12.5px; margin-top:4px;"><b>Mots-clés :</b> ${kws}</div>`:""}
      </div>`;
    }).join("");
    if (hasSelection && !acts) return "";
    return `<h2 style="color:#1F3864; border-bottom:3px solid #1F3864; padding-bottom:8px; margin-top:40px;">${p.nom}</h2>
    <p style="color:#667085; font-size:13px;">${escapeHtml(p.req)}</p>${acts}`;
  }).join("");

  const linkIcon = { biblio:"📄", autre:"🎬", formation:"🎓" };
  const repertoireEntries = hasSelection ? DIDACTICIEL_REPERTOIRE.filter(e=>usedMotscles.has(normalizeSearch(e.motcle))) : DIDACTICIEL_REPERTOIRE;
  const repertoireSection = repertoireEntries.map(e=>{
    const liens = e.liens.map(l=>`<div>${linkIcon[l.type]||"🔗"} <a href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${escapeHtml(l.label)}</a></div>`).join("");
    return `<div id="kw_${escapeHtml(e.motcle).replace(/[^a-zA-Z0-9]/g,"_")}" style="margin:0 0 18px; padding-bottom:12px; border-bottom:1px solid #E2E6ED;">
      <div style="font-weight:700; color:#1F3864;">${escapeHtml(e.motcle)}</div>
      ${e.approfondis.length?`<div style="font-size:12px; color:#667085; margin-top:3px;">${e.approfondis.map(escapeHtml).join(" · ")}</div>`:""}
      <div style="font-size:12.5px; margin-top:6px;">${liens||"<i>Aucun lien répertorié</i>"}</div>
    </div>`;
  }).join("");

  return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Didacticiel Accréditation — CFAR</title>
  <style>body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; max-width:860px; margin:0 auto; padding:40px 24px; color:#1B2430; line-height:1.55;} a{color:#2E5B8A;}</style>
  </head><body>
  <div style="text-align:center; margin-bottom:40px;">
    <div style="font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#0E7C6E; font-weight:800;">CFAR · Accréditation</div>
    <h1 style="color:#1F3864; font-size:28px; margin:8px 0 4px;">Didacticiel Accréditation${hasSelection ? " — Sélection" : ""}</h1>
    <div style="color:#667085; font-size:13px;">Généré le ${fmtDate(TODAY)}${hasSelection ? " par " + escapeHtml(STATE.currentExpert.name) : ""}</div>
  </div>
  ${pilierSections}
  <h2 style="color:#1F3864; border-bottom:3px solid #1F3864; padding-bottom:8px; margin-top:50px;">Répertoire des mots-clés</h2>
  ${repertoireSection}
  </body></html>`;
}

function renderFacturation(){
  const info = FACTURATION_INFO;
  const eiasLines = FACTURATION.filter(l=>l.type==="eias");
  const bilanLines = FACTURATION.filter(l=>l.type==="bilan");
  const eiasAcceptes = eiasLines.filter(l=>l.accepte);
  const eiasRefuses = eiasLines.filter(l=>!l.accepte);
  const totalEias = eiasAcceptes.length * REGLES_GESTION.tarifEias;
  const totalBilans = bilanLines.reduce((s,l)=> s + montantLigne(l), 0);
  const total = totalEias + totalBilans;
  const seuilOk = eiasAcceptes.length >= 5;

  const infoBlock = STATE.showFacturationInfoEdit ? `
    <div class="grid2">
      <div class="field"><label>Nom</label><input type="text" id="fiNom" value="${escapeHtml(info.nom)}" placeholder="Dr Prénom NOM" /></div>
      <div class="field"><label>N° de facture en cours</label><input type="text" id="fiNumero" value="${escapeHtml(info.numeroFacture)}" placeholder="2026/00" /></div>
      <div class="field"><label>Adresse</label><input type="text" id="fiAdresse" value="${escapeHtml(info.adresse)}" /></div>
      <div class="field"><label>Ville</label><input type="text" id="fiVille" value="${escapeHtml(info.ville)}" /></div>
      <div class="field"><label>Téléphone</label><input type="text" id="fiTel" value="${escapeHtml(info.tel)}" /></div>
      <div class="field"><label>Email</label><input type="text" id="fiEmail" value="${escapeHtml(info.email)}" /></div>
      <div class="field"><label>N° SIRET</label><input type="text" id="fiSiret" value="${escapeHtml(info.siret)}" /></div>
      <div class="field"><label>N° inscription Ordre + RPPS</label><input type="text" id="fiRpps" value="${escapeHtml(info.rpps)}" /></div>
    </div>
    <button class="btn small" id="saveFacturationInfoBtn">Enregistrer</button>
    <a class="linklike" id="cancelFacturationInfoBtn" style="margin-left:10px;">Annuler</a>
  ` : `
    <div class="muted-small">
      ${info.nom || "<i>Nom non renseigné</i>"} — ${info.adresse||""} ${info.ville||""}<br/>
      📞 ${info.tel||"—"} · ✉️ ${info.email||"—"}<br/>
      SIRET ${info.siret||"—"} · Ordre/RPPS ${info.rpps||"—"} · Facture n° ${info.numeroFacture||"—"}
    </div>
    <a class="linklike" id="editFacturationInfoBtn" style="font-size:11.5px;">✎ Modifier mes informations de facturation</a>
  `;

  const isAdminFact = STATE.currentExpert && STATE.currentExpert.isAdmin;
  const tarifsBlock = !isAdminFact ? "" : (STATE.showTarifsEdit ? `
  <div class="card">
    <div class="card-title" style="margin-bottom:10px;">⚙️ Tarifs de facturation (administrateur)</div>
    <div class="grid2">
      <div class="field"><label>Tarif EIAS accepté (€)</label><input type="number" id="rgTarifEias" value="${REGLES_GESTION.tarifEias}" min="0" /></div>
      <div class="field"><label>Tarif bilan, par médecin (€)</label><input type="number" id="rgTarifBilan" value="${REGLES_GESTION.tarifBilan}" min="0" /></div>
      <div class="field"><label>Effectif plafond (bilan d'équipe)</label><input type="number" id="rgEffectifPlafond" value="${REGLES_GESTION.effectifBilanPlafond}" min="1" /></div>
    </div>
    <button class="btn small" id="saveTarifsBtn">Enregistrer</button>
    <a class="linklike" id="cancelTarifsBtn" style="margin-left:10px;">Annuler</a>
  </div>` : `
  <div class="card">
    <div class="muted-small">Tarifs actuels : EIAS accepté <b>${REGLES_GESTION.tarifEias} €</b> · Bilan <b>${REGLES_GESTION.tarifBilan} €/médecin</b> (plafonné à <b>${REGLES_GESTION.effectifBilanPlafond}</b> pour un bilan d'équipe).
    <a class="linklike" id="editTarifsBtn" style="font-size:11.5px; margin-left:8px;">✎ Modifier les tarifs</a></div>
  </div>`);

  const summary = `
  <div class="card">
    <div class="card-title" style="margin-bottom:12px;">Récapitulatif de la période en cours</div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14px;">
      <div style="text-align:center;">
        <div style="font-size:24px; font-weight:800; color:var(--navy);">${eiasAcceptes.length}</div>
        <div class="muted-small">EIAS acceptés (${totalEias} €)</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:24px; font-weight:800; color:var(--muted);">${eiasRefuses.length}</div>
        <div class="muted-small">EIAS refusés (non facturables)</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:24px; font-weight:800; color:var(--navy);">${bilanLines.length}</div>
        <div class="muted-small">Bilans (${totalBilans} €)</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:24px; font-weight:800; color:var(--teal);">${total} €</div>
        <div class="muted-small">Total à régler</div>
      </div>
    </div>
    ${!seuilOk ? `<div class="badge warn" style="display:block; margin-top:14px; white-space:normal; padding:8px 12px;">La facturation doit être faite avec 5 EIAS acceptés au minimum (${eiasAcceptes.length}/5 pour l'instant).</div>` : ""}
  </div>`;

  const rows = FACTURATION.map(l=>{
    const montant = montantLigne(l);
    return `
    <tr>
      <td>${l.type==="eias" ? "EIAS" : "Bilan"}</td>
      <td>${escapeHtml(l.engageNom)}</td>
      <td>${escapeHtml(l.theme||"")}</td>
      <td>${escapeHtml(l.numeroSiam||"—")}</td>
      <td>${fmtDate(l.date)}</td>
      <td>
        <select class="status-select ${l.accepte?'realise':'non_retenue'}" data-toggle-accepte="${l.id}">
          <option value="accepte" ${l.accepte?"selected":""}>Accepté</option>
          <option value="refuse" ${!l.accepte?"selected":""}>Refusé</option>
        </select>
      </td>
      <td><b>${montant} €</b></td>
      <td><a class="linklike" data-delete-ligne="${l.id}" style="color:var(--danger); font-size:11.5px;">Supprimer</a></td>
    </tr>`;
  }).join("");

  const table = `
  <div class="card">
    <div class="card-title" style="margin-bottom:10px;">Détail des EIAS et bilans validés</div>
    ${FACTURATION.length ? `<table>
      <thead><tr><th>Type</th><th>Engagé</th><th>Thème / bilan</th><th>N° SIAM</th><th>Date</th><th>Statut</th><th>Montant</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>` : `<div class="muted-small">Aucun EIAS ni bilan validé pour l'instant sur cette période — les lignes apparaissent automatiquement à la validation d'un EIAS ou d'un bilan.</div>`}
  </div>`;

  const exportCard = `
  <div class="card">
    <div class="card-title" style="margin-bottom:8px;">Export</div>
    <div class="muted-small" style="margin-bottom:12px;">Génère la note d'honoraires (Excel) et son annexe détaillée (Word), à adresser au service comptabilité du CFAR et à conserver pour votre propre comptabilité. L'export remet ensuite le compteur à zéro pour la période suivante.</div>
    <button class="btn" id="exportFacturationBtn" ${FACTURATION.length===0?"disabled":""}>📤 Exporter la facture et l'annexe (et remettre à zéro)</button>
  </div>`;

  return `
  <div class="card">
    <div class="card-title" style="margin-bottom:10px;">Mes informations de facturation</div>
    ${infoBlock}
  </div>
  ${tarifsBlock}
  ${summary}
  ${table}
  ${exportCard}`;
}

function attachFacturationEvents(){
  const editBtn = document.getElementById("editFacturationInfoBtn");
  if (editBtn) editBtn.onclick = ()=> setState({ showFacturationInfoEdit:true });
  const cancelBtn = document.getElementById("cancelFacturationInfoBtn");
  if (cancelBtn) cancelBtn.onclick = ()=> setState({ showFacturationInfoEdit:false });
  const saveBtn = document.getElementById("saveFacturationInfoBtn");
  if (saveBtn) saveBtn.onclick = ()=>{
    FACTURATION_INFO.nom = document.getElementById("fiNom").value.trim();
    FACTURATION_INFO.numeroFacture = document.getElementById("fiNumero").value.trim() || "2026/00";
    FACTURATION_INFO.adresse = document.getElementById("fiAdresse").value.trim();
    FACTURATION_INFO.ville = document.getElementById("fiVille").value.trim();
    FACTURATION_INFO.tel = document.getElementById("fiTel").value.trim();
    FACTURATION_INFO.email = document.getElementById("fiEmail").value.trim();
    FACTURATION_INFO.siret = document.getElementById("fiSiret").value.trim();
    FACTURATION_INFO.rpps = document.getElementById("fiRpps").value.trim();
    setState({ showFacturationInfoEdit:false });
    toast("Informations de facturation enregistrées.");
  };

  const editTarifsBtn = document.getElementById("editTarifsBtn");
  if (editTarifsBtn) editTarifsBtn.onclick = ()=> setState({ showTarifsEdit:true });
  const cancelTarifsBtn = document.getElementById("cancelTarifsBtn");
  if (cancelTarifsBtn) cancelTarifsBtn.onclick = ()=> setState({ showTarifsEdit:false });
  const saveTarifsBtn = document.getElementById("saveTarifsBtn");
  if (saveTarifsBtn) saveTarifsBtn.onclick = ()=>{
    REGLES_GESTION.tarifEias = Math.max(0, parseInt(document.getElementById("rgTarifEias").value) || 0);
    REGLES_GESTION.tarifBilan = Math.max(0, parseInt(document.getElementById("rgTarifBilan").value) || 0);
    REGLES_GESTION.effectifBilanPlafond = Math.max(1, parseInt(document.getElementById("rgEffectifPlafond").value) || 1);
    setState({ showTarifsEdit:false });
    toast("Tarifs de facturation mis à jour.");
  };

  document.querySelectorAll("[data-toggle-accepte]").forEach(sel=>{
    sel.onchange = ()=>{
      const l = FACTURATION.find(x=>x.id===sel.getAttribute("data-toggle-accepte"));
      l.accepte = sel.value === "accepte";
      render();
    };
  });
  document.querySelectorAll("[data-delete-ligne]").forEach(el=>{
    el.onclick = ()=>{
      const idx = FACTURATION.findIndex(x=>x.id===el.getAttribute("data-delete-ligne"));
      if (idx < 0) return;
      const ligne = FACTURATION[idx];
      if (ligne.type === "eias"){
        const ok = window.confirm("Supprimer cette ligne de facturation EIAS ?\n\nCela retirera aussi ce cas du dossier de l'engagé et le retirera du compteur d'EIAS de l'année — comme si cette analyse n'avait jamais été validée.");
        if (!ok) return;
        const e = ENGAGES.find(x=>x.id===ligne.engageId);
        if (e){
          if (ligne.dossierId && e.dossiersEias){
            const dIdx = e.dossiersEias.findIndex(d=>d.id===ligne.dossierId);
            if (dIdx>=0) e.dossiersEias.splice(dIdx,1);
          }
          e.eiasRealises = Math.max(0, (e.eiasRealises||0) - 1);
        }
      } else {
        const ok = window.confirm("Supprimer cette ligne de facturation ?");
        if (!ok) return;
      }
      FACTURATION.splice(idx,1);
      toast(ligne.type === "eias" ? "Ligne, dossier et compteur EIAS retirés." : "Ligne de facturation retirée.");
      render();
    };
  });

  const exportBtn = document.getElementById("exportFacturationBtn");
  if (exportBtn) exportBtn.onclick = ()=>{
    exportFacturationExcel();
    exportFacturationWord();
    const ok = window.confirm("La facture et son annexe ont été téléchargées.\n\nConfirmer l'export : le compteur va être remis à zéro pour la période suivante (les lignes actuelles ne seront plus dans l'appli — conservez les fichiers téléchargés).");
    if (!ok) return;
    FACTURATION.length = 0;
    // Incrémente le numéro de facture (2026/00 -> 2026/01, sans hypothèse sur le format exact)
    const m = (FACTURATION_INFO.numeroFacture||"").match(/^(.*?)(\d+)$/);
    if (m) FACTURATION_INFO.numeroFacture = m[1] + String(parseInt(m[2],10)+1).padStart(m[2].length,"0");
    toast("Facture exportée — compteur remis à zéro.");
    render();
  };
}

  set("A25", "Nombre de bilans traités (équivalent, effectif plafonné à 10)"); set("B25", "Prix unitaire"); set("C25", "Total Bilans");
  set("A26", nbBilans); set("B26", REGLES_GESTION.tarifBilan); ws["C26"] = { t:"n", f:"B26*A26" };

function exportFacturationWord(){
  const info = FACTURATION_INFO;
  const byEngage = {};
  FACTURATION.forEach(l=>{
    if (!byEngage[l.engageId]) byEngage[l.engageId] = { nom:l.engageNom, engageId:l.engageId, eias:[], bilans:[] };
    if (l.type==="eias") byEngage[l.engageId].eias.push(l); else byEngage[l.engageId].bilans.push(l);
  });
  // Pour une équipe, l'en-tête du bloc précise le nom de l'équipe, l'établissement ou la ville
  // (issus de son adresse) et le nom du référent — plus lisible qu'un simple nom d'équipe pour
  // le service comptabilité.
  function blockHeader(g){
    const e = findEngage(g.engageId);
    if (!e || e.type !== "equipe") return escapeHtml(g.nom);
    const lieu = e.note || (e.adresse ? e.adresse.split(",").pop().trim() : "");
    const referent = resolveTeamMembers(e).find(m=>m.role==="referent");
    const parts = [e.nom];
    if (lieu) parts.push(lieu);
    if (referent) parts.push("référent : " + referent.nom);
    return escapeHtml(parts.join(" — "));
  }
  const blocks = Object.values(byEngage).map(g=>{
    const eiasHtml = g.eias.map(l=>`<p style="margin:4px 0;">Thème EIAS <b>N° ${escapeHtml(l.numeroSiam||"—")}</b> — ${escapeHtml(l.theme)} — ${l.accepte?"Accepté ☑":"Refusé ☑"}<br/>Date de validation EIAS : ${fmtDate(l.date)}</p>`).join("");
    const bilansHtml = g.bilans.map(l=>`<p style="margin:4px 0;">Type bilan <b>N° ${escapeHtml(l.numeroSiam||"—")}</b> — ${escapeHtml(l.theme)} — ${l.accepte?"Accepté ☑":"Refusé ☑"}<br/>Date de validation Bilan : ${fmtDate(l.date)}</p>`).join("");
    return `<div style="margin:0 0 16px; padding-bottom:12px; border-bottom:1px solid #ccc;"><p><b>${blockHeader(g)}</b></p>${eiasHtml}${bilansHtml}</div>`;
  }).join("");

  const bodyHtml = `
    <h1 style="color:#1F3864; font-size:16pt; border-bottom:2px solid #1F3864; padding-bottom:8px;">Annexe à la note d'honoraires « Expertise Accréditation »</h1>
    <p style="color:#667085;">${escapeHtml(info.nom||"")} — Facture n° ${escapeHtml(info.numeroFacture||"")}</p>
    <p style="font-size:10pt; font-style:italic;">À remplir en correspondance avec la note d'honoraires jointe.</p>
    ${blocks || "<p>Aucune ligne pour cette période.</p>"}
  `;
  const filename = "Annexe_CFAR_" + (info.numeroFacture||"facture").replace(/[^a-zA-Z0-9]+/g,"_") + ".doc";
  downloadWordDoc(bodyHtml, filename);
}
