function statutBadge(statutKey){
  const meta = STATUT_BILAN_META[statutKey] || STATUT_BILAN_META.a_faire;
  return `<span class="badge" style="background:${meta.bg}; color:${meta.color};">${meta.label}</span>`;
}

// Suggère (sans jamais agir automatiquement) la prochaine action à envisager, en s'appuyant
// sur le règlement retard/procédures : ce n'est qu'une aide, l'expert choisit toujours lui-même.
function suggestedAction(e){
  const meta = STATUT_BILAN_META[e.statutBilan];
  if (meta && (meta.terminal || meta.tolere)) return null;
  const dates = stageDates(e);
  const delay = delayStatus(dates[e.cycleIndex], e.statutBilan);
  if (e.statutBilan === "information_contradictoire"){
    const since = e.statutBilanDate ? daysBetween(e.statutBilanDate, TODAY) : 0;
    if (since >= 21) return { key:"avis_defavorable", reason: "l'information contradictoire date de " + since + " jours (délai de 3 semaines dépassé)" };
    return null;
  }
  if (e.statutBilan === "avis_defavorable"){
    const since = e.statutBilanDate ? daysBetween(e.statutBilanDate, TODAY) : 0;
    if (since >= 90) return { key:"avis_defavorable_definitif", reason: "la mise en demeure date de " + since + " jours (délai de 3 mois dépassé)" };
    return null;
  }
  if (delay.level === "danger" && ["a_faire","en_cours","complement_demande"].includes(e.statutBilan)){
    return { key:"information_contradictoire", reason: delay.jours + " jours de retard (au-delà de la tolérance de 90 jours)" };
  }
  return null;
}

function applyEngageAction(e, actionKey){
  e.statutBilan = actionKey;
  e.statutBilanDate = TODAY.toISOString().slice(0,10);
  if (actionKey === "valide"){
    advanceCycle(e);
    // Le statut "Validé" ne concerne que l'étape qui vient de se terminer : la nouvelle étape,
    // elle, n'a encore rien reçu. Sans cette réinitialisation, le badge de délai resterait figé
    // sur "Validé" indéfiniment au lieu de repartir sur un compte à rebours pour la nouvelle
    // échéance — l'expert ne serait alors plus jamais alerté d'un retard sur cette étape.
    e.statutBilan = "a_faire";
    e.statutBilanDate = null;
  }
}

function buildMailto(e, actionKey){
  const tpl = MAIL_TEMPLATES[actionKey];
  if (!tpl) return null;
  const body = tpl.body.replace(/\{\{expert\}\}/g, STATE.currentExpert.name);
  return buildMailUrl(resolveMailRecipient(e), tpl.subject, body, true);
}

// Dessine la frise dans un canvas (pas de dépendance externe type html2canvas) pour pouvoir
// la copier dans le presse-papiers et/ou la télécharger en pièce jointe d'un mail — un lien
// mailto: ne peut de toute façon jamais joindre un fichier automatiquement.
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = String(text).split(" ");
  let line = "", ly = y;
  for (const w of words){
    const test = line + w + " ";
    if (ctx.measureText(test).width > maxWidth && line){
      ctx.fillText(line.trim(), x, ly); line = w + " "; ly += lineHeight;
    } else line = test;
  }
  ctx.fillText(line.trim(), x, ly);
  return ly;
}
const BADGE_CANVAS_COLORS = {
  ok:      { bg:"#E7F5EE", text:"#2F7D5A" },
  warn:    { bg:"#FDF1DA", text:"#9A6400" },
  danger:  { bg:"#FBEAEA", text:"#B33A3A" },
  neutral: { bg:"#eef1f5", text:"#667085" },
};
// Dessine un badge arrondi (pilule) et renvoie sa largeur, pour pouvoir enchaîner plusieurs badges.
function drawCanvasBadge(ctx, text, x, y, colors){
  ctx.font = "bold 11px Arial";
  const paddingX = 11, h = 24, r = 12;
  const w = ctx.measureText(text).width + paddingX*2;
  ctx.fillStyle = colors.bg;
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = colors.text;
  ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(text, x+paddingX, y+h/2+1);
  return w;
}
function buildFriseCanvas(e){
  const stages = stagesFor(e);
  const dates = stageDates(e);
  const meta = STATUT_BILAN_META[e.statutBilan] || STATUT_BILAN_META.a_faire;
  const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;
  const eiasLevel = e.eiasRealises >= attendu ? "ok" : "warn";
  const eiasText = e.eiasRealises + "/" + attendu + " EIAS";
  const delay = delayStatus(dates[e.cycleIndex], e.statutBilan);
  const delayLevel = delay.level === "neutral" ? "neutral" : delay.level;
  const delayText = delay.level === "neutral" ? meta.label : delay.label;

  const W = 780, H = 260;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  if (!ctx) return canvas;
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#1F3864"; ctx.font = "bold 16px Arial"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.fillText("Parcours d'Accréditation — " + e.nom, 24, 30);
  ctx.font = "12px Arial"; ctx.fillStyle = "#667085";
  ctx.fillText("Généré le " + fmtDate(TODAY), 24, 50);

  // Badges colorés — mêmes codes couleur que dans le suivi des engagés, pour repérer d'un
  // coup d'œil où on en est (EIAS de l'année, délai/statut du bilan).
  let bx = 24;
  bx += drawCanvasBadge(ctx, eiasText, bx, 62, BADGE_CANVAS_COLORS[eiasLevel]) + 10;
  drawCanvasBadge(ctx, delayText, bx, 62, BADGE_CANVAS_COLORS[delayLevel]);

  const n = stages.length;
  const marginX = 70;
  const usableW = W - marginX*2;
  const y = 140;
  const step = n > 1 ? usableW/(n-1) : 0;

  ctx.strokeStyle = "#E2E6ED"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(marginX,y); ctx.lineTo(marginX+usableW,y); ctx.stroke();
  if (e.cycleIndex > 0){
    ctx.strokeStyle = "#0E7C6E";
    ctx.beginPath(); ctx.moveTo(marginX,y); ctx.lineTo(marginX+step*e.cycleIndex,y); ctx.stroke();
  }
  for (let i=0;i<n;i++){
    const x = marginX + step*i;
    let fill = "#E4E8EE", border = "#E4E8EE", numColor = "#8894A3";
    if (i < e.cycleIndex){ fill = "#0E7C6E"; border = "#0E7C6E"; numColor = "#ffffff"; }
    else if (i === e.cycleIndex){ fill = "#ffffff"; border = meta.color; numColor = meta.color; }
    ctx.beginPath(); ctx.arc(x,y,16,0,2*Math.PI); ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = border; ctx.stroke();
    ctx.fillStyle = numColor; ctx.font = "bold 13px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(i < e.cycleIndex ? "✓" : String(i+1), x, y+1);

    ctx.fillStyle = "#1B2430"; ctx.font = "10px Arial"; ctx.textBaseline = "alphabetic";
    wrapCanvasText(ctx, stages[i], x, y+34, Math.max(step-8, 90), 12);
    ctx.fillStyle = "#667085"; ctx.font = "9px Arial";
    ctx.fillText(fmtDate(dates[i]), x, y+72);
  }
  ctx.textAlign = "left";
  ctx.fillStyle = "#9DA5B4"; ctx.font = "italic 9px Arial";
  ctx.fillText("Kit CFAR Digital — image générée automatiquement, à joindre à votre message", 24, H-14);
  return canvas;
}

function sendFriseMail(e){
  const canvas = buildFriseCanvas(e);
  const ctxCheck = canvas.getContext && canvas.getContext("2d");
  if (!ctxCheck || !canvas.toBlob){
    toast("Génération d'image indisponible dans ce navigateur — impossible de créer l'aperçu de la frise.");
    return;
  }
  canvas.toBlob(async (blob)=>{
    let copied = false;
    try{
      if (navigator.clipboard && window.ClipboardItem && blob){
        await navigator.clipboard.write([new window.ClipboardItem({ "image/png": blob })]);
        copied = true;
      }
    }catch(err){ copied = false; }

    const filename = "Frise_" + e.nom.replace(/[^a-zA-Z0-9]+/g,"_") + ".png";
    try{
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(err){} }, 5000);
    }catch(err){ /* environnement sans téléchargement possible : on continue quand même */ }

    const subject = "Point sur votre parcours d'Accréditation";
    const body = "Bonjour,\n\nJe reviens vers vous pour faire un point sur votre parcours d'Accréditation" +
      (STATUT_BILAN_META[e.statutBilan] ? " (statut actuel : " + STATUT_BILAN_META[e.statutBilan].label + ")" : "") +
      ". Vous trouverez ci-joint un aperçu de votre frise de suivi" + (copied ? " (image déjà copiée, il vous suffit de la coller ici avec Ctrl+V si elle n'apparaît pas automatiquement)" : " — pensez à joindre le fichier " + filename + " téléchargé") +
      ".\n\nN'hésitez pas à revenir vers moi si vous avez des questions.\n\nCordialement.\nVotre Expert au CFAR : " + STATE.currentExpert.name;
    const mailto = buildMailUrl(resolveMailRecipient(e), subject, body);
    window.open(mailto, "_blank");
    toast(copied
      ? "Image de la frise copiée (Ctrl+V dans le mail) et téléchargée en secours."
      : "Image de la frise téléchargée (" + filename + ") — à joindre manuellement au mail qui vient de s'ouvrir.");
  }, "image/png");
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { day:"2-digit", month:"2-digit", year:"numeric" });
}

  const loadEngagesImportBtn = document.getElementById("loadEngagesImportBtn");

    const fileInput = document.getElementById("importEngagesFile");
    const msg = document.getElementById("importEngagesMsg");
    const file = fileInput.files && fileInput.files[0];
    if (!file){ msg.textContent = "Choisissez d'abord un fichier."; return; }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const wb = window.XLSX.read(new Uint8Array(ev.target.result), { type:"array", cellDates:true });

        // --- Utilitaires de lecture, tolérants aux variations d'un export SIAM à l'autre
        // (espaces superflus, apostrophes typographiques, accents) ---
        const normHeader = (s)=> String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’']/g,"'").replace(/\s+/g," ").trim();
        function parseAnyDate(v){
          if (!v) return null;
          if (Object.prototype.toString.call(v) === "[object Date]"){
            return isNaN(v) ? null : new Date(v).toISOString().slice(0,10);
          }
          const s = String(v).trim();
          let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
          if (m) return m[3] + "-" + m[2].padStart(2,"0") + "-" + m[1].padStart(2,"0");
          m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
          if (m) return m[1] + "-" + m[2].padStart(2,"0") + "-" + m[3].padStart(2,"0");
          return null;
        }
        function titleCase(s){
          return String(s||"").toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m,sep,c)=> sep+c.toUpperCase());
        }
        function splitNomPrenom(raw){
          const trimmed = String(raw||"").trim().replace(/\s+/g," ");
          if (!trimmed) return { nomFamille:"", prenom:"" };
          const words = trimmed.split(" ");
          let idx = -1;
          for (let i=0; i<words.length; i++){
            const w = words[i];
            if (w !== w.toUpperCase() && w !== w.toLowerCase()){ idx = i; break; }
          }
          if (idx <= 0) return { nomFamille: titleCase(trimmed), prenom:"" };
          return { nomFamille: titleCase(words.slice(0, idx).join(" ")), prenom: titleCase(words.slice(idx).join(" ")) };
        }
        function yearsBetween(iso1, iso2){
          if (!iso1 || !iso2) return null;
          return (new Date(iso2) - new Date(iso1)) / (365.25*86400000);
        }

        const sheetName = wb.SheetNames.find(n=> normHeader(n).includes("medecin") || normHeader(n).includes("liste")) || wb.SheetNames[0];
        const ws = wb.Sheets[sheetName];
        const raw = window.XLSX.utils.sheet_to_json(ws, { header:1, defval:"", raw:false });
        let headerRowIdx = raw.findIndex(r=> r.some(c=>normHeader(c)==="nom prenom") && r.some(c=>normHeader(c)==="statut"));
        if (headerRowIdx === -1) headerRowIdx = 0;
        const headerRow = raw[headerRowIdx].map(normHeader);
        const colIdx = (...aliases)=>{
          for (const a of aliases){ const i = headerRow.indexOf(normHeader(a)); if (i !== -1) return i; }
          return -1;
        };
        const iRpps = colIdx("nº rpps","n° rpps","rpps");
        const iNomPrenom = colIdx("nom prenom","nom et prenom");
        const iMode = colIdx("mode d'exercice");
        const iStatut = colIdx("statut");
        const iDateEngagement = colIdx("derniere date engagement");
        const iDateAccred = colIdx("derniere date d'accreditation");
        const iLieu = colIdx("lieu d'exercice");
        const iMail = colIdx("mail","email");
        const iMobile = colIdx("numero de mobile","telephone","numero de telephone");
        const iAdresseUnique = colIdx("adresse");
        const iVoie = colIdx("n° et libelle de voie","n et libelle de voie");
        const iComplement = colIdx("complement d'adresse");
        const iCp = colIdx("code postal");
        const iVille = colIdx("ville");
        const iDateProchainBilan = colIdx("date prochain bilan");
        const iEquipe = colIdx("equipe");

        if (iNomPrenom === -1 || iStatut === -1){
          setState({ importEngagesResultMsg: "Fichier non reconnu : colonnes « Nom Prénom » et/ou « Statut » introuvables. Vérifiez qu'il s'agit bien d'un export du module SIAM « Recherche de médecins », ou du modèle fourni." });
          return;
        }

        const dataRows = raw.slice(headerRowIdx+1);
        const errors = [];
        let nbIndiv = 0, nbEquipes = 0, nbMembres = 0, nbIgnoresDoublons = 0;
        const rppsExistants = new Set(ENGAGES.filter(e=>e.rpps).map(e=>e.rpps.trim()));
        const equipeIdByCode = {};

        dataRows.forEach((r, i)=>{
          const nomPrenomRaw = String(r[iNomPrenom]||"").trim();
          if (!nomPrenomRaw) return;
          const rpps = iRpps!==-1 ? String(r[iRpps]||"").trim() : "";
          if (rpps && rppsExistants.has(rpps)){
            nbIgnoresDoublons++;
            return;
          }
          const { nomFamille, prenom } = splitNomPrenom(nomPrenomRaw);
          const nom = "Dr. " + (prenom ? prenom+" " : "") + (nomFamille || nomPrenomRaw);
          const statutRaw = normHeader(r[iStatut]);
          const estAccredite = statutRaw.startsWith("accredit");
          const dateEngagement = iDateEngagement!==-1 ? parseAnyDate(r[iDateEngagement]) : null;
          const dateAccred = iDateAccred!==-1 ? parseAnyDate(r[iDateAccred]) : null;
          const dateProchainBilan = iDateProchainBilan!==-1 ? parseAnyDate(r[iDateProchainBilan]) : null;
          const equipeCode = iEquipe!==-1 ? String(r[iEquipe]||"").trim() : "";
          const mode = iMode!==-1 ? String(r[iMode]||"").trim() : "";
          const lieu = iLieu!==-1 ? String(r[iLieu]||"").trim() : "";
          const mail = iMail!==-1 ? String(r[iMail]||"").trim() : "";
          const mobile = iMobile!==-1 ? String(r[iMobile]||"").trim() : "";
          let adresse = iAdresseUnique!==-1 ? String(r[iAdresseUnique]||"").trim() : "";
          if (!adresse){
            const parts = [iVoie, iComplement].map(idx=> idx!==-1 ? String(r[idx]||"").trim() : "").filter(Boolean);
            const cpVille = [iCp!==-1?String(r[iCp]||"").trim():"", iVille!==-1?String(r[iVille]||"").trim():""].filter(Boolean).join(" ");
            if (cpVille) parts.push(cpVille);
            adresse = parts.join(", ");
          }

          let accreditationCount, dateEntreeFinal, dateDerniereAccreditationFinal, cycleIndex;
          if (estAccredite){
            accreditationCount = 1;
            dateDerniereAccreditationFinal = dateAccred;
            dateEntreeFinal = dateEngagement || dateAccred;
            const delta = yearsBetween(dateAccred, dateProchainBilan);
            cycleIndex = delta !== null ? Math.min(3, Math.max(0, Math.round(delta) - 1)) : 0;
          } else {
            accreditationCount = 0;
            dateEntreeFinal = dateEngagement || TODAY.toISOString().slice(0,10);
            dateDerniereAccreditationFinal = null;
            cycleIndex = 0;
          }
          const echeanceOverrides = {};
          if (dateProchainBilan) echeanceOverrides[cycleIndex] = dateProchainBilan;

          if (!equipeCode){
            ENGAGES.push({
              id:newEngageId("e"), type:"individuel", nom, prenom, nomFamille, rpps,
              modeExercice: mode || "Non précisé", telephone: mobile, email: mail,
              dateEntree: dateEntreeFinal, accreditationCount, dateDerniereAccreditation: dateDerniereAccreditationFinal, cycleIndex, echeanceOverrides,
              statutBilan:"a_faire", eiasRealises:0, membres:[],
              bilanStatuts:{}, bilanContenus:{}, bilanValence:{}, bilanAnnotations:{}, bilanAppreciations:{},
              dossiersEias:[], dossiersBilan:[], note:lieu, adresse, lastRappelDate:null
            });
            if (rpps) rppsExistants.add(rpps);
            nbIndiv++;
            return;
          }

          if (!equipeIdByCode[equipeCode]){
            const equipeId = newEngageId("e");
            const referentId = newEngageId("e");
            ENGAGES.push(Object.assign({
              id:equipeId, type:"equipe", nom:equipeCode, modeExercice: mode || "Non précisé",
              membres:[referentId], note:lieu, adresse,
            }, blankIndividuelFields(), {
              dateEntree: dateEntreeFinal, accreditationCount, dateDerniereAccreditation: dateDerniereAccreditationFinal, cycleIndex, echeanceOverrides,
            }));
            ENGAGES.push({ id:referentId, type:"membre_equipe", nom, prenom, nomFamille, rpps, qualif:"Anesthésiste", equipeId, role:"referent", email:mail, telephone:mobile });
            equipeIdByCode[equipeCode] = equipeId;
            if (rpps) rppsExistants.add(rpps);
            nbEquipes++;
          } else {
            const equipeId = equipeIdByCode[equipeCode];
            const memberId = newEngageId("e");
            ENGAGES.push({ id:memberId, type:"membre_equipe", nom, prenom, nomFamille, rpps, qualif:"Anesthésiste", equipeId, role:"membre", email:mail, telephone:mobile });
            const equipe = ENGAGES.find(x=>x.id===equipeId);
            if (equipe) equipe.membres.push(memberId);
            if (rpps) rppsExistants.add(rpps);
            nbMembres++;
          }
        });

        let resultMsg = nbIndiv + " engagé(s) individuel(s), " + nbEquipes + " équipe(s) et " + nbMembres + " membre(s) supplémentaire(s) importés.";
        if (nbIgnoresDoublons) resultMsg += "\n" + nbIgnoresDoublons + " ligne(s) ignorée(s) car déjà présente(s) (même RPPS).";
        if (errors.length) resultMsg += "\n\n" + errors.length + " ligne(s) en erreur :\n" + errors.join("\n");
        setState({ importEngagesResultMsg: resultMsg });
        if (nbIndiv + nbEquipes + nbMembres > 0) toast("Import terminé — pensez à sauvegarder (⬇️ Exporter .json) pour ne rien perdre.");
      }catch(err){
        setState({ importEngagesResultMsg: "Fichier non reconnu : " + err.message });
      }
    };
    reader.readAsArrayBuffer(file);

      downloadWordDoc(bilanWordHtml(e, stageIdx>=0?stageIdx:0, dos.syntheseSiam, dos.appreciation), filename);
      toast("Synthèse téléchargée (Word).");
    };
  });
  document.querySelectorAll("[data-resend-bilan]").forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation();
      const e = ENGAGES.find(x=>x.id===el.getAttribute("data-engage"));
      const dos = e && (e.dossiersBilan||[]).find(d=>d.id===el.getAttribute("data-resend-bilan"));
      if (!e || !dos) return;
      if (!resolveMailRecipient(e)) toast("Astuce : renseignez l'adresse mail de l'engagé (ou du référent d'équipe) pour préremplir le destinataire.");
      const subject = "Votre bilan — " + dos.etape + " — Accréditation des Médecins";
      const body = (dos.syntheseEngage||"") + "\n\nCordialement.\nVotre Expert au CFAR : " + STATE.currentExpert.name;
      window.open(buildMailUrl(resolveMailRecipient(e), subject, body), "_blank");
      toast("Mail ouvert — pensez à joindre manuellement la synthèse Word téléchargée.");
    };
  });

  // ---- Actions (statuts + mails) ----
  document.querySelectorAll("[data-send-frise]").forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation();
      const e = ENGAGES.find(x=>x.id===el.getAttribute("data-send-frise"));
      if (!e) return;
      if (!resolveMailRecipient(e)) toast("Astuce : renseignez l'adresse mail de l'engagé (ou du référent d'équipe) pour préremplir le destinataire.");
      sendFriseMail(e);
    };
  });
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation();
      const key = el.getAttribute("data-action");
      const e = ENGAGES.find(x=>x.id===el.getAttribute("data-engage"));
      if (!e) return;
      const label = STATUT_BILAN_META[key].label;
      const ok = window.confirm("Confirmer : « " + label + " » pour " + e.nom + " ?\n\nCette action met à jour le statut affiché et ouvre un mail type dans votre messagerie (modifiable avant envoi).");
      if (!ok) return;
      applyEngageAction(e, key);
      const mailto = buildMailto(e, key);
      if (mailto) window.open(mailto, "_blank");
      if (!resolveMailRecipient(e)) toast("Statut mis à jour (" + label + "). Aucune adresse mail renseignée (engagé ou référent d'équipe) — complétez-la pour préremplir le destinataire.");
      else toast("Statut mis à jour (" + label + ") — mail ouvert dans votre messagerie.");
      render();
    };
  });

  // ---- Aide et édition des modèles de mail (administrateur) ----
  const toggleHelpBtn = document.getElementById("toggleActionsHelpBtn");
  if (toggleHelpBtn) toggleHelpBtn.onclick = ()=> setState({ showActionsHelp: !STATE.showActionsHelp });
  const toggleMailEditBtn = document.getElementById("toggleMailEditBtn");
  if (toggleMailEditBtn) toggleMailEditBtn.onclick = ()=> setState({ showMailTemplateEditor: !STATE.showMailTemplateEditor, editingMailTemplate:null });
  document.querySelectorAll("[data-edit-template]").forEach(el=>{
    el.onclick = ()=> setState({ editingMailTemplate: el.getAttribute("data-edit-template") });
  });
  const cancelTemplateBtn = document.querySelector("[data-cancel-template]");
  if (cancelTemplateBtn) cancelTemplateBtn.onclick = ()=> setState({ editingMailTemplate:null });
  document.querySelectorAll("[data-save-template]").forEach(el=>{
    el.onclick = ()=>{
      const key = el.getAttribute("data-save-template");
      MAIL_TEMPLATES[key].subject = document.getElementById("tplSubject_"+key).value;
      MAIL_TEMPLATES[key].body = document.getElementById("tplBody_"+key).value;
      setState({ editingMailTemplate:null });
      toast("Modèle mis à jour.");
    };
  });

  const toggleAddActionBtn = document.getElementById("toggleAddActionBtn");
  if (toggleAddActionBtn) toggleAddActionBtn.onclick = ()=> setState({ showAddAction:true });
  const cancelNewActionBtn = document.getElementById("cancelNewActionBtn");
  if (cancelNewActionBtn) cancelNewActionBtn.onclick = ()=> setState({ showAddAction:false });
  const saveNewActionBtn = document.getElementById("saveNewActionBtn");
  if (saveNewActionBtn) saveNewActionBtn.onclick = ()=>{
    const label = document.getElementById("newActionLabel").value.trim();
    if (!label){ toast("Indiquez un libellé pour ce nouvel onglet."); return; }
    let key = normalizeSearch(label).replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"") || "action";
    if (STATUT_BILAN_META[key]) key = key + "_" + Date.now();
    const group = document.getElementById("newActionGroup").value;
    const behavior = document.getElementById("newActionBehavior").value;
    const icon = document.getElementById("newActionIcon").value.trim() || "📌";
    const subject = document.getElementById("newActionSubject").value.trim() || label;
    const body = document.getElementById("newActionBody").value || ("Bonjour,\n\n\n\nCordialement.\nVotre Expert au CFAR : {{expert}}");
    const colors = { normal:{color:"#2E5B8A", bg:"#EAF1FB"}, tolere:{color:"#6B4C9A", bg:"#EFE7F7"}, terminal:{color:"#7A1F1F", bg:"#F5DADA"} };
    STATUT_BILAN_META[key] = Object.assign({ label, core:false }, colors[behavior] || colors.normal,
      behavior==="terminal" ? {terminal:true} : behavior==="tolere" ? {tolere:true} : {});
    MAIL_TEMPLATES[key] = { label, subject, body };
    ACTION_DEFS.push({ key, icon, group, core:false });
    setState({ showAddAction:false });
    toast("Onglet « " + label + " » créé.");
  };
  document.querySelectorAll("[data-remove-action]").forEach(el=>{
    el.onclick = ()=>{
      const key = el.getAttribute("data-remove-action");
      const meta = STATUT_BILAN_META[key];
      if (meta && meta.core){ toast("Cet onglet fait partie du socle de l'application et ne peut pas être retiré."); return; }
      const ok = window.confirm("Retirer définitivement l'onglet « " + (meta?meta.label:key) + " » ? Les engagés dont c'est le statut actuel garderont ce statut affiché, mais l'onglet n'apparaîtra plus dans les actions disponibles.");
      if (!ok) return;
      delete STATUT_BILAN_META[key];
      delete MAIL_TEMPLATES[key];
      const idx = ACTION_DEFS.findIndex(a=>a.key===key);
      if (idx>=0) ACTION_DEFS.splice(idx,1);
      toast("Onglet retiré.");
      render();
    };
  });

  // ---- Suppression d'un engagé (irréversible) ----
  const deleteBtn = document.getElementById("deleteEngageBtn");
  if (deleteBtn) deleteBtn.onclick = (ev)=>{ ev.stopPropagation();
    const id = deleteBtn.getAttribute("data-id");
    const e = ENGAGES.find(x=>x.id===id);
    if (!e) return;
    const ok = window.confirm("Supprimer définitivement « " + e.nom + " » ?\n\nToutes les données de cet engagé (bilans, EIAS archivés, historique) seront perdues sans possibilité de récupération. Cette action est irréversible.");
    if (!ok) return;
    const idx = ENGAGES.findIndex(x=>x.id===id);
    if (idx >= 0) ENGAGES.splice(idx, 1);
    toast("Engagé supprimé.");
    setState({ selectedEngageId:null });
  };

  document.querySelectorAll("[data-remove-membre]").forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation();
      const memberId = el.getAttribute("data-remove-membre");
      const member = findEngage(memberId);
      if (!member) return;
      const ok = window.confirm(member.nom + " va sortir de l'équipe et devenir un engagé individuel, en reprenant la position actuelle de l'équipe dans son cycle (même échéance). Continuer ?");
      if (!ok) return;
      const equipe = findEngage(member.equipeId);
      if (equipe) equipe.membres = equipe.membres.filter(id=>id!==memberId);
      // L'engagé qui sort d'une équipe garde la référence d'accréditation de l'équipe (dernière
      // date d'accréditation, étape en cours, échéance) plutôt que de repartir de zéro — c'est
      // cette équipe qui l'a fait progresser jusqu'ici.
      const accreditationCount = equipe ? equipe.accreditationCount : 0;
      const dateDerniereAccreditation = equipe ? equipe.dateDerniereAccreditation : null;
      const cycleIndex = equipe ? equipe.cycleIndex : 0;
      const echeanceOverrides = equipe ? Object.assign({}, equipe.echeanceOverrides) : {};
      Object.assign(member, blankIndividuelFields());
      member.type = "individuel";
      member.modeExercice = member.qualif || "Non précisé";
      member.dateEntree = (equipe && equipe.dateEntree) || TODAY.toISOString().slice(0,10);
      member.accreditationCount = accreditationCount;
      member.dateDerniereAccreditation = dateDerniereAccreditation;
      member.cycleIndex = cycleIndex;
      member.echeanceOverrides = echeanceOverrides;
      delete member.equipeId;
      delete member.role;
      delete member.qualif;
      toast(member.nom + " est maintenant suivi individuellement, à la même échéance que l'équipe qu'il quitte.");
      setState({ selectedEngageId: equipe ? equipe.id : STATE.selectedEngageId });
    };
  });
  document.querySelectorAll("[data-make-referent]").forEach(el=>{
    el.onclick = (ev)=>{ ev.stopPropagation();
      const member = findEngage(el.getAttribute("data-make-referent"));
      if (!member) return;
      const equipe = findEngage(member.equipeId);
      if (equipe) resolveTeamMembers(equipe).forEach(m=>{ m.role = (m.id===member.id) ? "referent" : "membre"; });
      toast(member.nom + " est désormais référent de l'équipe.");
      render();
    };
  });
  const addMembreBtn = document.getElementById("addMembreBtn");
  if (addMembreBtn) addMembreBtn.onclick = ()=> setState({ addMembreOpen: STATE.selectedEngageId, addMembreMode:"direct" });
  const cancelAddMembre = document.querySelector("[data-cancel-add-membre]");
  if (cancelAddMembre) cancelAddMembre.onclick = ()=> setState({ addMembreOpen:null });
  const addMembreModeSel = document.getElementById("addMembreMode");
  if (addMembreModeSel) addMembreModeSel.onchange = ()=> setState({ addMembreMode: addMembreModeSel.value });
  document.querySelectorAll("[data-confirm-add-membre]").forEach(el=>{
    el.onclick = ()=>{
      const equipe = findEngage(el.getAttribute("data-confirm-add-membre"));
      if (!equipe) return;
      if (STATE.addMembreMode === "import"){
        const sel = document.getElementById("importMembreSelect");
        const target = findEngage(sel.value);
        if (!target){ toast("Aucun engagé individuel disponible à importer."); return; }
        target.type = "membre_equipe";
        target.equipeId = equipe.id;
        target.role = "membre";
        target.qualif = target.modeExercice || "Anesthésiste";
        equipe.membres.push(target.id);
        toast(target.nom + " a rejoint l'équipe.");
      } else {
        const nom = document.getElementById("newMembreNom").value.trim();
        if (!nom){ toast("Indiquez le nom du nouveau membre."); return; }
        const qualif = document.getElementById("newMembreQualif").value.trim() || "Anesthésiste";
        const tel = document.getElementById("newMembreTel").value.trim();
        const email = document.getElementById("newMembreEmail").value.trim();
        const memberId = newEngageId("e");
        ENGAGES.push({ id:memberId, type:"membre_equipe", nom, qualif, equipeId:equipe.id, role:"membre", email, telephone:tel });
        equipe.membres.push(memberId);
        toast(nom + " a été ajouté à l'équipe.");
      }
      setState({ addMembreOpen:null });
    };
  });

  const modalBg = document.getElementById("modalBg");
  if (modalBg){
    function captureAddEngageDraft(){
      const g = (id)=> document.getElementById(id) ? document.getElementById(id).value : undefined;
      STATE.addEngageDraft = {
        prenom: g("newPrenom") !== undefined ? g("newPrenom") : STATE.addEngageDraft.prenom,
        nomFamille: g("newNomFamille") !== undefined ? g("newNomFamille") : STATE.addEngageDraft.nomFamille,
        equipeNom: g("newEquipeNom") !== undefined ? g("newEquipeNom") : STATE.addEngageDraft.equipeNom,
        mode: g("newMode") !== undefined ? g("newMode") : STATE.addEngageDraft.mode,
        telephone: g("newTelephone") !== undefined ? g("newTelephone") : STATE.addEngageDraft.telephone,
        email: g("newEmail") !== undefined ? g("newEmail") : STATE.addEngageDraft.email,
        rpps: g("newRpps") !== undefined ? g("newRpps") : STATE.addEngageDraft.rpps,
        qualif: g("newQualif") !== undefined ? g("newQualif") : STATE.addEngageDraft.qualif,
        dateAccreditation: g("newDateAccreditation") !== undefined ? g("newDateAccreditation") : STATE.addEngageDraft.dateAccreditation,
        cycleIndex: g("newCycleIndex") !== undefined ? g("newCycleIndex") : STATE.addEngageDraft.cycleIndex,
        accreditationCount: g("newAccreditationCount") !== undefined ? g("newAccreditationCount") : STATE.addEngageDraft.accreditationCount,
      };
    }
    document.getElementById("cancelAddEngage").onclick = ()=> setState({ showAddEngageModal:false, addEngageType:"individuel", addEngageStatut:"nouveau", addEngageDraft:{}, addEngageFormToken:null });
    const typeSel = document.getElementById("newType");
    typeSel.onchange = ()=>{ captureAddEngageDraft(); setState({ addEngageType: typeSel.value }); };
    const statutSel = document.getElementById("newStatutParcours");
    if (statutSel) statutSel.onchange = ()=>{ captureAddEngageDraft(); setState({ addEngageStatut: statutSel.value }); };
    document.getElementById("confirmAddEngage").onclick = ()=>{
      const type = STATE.addEngageType || "individuel";
      const statutParcours = STATE.addEngageStatut || "nouveau";
      const prenom = document.getElementById("newPrenom").value.trim();
      const nomFamille = document.getElementById("newNomFamille").value.trim();
      const nom = (prenom || nomFamille) ? ("Dr. " + (prenom ? prenom+" " : "") + nomFamille).trim() : (type==="equipe" ? "Nouveau référent" : "Nouvel engagé");
      const telephone = document.getElementById("newTelephone") ? document.getElementById("newTelephone").value.trim() : "";
      const email = document.getElementById("newEmail") ? document.getElementById("newEmail").value.trim() : "";
      const rpps = document.getElementById("newRpps") ? document.getElementById("newRpps").value.trim() : "";

      // --- Cas 1 : rejoint une équipe existante -> crée un membre lié, pas un engagé autonome ---
      if (type === "individuel" && statutParcours === "rejoint_equipe"){
        const equipeId = document.getElementById("newEquipeCible").value;
        const equipe = ENGAGES.find(x=>x.id===equipeId);
        if (!equipe){ alert("Aucune équipe existante à rejoindre — créez d'abord une équipe (Type = Équipe)."); return; }
        const qualif = document.getElementById("newQualif").value.trim() || "Anesthésiste";
        const memberId = newEngageId("e");
        ENGAGES.push({ id:memberId, type:"membre_equipe", nom, prenom, nomFamille, qualif, equipeId, role:"membre", email, telephone, rpps });
        equipe.membres.push(memberId);
        toast(nom + " a rejoint " + equipe.nom + " comme membre.");
        setState({ showAddEngageModal:false, addEngageType:"individuel", addEngageStatut:"nouveau", addEngageDraft:{}, addEngageFormToken:null });
        return;
      }

      // --- Cas 2 : nouvelle équipe -> crée l'équipe (avec son propre statut d'accréditation
      // pour pouvoir ajuster sa frise) + son référent (les champs Nom/tel/email désignent le référent) ---
      if (type === "equipe"){
        const equipeNom = document.getElementById("newEquipeNom").value.trim() || "Nouvelle équipe";
        const mode = document.getElementById("newMode").value.trim() || "Non précisé";
        let accreditationCount = 0, dateDerniereAccreditation = null, cycleIndex = 0;
        if (statutParcours === "existant"){
          const dateAccred = document.getElementById("newDateAccreditation").value;
          if (!dateAccred){ captureAddEngageDraft(); alert("Indiquez la date du dernier bilan d'accréditation validé de l'équipe."); render(); return; }
          dateDerniereAccreditation = dateAccred;
          accreditationCount = Math.max(1, parseInt(document.getElementById("newAccreditationCount").value) || 1);
          cycleIndex = parseInt(document.getElementById("newCycleIndex").value) || 0;
        }
        const equipeId = newEngageId("e");
        const referentId = newEngageId("e");
        ENGAGES.push(Object.assign({
          id:equipeId, type:"equipe", nom:equipeNom, modeExercice:mode,
          dateEntree: TODAY.toISOString().slice(0,10), membres:[referentId],
        }, blankIndividuelFields(), { accreditationCount, dateDerniereAccreditation, cycleIndex }));
        ENGAGES.push({ id:referentId, type:"membre_equipe", nom, prenom, nomFamille, qualif:"Anesthésiste", equipeId, role:"referent", email, telephone, rpps });
        toast("Équipe « " + equipeNom + " » créée avec " + nom + " comme référent.");
        setState({ showAddEngageModal:false, addEngageType:"individuel", addEngageStatut:"nouveau", addEngageDraft:{}, addEngageFormToken:null });
        return;
      }

      // --- Cas 3 : engagé individuel (nouveau ou déjà engagé) ---
      const mode = document.getElementById("newMode").value.trim() || "Non précisé";
      let accreditationCount = 0, dateDerniereAccreditation = null, cycleIndex = 0;
      if (statutParcours === "existant"){
        const dateAccred = document.getElementById("newDateAccreditation").value;
        if (!dateAccred){ captureAddEngageDraft(); alert("Indiquez la date du dernier bilan d'accréditation validé."); render(); return; }
        dateDerniereAccreditation = dateAccred;
        accreditationCount = Math.max(1, parseInt(document.getElementById("newAccreditationCount").value) || 1);
        cycleIndex = parseInt(document.getElementById("newCycleIndex").value) || 0;
      }
      ENGAGES.push({
        id:newEngageId("e"), type:"individuel", nom, prenom, nomFamille, modeExercice:mode, telephone, email, rpps,
        dateEntree: TODAY.toISOString().slice(0,10), accreditationCount, dateDerniereAccreditation, cycleIndex,
        statutBilan:"a_faire", echeanceOverrides:{},
        eiasRealises:0, membres:[],
        bilanStatuts:{}, bilanContenus:{}, bilanValence:{}, bilanAnnotations:{}, bilanAppreciations:{}, dossiersEias:[], dossiersBilan:[], note:"", adresse:"", lastRappelDate:null
      });
      setState({ showAddEngageModal:false, addEngageType:"individuel", addEngageStatut:"nouveau", addEngageDraft:{}, addEngageFormToken:null });
    };
  }
}

/* ============================ MODULE 2 — BILAN ANNUEL ============================ */
function getBilanStatuts(e, year){
  const key = "y"+year;
  if (!e.bilanStatuts[key]){
    const obj = {};
    PILIERS.forEach(p=> p.activites.forEach((a,ai)=>{ obj[p.id+"_"+ai] = a.obligatoire ? "obligatoire" : "non_retenue"; }));
    e.bilanStatuts[key] = obj;
  }
  return e.bilanStatuts[key];
}
function getBilanContenus(e, year){
  if (!e.bilanContenus) e.bilanContenus = {};
  const key = "y"+year;
  if (!e.bilanContenus[key]) e.bilanContenus[key] = {};
  return e.bilanContenus[key];
}
function getBilanValence(e, year){
  if (!e.bilanValence) e.bilanValence = {};
  const key = "y"+year;
  if (!e.bilanValence[key]) e.bilanValence[key] = { pluridisciplinaire:false, pluriprofessionnelle:false };
  return e.bilanValence[key];
}
// Activités cochées "à développer pour l'engagé" (renvoient vers le didacticiel : attendus,
// mots-clés, liens) dans le message qui lui est adressé.
function getBilanAnnotations(e, year){
  if (!e.bilanAnnotations) e.bilanAnnotations = {};
  const key = "y"+year;
  if (!e.bilanAnnotations[key]) e.bilanAnnotations[key] = {};
  return e.bilanAnnotations[key];
}
function getBilanAppreciation(e, year){
  if (!e.bilanAppreciations) e.bilanAppreciations = {};
  const key = "y"+year;
  if (e.bilanAppreciations[key] === undefined) e.bilanAppreciations[key] = "";
  return e.bilanAppreciations[key];
}
function setBilanAppreciation(e, year, val){
  if (!e.bilanAppreciations) e.bilanAppreciations = {};
  e.bilanAppreciations["y"+year] = val;
}

// Brouillon de synthèse (générée et/ou éditée par l'expert), enregistré SANS validation — la
// validation réelle intervient souvent après un appel téléphonique à l'engagé, un recueil de
// précisions... il ne faut donc rien perdre entre-temps si l'expert quitte l'écran.
function getBilanDraft(e, year){
  if (!e.bilanDrafts) e.bilanDrafts = {};
  return e.bilanDrafts["y"+year] || null;
}
function setBilanDraft(e, year, siam, engage, numeroBilan){
  if (!e.bilanDrafts) e.bilanDrafts = {};
  const previous = e.bilanDrafts["y"+year] || {};
  e.bilanDrafts["y"+year] = { siam, engage, numeroBilan: numeroBilan !== undefined ? numeroBilan : previous.numeroBilan, validated: previous.validated || false, savedAt: TODAY.toISOString() };
}
// La validation (l'expert relit et approuve la synthèse) et l'archivage (création de la ligne de
// facturation, avancée de la frise) sont deux étapes distinctes : entre les deux, l'expert doit
// pouvoir continuer à copier/télécharger/envoyer la synthèse déjà validée, sans que tout
// disparaisse comme le ferait une action unique "valider et archiver".
function isBilanValidated(e, year){
  const d = getBilanDraft(e, year);
  return !!(d && d.validated);
}
function setBilanValidated(e, year, val){
  if (!e.bilanDrafts) e.bilanDrafts = {};
  const previous = e.bilanDrafts["y"+year] || {};
  e.bilanDrafts["y"+year] = Object.assign({}, previous, { validated: val });
}

// Le message adressé à l'engagé reprend l'appréciation de l'expert au moment où il est généré —
// si l'expert modifie ensuite son appréciation (ou les activités) sans régénérer ce message, il
// enverrait par erreur une version périmée (ex. une ancienne demande de complément). On retient
// donc l'appréciation utilisée, pour pouvoir alerter en cas de décalage avec l'appréciation
// actuelle.
function getEngageMsgSnapshot(e, year){
  if (!e.bilanEngageSnap) e.bilanEngageSnap = {};
  return e.bilanEngageSnap["y"+year];
}
function setEngageMsgSnapshot(e, year, appreciationVal){
  if (!e.bilanEngageSnap) e.bilanEngageSnap = {};
  e.bilanEngageSnap["y"+year] = appreciationVal;
}
function isEngageMsgStale(e, year){
  const snap = getEngageMsgSnapshot(e, year);
  return snap !== undefined && snap !== getBilanAppreciation(e, year);
}

// Même principe que l'appréciation, mais pour l'ensemble des données du bilan (statuts et
// contenus des activités, valences) : si l'expert les modifie après avoir généré la synthèse
// SIAM, celle-ci ne les reflète plus tant qu'elle n'est pas régénérée.
function computeBilanDataFingerprint(e, year){
  const statuts = getBilanStatuts(e, year);
  const contenus = getBilanContenus(e, year);
  const valence = getBilanValence(e, year);
  const parts = [];
  PILIERS.forEach(p=> p.activites.forEach((a,ai)=>{
    const key = p.id+"_"+ai;
    const c = contenus[key];
    parts.push(key+":"+(statuts[key]||"")+":"+((c&&c.texte)||"").length);
  }));
  parts.push("pluri:"+!!valence.pluridisciplinaire, "prof:"+!!valence.pluriprofessionnelle);
  return parts.join("|");
}
function getBilanDataSnapshot(e, year){
  if (!e.bilanDataSnap) e.bilanDataSnap = {};
  return e.bilanDataSnap["y"+year];
}
function setBilanDataSnapshot(e, year){
  if (!e.bilanDataSnap) e.bilanDataSnap = {};
  e.bilanDataSnap["y"+year] = computeBilanDataFingerprint(e, year);
}
function isBilanSynthStale(e, year){
  const snap = getBilanDataSnapshot(e, year);
  return snap !== undefined && snap !== computeBilanDataFingerprint(e, year);
}

function renderBilan(){
  if (!STATE.selectedEngageId){
    // Même filtre que Gestion des engagés : les membres d'équipe ne sont pas suivis
    // indépendamment (pas de bilan propre), les lister ici créerait des doublons et des
    // confusions (un référent, par ex., apparaîtrait aussi séparément de son équipe).
    const rows = ENGAGES.filter(e=>e.type!=="membre_equipe").map(e=>`
      <tr class="clickable" data-id="${e.id}">
        <td><b>${e.nom}</b></td><td>${e.type==="equipe"?"Équipe":"Individuel"}</td><td>${stagesFor(e)[e.cycleIndex]}</td>
        <td><a class="linklike">Ouvrir le bilan →</a></td>
      </tr>`).join("");
    return `
    <div class="card">
      <div class="card-title" style="margin-bottom:10px;">Choisir un engagé</div>
      <table><thead><tr><th>Engagé</th><th>Type</th><th>Étape</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  }

  const e = ENGAGES.find(x=>x.id===STATE.selectedEngageId);
  const year = STATE.bilanYear || 0;
  const statuts = getBilanStatuts(e, year);
  const yearPills = stagesFor(e).map((s,i)=>`<button class="pill-btn ${year===i?'active':''}" data-year="${i}">${s}</button>`).join("");

  const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;
  const rmmOk = Object.values(statuts).some((v,i)=> false); // placeholder, computed below per pillar 1 index0
  const p1a0 = statuts["p1_0"], p3a0 = statuts["p3_0"];
  const preReqOk = {
    rmm: p1a0 === "realise",
    checklist: p3a0 === "realise",
    formation: true, // demo
    eias: e.eiasRealises >= attendu,
  };

  const contenus = getBilanContenus(e, year);
  const valence = getBilanValence(e, year);
  const annotations = getBilanAnnotations(e, year);
  const pilierBlocks = PILIERS.map(p=>{
    const acts = p.activites.map((a,ai)=>{
      const key = p.id+"_"+ai;
      const val = statuts[key];
      const c = contenus[key] || { texte:"", simplifie:"" };
      const isOpen = STATE.openActiviteDetail === key;
      const detail = isOpen ? `
        <div class="activite-detail">
          <div class="muted-small" style="margin-bottom:6px;">Coller ici le contenu renseigné dans le SIAM pour cette activité (capture d'écran + OCR prévus en V2).</div>
          <textarea rows="3" data-contenu="${key}" placeholder="Contenu collé depuis le SIAM…">${escapeHtml(c.texte)}</textarea>
          ${c.simplifie ? `<div class="simplify-preview"><b>Résumé retenu pour la synthèse :</b> ${escapeHtml(c.simplifie)}</div>` : ""}
        </div>` : "";
      return `
      <div class="activite-row">
        <div class="txt">${a.nom}${a.obligatoire?'<span class="obl-tag">OBLIGATOIRE</span>':''}</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <label class="muted-small" style="display:flex; align-items:center; gap:4px; cursor:pointer;" title="Inclure les attendus/mots-clés/liens du didacticiel pour cette activité dans le message adressé à l'engagé">
            <input type="checkbox" data-annotate="${key}" ${annotations[key]?"checked":""} /> pour l'engagé
          </label>
          <a class="linklike" data-toggle-detail="${key}" style="font-size:11.5px;">${isOpen?"▾":"▸"} Contenu SIAM${c.texte?" ✓":""}</a>
          ${(()=>{
            // Les activités obligatoires admettent "à remplir", "en cours" et "réalisé" — mais
            // pas "non retenue", qui n'a pas de sens pour un pré-requis HAS (on ne peut pas
            // choisir de ne pas retenir une activité obligatoire). On garde malgré tout
            // l'ancienne valeur affichable si des données antérieures à cette règle l'avaient
            // enregistrée différemment, pour ne rien perdre silencieusement.
            const allOptions = [
              { v:"obligatoire", label:"À remplir obligatoirement" },
              { v:"realise", label:"Réalisé" },
              { v:"en_cours", label:"En cours" },
              { v:"non_retenue", label:"Activité non retenue" },
            ];
            const options = a.obligatoire ? allOptions.filter(o=> o.v!=="non_retenue" || o.v===val) : allOptions;
            return `<select class="status-select ${val}" data-pilier="${p.id}" data-ai="${ai}">
            ${options.map(o=>`<option value="${o.v}" ${val===o.v?"selected":""}>${o.label}</option>`).join("")}
          </select>`;
          })()}
        </div>
      </div>${detail}`;
    }).join("");
    const doneCount = p.activites.filter((a,ai)=>{ const v = statuts[p.id+"_"+ai]; return v==="realise" || v==="en_cours"; }).length;
    const totalCount = p.activites.length;
    const pct = totalCount ? Math.round((doneCount/totalCount)*100) : 0;
    const barColor = pct>=100 ? "#2F7D5A" : pct>=50 ? "#9A6400" : "#B33A3A";
    return `<div class="pilier-block">
      <div class="pilier-header"><div class="name">${p.nom}</div><div class="req">${p.req}</div></div>
      <div style="padding:8px 14px 0;">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:#667085; margin-bottom:3px;"><span>${doneCount}/${totalCount} activité(s)</span><span>${pct}%</span></div>
        <div style="background:#EEF0F2; border-radius:6px; height:7px; overflow:hidden;"><div style="width:${pct}%; height:100%; background:${barColor}; border-radius:6px; transition:width .3s;"></div></div>
      </div>
      ${acts}
    </div>`;
  }).join("");

  return `
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">${e.nom}</div><div class="card-desc">${stagesFor(e)[year]}</div></div>
      <a class="linklike" id="backToBilanList">← Changer d'engagé</a>
    </div>
    <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;">${yearPills}</div>
    ${isAccreditationStage(e, year) ? `<div class="card" style="background:#F2FBF9; border-color:#0E7C6E;"><div style="font-size:12.8px;"><b>📋 Bilan d'accréditation.</b> C'est ce bilan qui est examiné par la HAS et qui délivre ou renouvelle l'accréditation. La synthèse générée ci-dessous compile les 3 bilans annuels précédents${compiledYearsForAccreditation(e, year).length ? " (" + compiledYearsForAccreditation(e, year).map(y=>stagesFor(e)[y]).join(", ") + ")" : ""}, pas seulement l'année en cours.</div></div>` : ""}

    <div class="card" style="background:#F2FBF9; border-color:#0E7C6E;">
      <div class="section-label">📬 Faire remplir par l'engagé (optionnel)</div>
      <div class="muted-small" style="margin-bottom:8px;">L'engagé (ou le référent d'équipe) peut compléter lui-même ses activités, à l'aide du didacticiel, dans un fichier séparé qu'il vous renvoie — ce n'est alors plus vous qui recopiez depuis le SIAM. Si l'engagé n'utilise pas cet outil, rien ne change : continuez de coller vous-même depuis le SIAM comme aujourd'hui.</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn secondary small" id="genEspaceEngageBtn">📤 Générer l'espace engagé (à lui envoyer)</button>
        <button class="btn secondary small" id="toggleImportEngageBtn">${STATE.showImportEngage?"Masquer":"📥 Importer sa réponse"}</button>
      </div>
      ${STATE.showImportEngage ? `
      <div style="margin-top:12px; border-top:1px dashed var(--border); padding-top:12px; max-width:420px;">
        <div class="field"><label>Fichier reçu de l'engagé (.json)</label><input type="file" id="importEngageFile" accept=".json,application/json" /></div>
        <div class="field"><label>Code qu'il vous a communiqué séparément</label><input type="password" id="importEngageCode" autocomplete="off" /></div>
        <button class="btn small" id="loadEngageResponseBtn">Charger sa réponse</button>
        <div id="importEngageMsg" class="muted-small" style="margin-top:8px;"></div>
      </div>` : ""}
    </div>

    <div class="section-label" style="margin-top:6px;">Les ${PILIERS.length} piliers</div>
    ${pilierBlocks}

    <div class="grid2" style="margin-top:20px;">
      <div>
        <div class="section-label">Conformité aux pré-requis</div>
        <div style="margin-bottom:6px;"><span class="badge ${preReqOk.rmm?'ok':'warn'}">RMM/CREX/REMED</span></div>
        <div style="margin-bottom:6px;"><span class="badge ${preReqOk.checklist?'ok':'warn'}">Check-list utilisée</span></div>
        <div style="margin-bottom:6px;"><span class="badge ${preReqOk.formation?'ok':'warn'}">Formation Gestion des Risques (12h/4ans)</span></div>
        <div style="margin-bottom:6px;"><span class="badge ${preReqOk.eias?'ok':'warn'}">EIAS : ${e.eiasRealises}/${attendu}</span></div>
      </div>
      <div>
        <div class="section-label">Valence pluridisciplinaire &amp; pluriprofessionnelle</div>
        <div class="muted-small" style="margin-bottom:6px;">À rechercher sur au moins 1 des 5 piliers — cocher si l'expert estime la valence présente ; figurera dans la synthèse.</div>
        <label style="display:flex; align-items:center; gap:6px; font-size:12.8px; margin-bottom:4px;">
          <input type="checkbox" id="valencePluri" ${valence.pluridisciplinaire?"checked":""} /> Valence pluridisciplinaire retenue
        </label>
        <label style="display:flex; align-items:center; gap:6px; font-size:12.8px;">
          <input type="checkbox" id="valenceProf" ${valence.pluriprofessionnelle?"checked":""} /> Valence pluriprofessionnelle retenue
        </label>
      </div>
    </div>

    <div class="section-label" style="margin-top:16px;">Appréciation libre de l'expert</div>
    <textarea rows="3" id="bilanAppreciationInput" placeholder="Votre appréciation personnelle sur l'année écoulée, à intégrer dans une synthèse fluide et agréable à lire…">${escapeHtml(getBilanAppreciation(e, year))}</textarea>
    <div class="muted-small" style="margin:4px 0 0;">Cochez « pour l'engagé » sur les activités pour lesquelles vous voulez renvoyer, dans le message qui lui sera adressé, les attendus/mots-clés/liens du didacticiel (utile pour répondre à une question ou suggérer une activité pour l'année suivante).</div>

    <div style="margin-top:18px;">
      <button class="btn small" id="genSyntheseBtn">📝 Générer la synthèse</button>
      <button class="btn secondary small" id="copyBilanPromptBtn">Copier le prompt (pour toute IA)</button>
      <button class="btn secondary small" id="toggleBilanPasteBtn">${STATE.showBilanPaste?"Masquer":"Coller une réponse IA obtenue ailleurs"}</button>
      ${STATE.bilanSynthese ? `<a class="linklike" id="resetSyntheseBtn" style="margin-left:10px; font-size:12.5px; color:var(--danger);">🔄 Réinitialiser la synthèse et le message</a>` : ""}
      ${STATE.bilanSynthese && isBilanSynthStale(e, year) ? `<div class="badge warn" style="margin-top:8px; display:block; padding:8px 10px;">⚠️ Des activités, contenus ou valences ont été modifiés depuis la génération de cette synthèse — cliquez sur « Générer la synthèse » pour qu'elle en tienne compte.</div>` : ""}
      <div class="muted-small" style="margin-top:6px;">« Générer la synthèse » produit immédiatement un texte structuré à partir des données ci-dessus, sans appel à un service tiers. Pour une synthèse rédigée par une IA, copiez le prompt et soumettez-le à l'outil de votre choix, puis collez sa réponse ci-dessous — rien n'est transmis à un tiers par cette application.</div>
      ${STATE.showBilanPaste ? `
      <div style="margin-top:12px; border-top:1px dashed var(--border); padding-top:12px;">
        ${STATE.bilanPromptText ? `
        <div class="muted-small" style="margin-bottom:6px;">Prompt à copier (fonctionne avec Claude.ai ou toute autre IA capable de suivre des instructions) — facultatif, vous pouvez aussi coller directement une réponse ci-dessous sans être passé par cette étape :</div>
        <textarea rows="5" id="bilanPromptDisplayArea" readonly>${escapeHtml(STATE.bilanPromptText)}</textarea>
        <div style="margin-top:6px;"><button class="btn secondary small" id="selectBilanPromptBtn">Sélectionner tout (si la copie automatique a échoué)</button></div>
        ` : `<div class="muted-small" style="margin-bottom:6px;">Vous pouvez coller directement ci-dessous la réponse d'une IA (JSON) — sans forcément être passé par « Copier le prompt ».</div>`}
        <div class="muted-small" style="margin:12px 0 6px;">Collez ici la réponse obtenue, au format JSON (texte brut uniquement) :</div>
        <textarea rows="6" id="bilanPasteResponseArea" placeholder='{"syntheseSiam": "...", "syntheseEngage": "..."}'></textarea>
        <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn small" id="loadBilanPasteBtn">Charger cette réponse (JSON)</button>
        </div>
      </div>` : ""}
    </div>

    ${STATE.bilanSynthese ? renderBilanReport(e, year) : ""}
  </div>`;
}

function renderBilanReport(e, year){
  const statuts = getBilanStatuts(e, year);
  const contenus = getBilanContenus(e, year);
  const valence = getBilanValence(e, year);
  const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;
  const p1a0 = statuts["p1_0"], p3a0 = statuts["p3_0"];
  const preReq = [
    { label:"RMM / CREX / REMED réalisée(s)", ok: p1a0==="realise" },
    { label:"Check-list sécurité du patient utilisée", ok: p3a0==="realise" },
    { label:"Formation Gestion des Risques (12h/4ans)", ok:true },
    { label:"EIAS : "+e.eiasRealises+"/"+attendu+" réalisé(s)", ok: e.eiasRealises >= attendu },
  ];
  const valenceLignes = [];
  if (valence.pluridisciplinaire) valenceLignes.push("pluridisciplinaire");
  if (valence.pluriprofessionnelle) valenceLignes.push("pluriprofessionnelle");

  const pilierBlocksHtml = PILIERS.map(p=>{
    const items = p.activites.map((a,ai)=>({a, key:p.id+"_"+ai})).filter(o=> statuts[o.key]==="realise" || statuts[o.key]==="en_cours");
    const list = items.length
      ? "<ul>" + items.map(o=>{
          const c = contenus[o.key];
          const label = escapeHtml(o.a.nom.replace(" (OBLIGATOIRE)",""));
          const detail = c && (c.simplifie || c.texte) ? " — " + escapeHtml(truncateForPrompt(c.simplifie || c.texte)) : "";
          return "<li>" + label + detail + "</li>";
        }).join("") + "</ul>"
      : `<div class="none">aucune activité complémentaire retenue à ce stade</div>`;
    return `<div class="report-pilier"><div class="pnom">${p.nom}</div>${list}</div>`;
  }).join("");

  const statutLabel = (e.statutBilan==="transmis"||e.statutBilan==="valide") ? "complet" : "en cours de complétude";

  return `
  <div class="report-card">
    <div class="report-header">
      <div>
        <div class="report-eyebrow">CFAR · Accréditation</div>
        <div class="report-title">${stagesFor(e)[year]} — ${e.nom}</div>
        <div class="report-meta">${e.type==="equipe" ? e.membres.length+" médecins engagés" : "Exercice individuel — "+e.modeExercice} · généré le ${fmtDate(TODAY)}</div>
      </div>
    </div>

    <div class="report-section">
      <h4>Conformité aux pré-requis</h4>
      <div class="report-prereq-grid">
        ${preReq.map(r=>`<div class="report-prereq-item"><span class="badge ${r.ok?'ok':'warn'}">${r.ok?'✓':'!'}</span> ${r.label}</div>`).join("")}
      </div>
    </div>

    <div class="report-section">
      <h4>Valence pluridisciplinaire / pluriprofessionnelle</h4>
      <div style="font-size:13px;">${valenceLignes.length ? "Retenue(s) : " + valenceLignes.join(" et ") : "Aucune valence retenue à ce stade"}</div>
    </div>

    <div class="report-section">
      <h4>EIAS de l'année — thèmes déclarés</h4>
      ${(e.dossiersEias||[]).length ? `<ul>${e.dossiersEias.map(d=>`<li><b>${escapeHtml(d.titre)}</b>${d.motsCles && d.motsCles.length ? " — " + d.motsCles.map(k=>escapeHtml(k)).join(", ") : ""}</li>`).join("")}</ul>` : `<div class="none">Aucune analyse EIAS validée archivée pour l'instant.</div>`}
    </div>

    <div class="report-section">
      <h4>Activités par pilier</h4>
      ${pilierBlocksHtml}
    </div>

    <div class="report-section" style="background:#F2FBF9; border-left:4px solid #0E7C6E; padding:12px 16px; border-radius:6px;">
      <h4>Appréciation de l'expert — à coller dans le SIAM</h4>
      <div style="font-size:13px; white-space:pre-wrap;">${escapeHtml(getBilanAppreciation(e, year)) || `<span class="none">Aucune appréciation libre renseignée à ce stade.</span>`}</div>
    </div>

    <div class="conclusion-box">
      <b>Conclusion :</b> bilan ${statutLabel} — à valider par l'expert avant transmission au SIAM.
    </div>

    <div class="section-label" style="margin-top:18px;">Synthèse (modifiable) — corrigez ou complétez ici avant l'export Word ou l'envoi à l'engagé</div>
    <textarea rows="9" id="syntheseText">${escapeHtml(STATE.bilanSynthese||"")}</textarea>
    <div class="muted-small" style="margin-top:4px;">Vos modifications sont prises en compte immédiatement dans le document Word téléchargeable, le brouillon enregistré et l'archive — inutile de relancer l'IA après une correction manuelle.</div>

    <div class="section-label" style="margin-top:14px;">Message adressé à l'engagé (éditable)</div>
    <textarea rows="6" id="syntheseEngageText">${escapeHtml(STATE.bilanSyntheseEngage||"")}</textarea>
    <div class="muted-small" style="margin-top:4px;">Les liens du didacticiel (mots-clés cochés « pour l'engagé ») sont ajoutés automatiquement après ce texte lors de l'envoi.</div>
    <div style="margin-top:6px;"><a class="linklike" id="regenEngageMsgBtn" style="font-size:12.5px;">🔄 Régénérer ce message avec l'appréciation actuelle</a></div>
    ${isEngageMsgStale(e, year) ? `<div class="badge warn" style="margin-top:8px; display:block; padding:8px 10px;">⚠️ Ce message a été généré avec une appréciation différente de celle actuellement enregistrée — cliquez sur « Régénérer » ci-dessus avant de l'envoyer, sans quoi l'engagé recevra une version périmée (ex. une ancienne demande de complément).</div>` : ""}

    <div style="margin-top:14px; background:#FFF8D6; border:2px solid #E8C74A; border-radius:8px; padding:10px 12px;">
      <label style="font-weight:700; color:#8A6D00; font-size:12.8px;">⚠️ N° de bilan (SIAM) — indispensable pour la facturation</label>
      <input type="text" id="f_numeroSiamBilan" placeholder="Numéro attribué par le SIAM au moment du collage…" value="${escapeHtml((getBilanDraft(e, year)||{}).numeroBilan||"")}" style="margin-top:6px;" />
    </div>

    ${(()=>{ const draft = getBilanDraft(e, year); return draft ? `<div class="muted-small" style="margin-top:6px;">💾 Brouillon enregistré le ${fmtDate(new Date(draft.savedAt))} — ${isBilanValidated(e,year)?"validé, prêt à être archivé":"non validé"}, conservé pour y revenir sans rien perdre.</div>` : ""; })()}

    ${isBilanValidated(e, year) ? `<div class="badge ok" style="margin-top:8px; display:block; padding:8px 10px;">✓ Bilan validé — vous pouvez encore le copier, le télécharger ou l'envoyer autant de fois que nécessaire avant de l'archiver.</div>` : ""}

    <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn secondary small" id="saveBilanDraftBtn">💾 Enregistrer le brouillon (sans valider)</button>
      <button class="btn small" id="copyAppreciationBtn">📋 Copier l'appréciation pour le SIAM</button>
      <button class="btn secondary small" id="downloadBilanWordBtn">⬇️ Télécharger la synthèse complète (Word)</button>
      <button class="btn secondary small" id="sendBilanEngageBtn">✉️ Envoyer à l'engagé</button>
      ${isBilanValidated(e, year)
        ? `<button class="btn teal" id="archiverBilanBtn">📦 Archiver le bilan</button>`
        : `<button class="btn teal" id="validerBilanBtn">✓ Valider le bilan</button>`}
    </div>
  </div>`;
}

function bilanWordHtml(e, year, syntheseText, appreciation){
  const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;
  const statuts = getBilanStatuts(e, year);
  const p1a0 = statuts["p1_0"], p3a0 = statuts["p3_0"];
  const preReq = [
    { label:"RMM / CREX / REMED réalisée(s)", ok: p1a0==="realise" },
    { label:"Check-list sécurité du patient utilisée", ok: p3a0==="realise" },
    { label:"EIAS : "+e.eiasRealises+"/"+attendu+" réalisé(s)", ok: e.eiasRealises >= attendu },
  ];

  return `
  <h1 style="color:#1F3864; font-size:20pt; border-bottom:3px solid #1F3864; padding-bottom:10px; margin-bottom:4px;">${escapeHtml(stagesFor(e)[year])}</h1>
  <p style="color:#1F3864; font-size:14pt; font-weight:bold; margin:6px 0 2px;">${escapeHtml(e.nom)}</p>
  <p style="color:#8894A3; font-size:10pt; margin:0 0 26px;">CFAR · Accréditation — ${escapeHtml(e.type==="equipe" ? e.membres.length+" médecins engagés" : "Exercice individuel — "+e.modeExercice)} · généré le ${fmtDate(TODAY)} par ${escapeHtml(STATE.currentExpert.name)}</p>

  <h2 style="color:#2E5B8A; font-size:14pt; margin:0 0 12px;">Conformité aux pré-requis</h2>
  <table style="width:100%; border-collapse:collapse; margin-bottom:28px;">
    ${preReq.map(r=>`<tr><td style="padding:5px 0; font-size:11pt;"><span style="color:${r.ok?'#2F7D5A':'#9A6400'}; font-weight:bold;">${r.ok?'✓':'!'}</span>&nbsp;&nbsp;${r.label}</td></tr>`).join("")}
  </table>

  <h2 style="color:#2E5B8A; font-size:14pt; margin:0 0 14px;">Synthèse</h2>
  <p style="font-size:11.5pt; line-height:1.6; margin:0 0 28px;">${escapeHtml(syntheseText||"").replace(/\n/g,"<br/>")}</p>

  <div style="height:8px;"></div>
  <div style="background:#E4F4F1; border-left:4px solid #0E7C6E; padding:14px 18px; margin-top:10px; page-break-inside:avoid;">
    <h2 style="color:#0E7C6E; font-size:13pt; margin:0 0 8px;">Appréciation de l'expert</h2>
    <p style="font-size:11.5pt; line-height:1.6; margin:0;">${escapeHtml(appreciation||"Aucune appréciation renseignée.").replace(/\n/g,"<br/>")}</p>
  </div>`;
}

function attachBilanEvents(){
  document.querySelectorAll("tr.clickable").forEach(tr=>{
    tr.onclick = ()=>{

  function deterministicBilanSynth(e, year){
    const statuts = getBilanStatuts(e, year);
    const contenus = getBilanContenus(e, year);
    const valence = getBilanValence(e, year);
    const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;
    const valenceLignes = [];
    if (valence.pluridisciplinaire) valenceLignes.push("pluridisciplinaire");
    if (valence.pluriprofessionnelle) valenceLignes.push("pluriprofessionnelle");
    const valenceTxt = valenceLignes.length ? "Valence(s) retenue(s) par l'expert : " + valenceLignes.join(" et ") + "." : "Aucune valence pluridisciplinaire ou pluriprofessionnelle retenue à ce stade.";
    const lignes = PILIERS.map(p=>{
      const items = p.activites.map((a,ai)=>({a, key:p.id+"_"+ai})).filter(o=> statuts[o.key]==="realise" || statuts[o.key]==="en_cours");
      const txt = items.length ? items.map(o=>{
        const c = contenus[o.key];
        const label = o.a.nom.replace(" (OBLIGATOIRE)","");
        const detail = c && (c.simplifie || c.texte) ? " — " + truncateForPrompt(c.simplifie || c.texte) : "";
        return label + detail;
      }).join(" ; ") : "aucune activité complémentaire retenue à ce stade";
      return `${p.nom} : ${txt}`;
    }).join("\n");
    const themesEias = (e.dossiersEias||[]).length
      ? e.dossiersEias.map(d=>d.titre + (d.motsCles&&d.motsCles.length?" ("+d.motsCles.join(", ")+")":"")).join(" ; ")
      : "aucune analyse EIAS validée archivée pour l'instant";
    const appreciation = getBilanAppreciation(e, year);
    return `${stagesFor(e)[year]} — ${e.nom}
Composition : ${e.type==="equipe" ? e.membres.length+" médecins engagés (mouvements de l'année à préciser)" : "exercice individuel — "+e.modeExercice}
EIAS : ${e.eiasRealises} réalisé(s) sur ${attendu} attendu(s)
${valenceTxt}

Thèmes des EIAS de l'année : ${themesEias}

Activités par pilier :
${lignes}

Conclusion : bilan ${STATE.selectedEngageId && (ENGAGES.find(x=>x.id===STATE.selectedEngageId).statutBilan==="transmis"||ENGAGES.find(x=>x.id===STATE.selectedEngageId).statutBilan==="valide") ? "complet" : "en cours de complétude"} — [à valider par l'expert avant transmission au SIAM]`;
  }
  function deterministicBilanAccreditationSynth(e, year){
    const facts = buildBilanFactsAccreditation(e, year);
    const lignes = facts.activitesParPilier.map(p=>{
      const txt = p.activites.length
        ? p.activites.map(a=> a.nom + " (" + a.annees.join(", ") + ")" + (a.contenu ? " — " + a.contenu : "")).join(" ; ")
        : "aucune activité complémentaire retenue sur la période";
      return `${p.pilier} : ${txt}`;
    }).join("\n");
    const themesEias = facts.themesEias.length ? facts.themesEias.join(" ; ") : "aucune analyse EIAS validée archivée pour l'instant";
    return `${facts.etape} — ${e.nom}
Période compilée : ${facts.periodeCouverte.join(", ")}
Composition : ${facts.composition}
EIAS sur la période : ${facts.eiasSurLaPeriode}

Thèmes des EIAS : ${themesEias}

Activités par pilier sur les 3 années précédentes :
${lignes}

Conclusion : bilan d'accréditation compilant les bilans annuels ${facts.periodeCouverte.join(", ")} — [à valider par l'expert avant transmission au SIAM et à la HAS]`;
  }

    if (!contenus[k]) contenus[k] = { texte:"", simplifie:"" };
    contenus[k].texte = contenuTextarea.value;
    // Remplir le contenu d'une activité signifie qu'elle a été traitée : si son statut est
    // resté sur la valeur par défaut ("à remplir obligatoirement"), on le fait automatiquement
    // basculer à "Réalisé" — sans quoi le contenu saisi est invisible pour la synthèse, qui ne
    // reprend que les activités marquées réalisées ou en cours.
    const statuts = getBilanStatuts(e, year);
    if (contenuTextarea.value.trim() && statuts[k] === "obligatoire"){
      statuts[k] = "realise";
      toast("Statut de l'activité passé à « Réalisé » (contenu renseigné).");
      render();
    }
  };
}

function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// Détection basique (par motifs) d'éléments potentiellement identifiants — noms d'établissement
// ou de personne. Ce n'est PAS une anonymisation garantie (cf. spécification §3.2) : une détection
// sémantique assistée par IA, avec validation humaine systématique, est prévue pour la V2. Ici,
// on vise un filet de sécurité simple et immédiat, pas un remplacement de la vigilance de l'expert.
function scanForIdentifiers(text){
  if (!text) return [];
  const found = new Set();
  const estabRe = /\b(clinique|hôpital|hopital|chu|ch|centre hospitalier|polyclinique|ehpad)\s+(de\s+|du\s+|d['’]|des\s+)?[A-ZÀ-Ü][\wÀ-ÿ'’\-]*(?:\s+[A-ZÀ-Ü][\wÀ-ÿ'’\-]*){0,3}/gi;
  const personRe = /\b(dr\.?|docteur|pr\.?|professeur|mme|m\.)\s+[A-ZÀ-Ü][\wÀ-ÿ'’\-]+/gi;
  let m;
  while ((m = estabRe.exec(text))) found.add(m[0].trim());
  while ((m = personRe.exec(text))) found.add(m[0].trim());
  return Array.from(found);
}

function collectEiasFullText(d, cr){
  d = d || {}; cr = cr || {};
  return [d.titre, d.description, d.causeImmediate, d.causesProfondes, d.barrieres, d.axes, d.confrontationLitterature, cr.pointsForts, cr.pointsAmeliorer, cr.complementExpert]
    .filter(Boolean).join("\n");
}

function defaultEiasInputs(){
  return { titre:"", recit:"", comment:"", pourquoi:"", barrieresEfficaces:"", barrieresInefficaces:"", axes:"" };
}

// Si un cas a déjà été validé une première fois (comptée/facturée), et que l'expert régénère
// ou recolle une nouvelle réponse pour ce MÊME cas après l'avoir déverrouillé, on reporte les
// marqueurs pour que la revalidation mette à jour l'existant au lieu de recompter/refacturer.
function carryRecordMarkers(oldDraft, newDraft){
  if (oldDraft && oldDraft._recorded){
    newDraft._recorded = true;
    newDraft._dossierId = oldDraft._dossierId;
    newDraft._facturationId = oldDraft._facturationId;
  }
  return newDraft;
}

// Le travail EIAS en cours (non encore validé) est sauvegardé sur la fiche de l'engagé lui-même
// (e.eiasEnCours), afin de survivre à un changement d'onglet et d'être inclus dans l'export JSON.
// Le "mode test" reste volontairement hors de ce mécanisme : rien n'est attaché à un dossier,
// donc rien n'est conservé — c'est un espace d'essai assumé comme tel.
function persistEiasWork(){
  if (STATE.selectedEngageId && !STATE.eiasTestMode){
    const e = ENGAGES.find(x=>x.id===STATE.selectedEngageId);
    if (e){
      // Un cas déjà validé (et donc archivé dans le dossier + la facturation) ne doit jamais
      // être reversé en "travail en cours" — sinon il ressuscite avec le badge "non validé"
      // et masque le fait qu'il a bien été traité.
      if (STATE.eiasValidated){
        e.eiasEnCours = null;
        return;
      }
      const hasContent = STATE.eiasDraft || Object.values(STATE.eiasInputs||{}).some(v=> v && ("" + v).trim());
      // Copie profonde impérative : stocker par référence ferait qu'une saisie ultérieure pour
      // un AUTRE engagé (ou un bug d'aiguillage) pourrait modifier à tort ce qui est déjà
      // enregistré ici pour celui-ci.
      e.eiasEnCours = hasContent ? {
        inputs: JSON.parse(JSON.stringify(STATE.eiasInputs||{})),
        draft: STATE.eiasDraft ? JSON.parse(JSON.stringify(STATE.eiasDraft)) : null,
        validated: STATE.eiasValidated
      } : null;
    }
  }
}
function loadEiasWork(engageId){
  const e = ENGAGES.find(x=>x.id===engageId);
  if (e && e.eiasEnCours){
    // Copie profonde ici aussi, pour la même raison, dans l'autre sens.
    STATE.eiasInputs = e.eiasEnCours.inputs ? JSON.parse(JSON.stringify(e.eiasEnCours.inputs)) : defaultEiasInputs();
    STATE.eiasDraft = e.eiasEnCours.draft ? JSON.parse(JSON.stringify(e.eiasEnCours.draft)) : null;
    STATE.eiasValidated = !!e.eiasEnCours.validated;
  } else {
    STATE.eiasInputs = defaultEiasInputs();
    STATE.eiasDraft = null;
    STATE.eiasValidated = false;
  }
  STATE.eiasError = ""; STATE.eiasLoading = false;
}
function openEiasForEngage(engageId){
  persistEiasWork();
  loadEiasWork(engageId);
  setState({ activeTab:"eias", selectedEngageId: engageId, eiasTestMode:false });
}
function openEiasTestMode(){
  persistEiasWork();
  setState({ activeTab:"eias", selectedEngageId:null, eiasTestMode:true, eiasInputs: defaultEiasInputs(), eiasDraft:null, eiasValidated:false, eiasError:"" });
}
function closeEiasSession(){
  persistEiasWork();
  setState({ selectedEngageId:null, eiasTestMode:false, eiasDraft:null, eiasInputs: defaultEiasInputs(), eiasValidated:false, eiasError:"" });
}

function eiasPlainText(d, cr){
  cr = cr || {};
  const kw = (d.motsCles||[]).join(", ") || "—";
  const critiqueBlock = (cr.pointsForts || cr.pointsAmeliorer || cr.complementExpert) ? `

6. Analyse contradictoire de l'expert :
${cr.pointsForts ? "Points forts : " + cr.pointsForts : ""}
${cr.pointsAmeliorer ? "Points complétés par l'expert : " + cr.pointsAmeliorer : ""}
${cr.complementExpert ? "Complément apporté par l'expert : " + cr.complementExpert : ""}` : "";
  return `${d.titre||""}

1. Description :
${d.description||""}

2. Comment ça s'est passé ? (cause immédiate) :
${d.causeImmediate||""}

3. Pourquoi ça s'est passé ? (causes profondes — grille ALARM) :
${d.causesProfondes||""}

4. Barrières :
${d.barrieres||""}

5. Axes d'amélioration :
${d.axes||""}
${d.confrontationLitterature ? "Confrontation à la littérature : " + d.confrontationLitterature : ""}${critiqueBlock}

// Mail didactique vers l'engagé après validation : reprend la critique (points forts /
// points à compléter / complément de l'expert) — l'intérêt pédagogique de l'analyse
// contradictoire — puis la synthèse telle que versée au SIAM, sans le jargon "base commune".
function buildEiasEngageMailto(e, d, cr){
  cr = cr || {};
  const tpl = MAIL_TEMPLATES.eias_retour;
  const critiqueTxt = [
    cr.pointsForts ? "Points forts de votre analyse : " + cr.pointsForts : "",
    cr.pointsAmeliorer ? "Points à approfondir : " + cr.pointsAmeliorer : "",
    cr.complementExpert ? "Complément apporté par l'expert : " + cr.complementExpert : "",
  ].filter(Boolean).join("\n\n") || "—";
  const syntheseTxt = eiasPlainText(d, {});
  const subject = tpl.subject.replace("{{titre}}", d.titre || "votre EIAS");
  const body = tpl.body
    .replace("{{critique}}", critiqueTxt)
    .replace("{{synthese}}", syntheseTxt)
    .replace(/\{\{expert\}\}/g, STATE.currentExpert.name);
  return buildMailUrl(resolveMailRecipient(e), subject, body);
}

// Reconstruit un fichier HTML complet et autonome, identique à celui-ci, mais avec le
// référentiel (piliers), les règles de gestion et les modèles de mail actuellement en mémoire
// (donc avec toutes les modifications de l'administrateur). À déposer sur GitHub à la place de
// l'actuel index.html : chaque expert n'a alors qu'à faire ⌘+Maj+R, exactement comme pour MTC
// Consultation — aucun export/import séparé n'est nécessaire une fois ce fichier repoussé.
function buildUpdatedAppHtml(){
  let out = ORIGINAL_FULL_HTML;
  const replace = (startTag, endTag, varName, value)=>{
    const s = out.indexOf(startTag);
    const e = out.indexOf(endTag, s);
    if (s === -1 || e === -1) throw new Error("marqueur introuvable (" + varName + ") — export impossible");
    const before = out.slice(0, s);
    const after = out.slice(e + endTag.length);
    out = before + startTag + "\nlet " + varName + " = " + JSON.stringify(value) + ";\n" + endTag + after;
  };
  replace("/*__PILIERS_START__*/", "/*__PILIERS_END__*/", "PILIERS", PILIERS);
  replace("/*__REGLES_START__*/", "/*__REGLES_END__*/", "REGLES_GESTION", REGLES_GESTION);
  replace("/*__MAILTPL_START__*/", "/*__MAILTPL_END__*/", "MAIL_TEMPLATES", MAIL_TEMPLATES);
  replace("/*__STATUTMETA_START__*/", "/*__STATUTMETA_END__*/", "STATUT_BILAN_META", STATUT_BILAN_META);
  replace("/*__ACTIONDEFS_START__*/", "/*__ACTIONDEFS_END__*/", "ACTION_DEFS", ACTION_DEFS);
  replace("/*__REPERTOIRE_START__*/", "/*__REPERTOIRE_END__*/", "DIDACTICIEL_REPERTOIRE", DIDACTICIEL_REPERTOIRE);
  return out;
}
function exportUpdatedApp(){
  const html = buildUpdatedAppHtml();
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "index.html";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(err){} }, 5000);
}

// Chiffrement des réponses renvoyées par l'engagé : AES-256-GCM avec clé dérivée d'un code par
// PBKDF2, via l'API Web Crypto native du navigateur — aucune bibliothèque tierce, donc aucune
// nouvelle dépendance ni service externe. Seul le retour de l'engagé (nouveau contenu clinique)
// est chiffré ; l'aller (référentiel + ce que l'expert sait déjà) ne l'est pas.
async function deriveEspaceKey(code, saltB64){
  const salt = Uint8Array.from(atob(saltB64), c=>c.charCodeAt(0));
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt, iterations:100000, hash:"SHA-256" },
    keyMaterial, { name:"AES-GCM", length:256 }, false, ["decrypt"]
  );
}
async function decryptEspacePackage(pack, code){
  const key = await deriveEspaceKey(code, pack.salt);
  const iv = Uint8Array.from(atob(pack.iv), c=>c.charCodeAt(0));
  const data = Uint8Array.from(atob(pack.data), c=>c.charCodeAt(0));
  const plainBuf = await crypto.subtle.decrypt({ name:"AES-GCM", iv }, key, data);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

          const dossier = (e.dossiersEias||[]).find(x=>x.id===STATE.eiasDraft._dossierId);
