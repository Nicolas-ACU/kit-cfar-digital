<html lang="fr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kit CFAR Digital</title>
<style>
  :root{
    --navy:#1F3864;
    --navy-deep:#152845;
    --blue:#2E5B8A;
    --teal:#0E7C6E;
    --teal-bg:#E4F4F1;
    --bg:#F4F6F9;
    --card:#FFFFFF;
    --border:#E2E6ED;
    --text:#1B2430;
    --muted:#667085;
    --success:#2F7D5A;
    --success-bg:#E7F5EE;
    --warning:#9A6400;
    --warning-bg:#FDF1DA;
    --danger:#B33A3A;
    --danger-bg:#FBEAEA;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14.5px;
    line-height:1.5;
  }
  .app{ display:flex; min-height:100vh; }

  /* ---------- LOGIN ---------- */
  .login-screen{
    min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 20% 20%, #24467a 0%, var(--navy-deep) 55%, #0e1c31 100%);
  }
  .login-card{
    background:var(--card); width:380px; padding:32px 30px; border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .login-eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--teal); font-weight:700; }
  .login-title{ font-size:22px; font-weight:700; color:var(--navy); margin:6px 0 2px; }
  .login-sub{ color:var(--muted); font-size:13px; margin-bottom:22px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:5px; }
  .field select, .field input{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;
    background:#fbfcfe;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--navy); color:#fff; border:none; padding:10px 16px; border-radius:8px;
    font-size:14px; font-weight:600; cursor:pointer; transition:background .15s ease;
  }
  .btn:hover{ background:var(--navy-deep); }
  .btn.secondary{ background:#fff; color:var(--navy); border:1px solid var(--border); }
  .btn.secondary:hover{ background:#f0f2f6; }
  .btn.teal{ background:var(--teal); }
  .btn.teal:hover{ background:#0a6357; }
  .btn.block{ width:100%; }
  .btn.small{ padding:6px 10px; font-size:12.5px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .login-note{
    margin-top:16px; font-size:11.5px; color:var(--muted); background:#f7f8fa; border:1px dashed var(--border);
    padding:8px 10px; border-radius:8px;
  }
  .login-error{ color:var(--danger); font-size:12.5px; margin-top:8px; }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:230px; background:var(--navy-deep); color:#fff; flex-shrink:0;
    display:flex; flex-direction:column; padding:20px 14px;
  }
  .brand{ display:flex; flex-direction:column; margin-bottom:22px; padding:0 6px;}
  .brand-name{ font-weight:800; font-size:15.5px; letter-spacing:.02em;}
  .brand-sub{ font-size:10.5px; color:#9db3d1; text-transform:uppercase; letter-spacing:.1em; margin-top:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px; margin-bottom:4px;
    color:#c9d6ea; cursor:pointer; font-size:13.5px; font-weight:500; position:relative;
  }
  .nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
  .nav-item.active{ background:#fff; color:var(--navy); font-weight:700; }
  .nav-icon{ width:18px; text-align:center; font-size:15px; }
  .nav-tag{
    margin-left:auto; font-size:9px; font-weight:800; letter-spacing:.05em; padding:2px 5px; border-radius:5px;
    background:rgba(255,255,255,0.14); color:#dbe6f5;
  }
  .nav-item.active .nav-tag{ background:#eef2f8; color:var(--muted); }
  .sidebar-footer{ margin-top:auto; padding:10px 6px; }
  .expert-chip{
    display:flex; align-items:center; gap:8px; padding:9px 10px; background:rgba(255,255,255,0.06);
    border-radius:8px; margin-bottom:8px;
  }
  .expert-avatar{
    width:28px; height:28px; border-radius:50%; background:var(--teal); color:#fff; display:flex;
    align-items:center; justify-content:center; font-weight:700; font-size:12px; flex-shrink:0;
  }
  .expert-name{ font-size:12.5px; font-weight:600; color:#fff; line-height:1.2;}
  .expert-role{ font-size:10.5px; color:#9db3d1; }

  /* ---------- MAIN ---------- */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    background:#fff; border-bottom:1px solid var(--border); padding:12px 26px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .topbar-title{ font-size:17px; font-weight:700; color:var(--navy); }
  .topbar-sub{ font-size:12px; color:var(--muted); margin-top:1px;}
  .demo-badge{
    font-size:11px; font-weight:700; color:var(--warning); background:var(--warning-bg);
    padding:5px 10px; border-radius:20px; border:1px solid #f0dca8;
  }
  .content{ padding:22px 26px 60px; overflow-y:auto; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px;}
  .card-title{ font-size:15px; font-weight:700; color:var(--navy); }
  .card-desc{ font-size:12.5px; color:var(--muted); margin-top:2px; }

  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); padding:8px 10px; border-bottom:2px solid var(--border);}
  td{ padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tr:last-child td{ border-bottom:none; }
  tr.clickable:hover{ background:#f7f9fc; cursor:pointer; }

  .badge{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px; font-size:11.5px; font-weight:700; }
  .badge.ok{ background:var(--success-bg); color:var(--success); }
  .badge.warn{ background:var(--warning-bg); color:var(--warning); }
  .badge.danger{ background:var(--danger-bg); color:var(--danger); }
  .badge.neutral{ background:#eef1f5; color:var(--muted); }
  .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

  .stepper{ display:flex; align-items:center; gap:0; position:relative; padding-top:22px; }
  .today-marker{ position:absolute; top:0; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; z-index:2; pointer-events:none; }
  .today-marker .tag{ font-size:9px; font-weight:800; color:#B33A3A; background:#FBEAEA; padding:1px 6px; border-radius:8px; white-space:nowrap; margin-bottom:1px; }
  .today-marker .arrow{ color:#B33A3A; font-size:12px; line-height:1; }
  .step{ display:flex; flex-direction:column; align-items:center; flex:1; position:relative; }
  .step .circle{
    width:20px; height:20px; border-radius:50%; background:#e4e8ee; color:#8894a3; font-size:10.5px;
    display:flex; align-items:center; justify-content:center; font-weight:800; border:2px solid #e4e8ee; z-index:1;
  }
  .step.done .circle{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .step.current .circle{ background:#fff; border-color:var(--teal); color:var(--teal); }
  .step .line{ position:absolute; top:9px; left:-50%; width:100%; height:2px; background:#e4e8ee; z-index:0; }
  .step.done .line{ background:var(--teal); }
  .step:first-child .line{ display:none; }
  .step .label{ font-size:9.5px; color:var(--muted); margin-top:5px; text-align:center; max-width:70px; }

  .pill-btn{
    border:1px solid var(--border); background:#fff; padding:6px 11px; border-radius:20px; font-size:12px;
    cursor:pointer; color:var(--text); font-weight:600;
  }
  .pill-btn.active{ background:var(--navy); border-color:var(--navy); color:#fff; }

  select.status-select{
    padding:5px 8px; border-radius:6px; font-size:12px; border:1px solid var(--border); font-weight:600;
  }
  .status-select.obligatoire{ background:var(--warning-bg); color:var(--warning); border-color:#f0dca8;}
  .status-select.realise{ background:var(--success-bg); color:var(--success); border-color:#bfe3d0;}
  .status-select.en_cours{ background:#FFF8D6; color:#8A6D00; border-color:#f0e3a0;}
  .status-select.non_retenue{ background:#eef1f5; color:var(--muted); border-color:var(--border);}

  .pilier-block{ border:1px solid var(--border); border-radius:8px; margin-bottom:12px; overflow:hidden; }
  .pilier-header{ background:#f7f9fc; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; }
  .pilier-header .name{ font-weight:700; font-size:13.5px; color:var(--navy); }
  .pilier-header .req{ font-size:11.5px; color:var(--muted); }
  .activite-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 14px; border-top:1px solid var(--border); gap:10px; }
  .activite-row .txt{ font-size:12.8px; }
  .activite-row .obl-tag{ font-size:10px; font-weight:800; color:var(--warning); margin-left:6px;}
  .activite-detail{ padding:10px 14px 14px; border-top:1px dashed var(--border); background:#fbfcfe; }
  .activite-detail textarea{ font-size:12.5px; }
  .simplify-preview{ font-size:12px; color:var(--teal); background:var(--teal-bg); border-radius:8px; padding:8px 10px; margin-top:8px; }

  .report-card{ background:#fff; border:1px solid var(--border); border-radius:10px; padding:26px 30px; margin-top:16px; }
  .report-header{ border-bottom:3px solid var(--navy); padding-bottom:14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:flex-end; }
  .report-eyebrow{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--teal); font-weight:800; }
  .report-title{ font-size:19px; font-weight:800; color:var(--navy); margin-top:2px; }
  .report-meta{ font-size:12px; color:var(--muted); margin-top:4px; }
  .report-section{ margin-top:18px; }
  .report-section h4{ font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--blue); margin:0 0 8px; border-bottom:1px solid var(--border); padding-bottom:5px; font-weight:800; }
  .report-prereq-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px 20px; }
  .report-prereq-item{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .report-pilier{ margin-bottom:12px; }
  .report-pilier .pnom{ font-weight:700; font-size:13.5px; color:var(--text); }
  .report-pilier ul{ margin:5px 0 0 20px; padding:0; font-size:12.8px; }
  .report-pilier ul li{ margin-bottom:3px; }
  .report-pilier .none{ font-size:12.5px; color:var(--muted); font-style:italic; }
  .conclusion-box{ background:var(--teal-bg); border-left:4px solid var(--teal); padding:12px 16px; border-radius:6px; margin-top:16px; font-size:13px; }
  @media print{
    body *{ visibility:hidden; }
    .printable-report, .printable-report *{ visibility:visible; }
    .printable-report{ position:absolute; left:0; top:0; width:100%; border:none; }
    .no-print, .no-print *{ display:none !important; }
  }

  textarea, input[type=text]{
    width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 10px; font-size:13px;
    font-family:inherit; resize:vertical;
  }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:920px){ .grid2{grid-template-columns:1fr;} }

  .kw-chip{
    display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:20px; font-size:11.5px;
    background:var(--teal-bg); color:var(--teal); border:1px solid #bfe3dd; margin:3px 4px 0 0; cursor:pointer; font-weight:600;
  }
  .kw-chip.off{ background:#f1f2f5; color:var(--muted); border-color:var(--border); border-style:dashed; }

  .section-label{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--blue); margin:14px 0 6px; }
  .placeholder-card{
    border:1.5px dashed #c7cedb; background:#fbfcfe; border-radius:12px; padding:34px 26px; text-align:center; color:var(--muted);
  }
  .placeholder-card .icon{ font-size:26px; margin-bottom:8px; }
  .placeholder-card .ttl{ font-weight:700; color:var(--navy); font-size:15px; margin-bottom:4px;}
  .modal-bg{
    position:fixed; inset:0; background:rgba(15,20,30,0.45); display:flex; align-items:center; justify-content:center; z-index:50;
    padding:24px; box-sizing:border-box;
  }
  .modal{ background:#fff; border-radius:12px; padding:22px 24px; width:420px; max-width:92vw; box-shadow:0 20px 60px rgba(0,0,0,.3); max-height:calc(100vh - 48px); overflow-y:auto; }
  .modal h3{ margin:0 0 14px; color:var(--navy); font-size:16px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; position:sticky; bottom:-22px; background:#fff; padding:12px 0 2px; }
  .toast{
    position:fixed; bottom:20px; right:20px; background:var(--navy); color:#fff; padding:11px 18px; border-radius:8px;
    font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,.25); z-index:60;
  }
  .muted-small{ font-size:11.5px; color:var(--muted); }
  a.linklike{ color:var(--blue); text-decoration:none; font-weight:600; cursor:pointer;}
  a.linklike:hover{ text-decoration:underline; }
  .flex-between{ display:flex; align-items:center; justify-content:space-between; }
  .spin{ display:inline-block; width:13px; height:13px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{ to{ transform:rotate(360deg);} }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>

// Le "bilan d'inscription" est en réalité le premier bilan d'accréditation ("1") : il ne
// nécessite pas 3 bilans annuels préalables, et ne réapparaît jamais dans les cycles suivants
// (après ce bilan d'accréditation "1", le cycle repart directement sur les bilans annuels,
// jusqu'au bilan d'accréditation "2").
function stagesFor(e){
  if (!e.accreditationCount) e.accreditationCount = 0;
  if (e.accreditationCount === 0){
    return ["Bilan d'accréditation 1 (inscription)","Bilan Annuel 1","Bilan Annuel 2","Bilan Annuel 3","Bilan d'accréditation 2"];
  }
  return ["Bilan Annuel 1","Bilan Annuel 2","Bilan Annuel 3","Bilan d'accréditation "+(e.accreditationCount+1)];
}
// Position (en %) du repère "Aujourd'hui" le long de la frise, interpolée entre les dates
// des étapes (pas seulement leur index), pour rester cohérente même avec des échéances
// corrigées manuellement et donc inégalement espacées.
function computeTodayMarkerPercent(dates){
  const n = dates.length;
  if (!n) return null;
  const t = TODAY.getTime();
  if (t <= dates[0].getTime()) return (0.5/n)*100;
  if (t >= dates[n-1].getTime()) return ((n-0.5)/n)*100;
  for (let i=0;i<n-1;i++){
    const a = dates[i].getTime(), b = dates[i+1].getTime();
    if (t >= a && t <= b){
      const frac = b>a ? (t-a)/(b-a) : 0;
      return ((i+0.5+frac)/n)*100;
    }
  }
  return 50;
}

function addYears(date, n){
  const d = new Date(date);
  d.setFullYear(d.getFullYear() + n);
  return d;
}
// La frise (et les retards) se calent sur la date d'entrée dans le dispositif pour le tout
// premier cycle, puis sur la date de validation du dernier bilan d'accréditation ensuite.
// Une échéance peut être surchargée manuellement par engagé/étape (e.echeanceOverrides),
// car la date limite réelle évolue chaque année et ne suit pas toujours +1 an pile.
function stageDates(e){
  const anchor = e.accreditationCount === 0 ? new Date(e.dateEntree) : new Date(e.dateDerniereAccreditation);
  const offset = e.accreditationCount === 0 ? 0 : 1;
  const computed = stagesFor(e).map((s,i)=> addYears(anchor, i + offset));
  if (e.echeanceOverrides){
    // Une échéance corrigée par l'expert vaut correction de la vraie date de référence à partir
    // de cette étape : on décale donc aussi toutes les étapes suivantes du même delta (en jours),
    // plutôt que de ne changer que l'affichage de la seule étape corrigée.
    const overrideIndices = Object.keys(e.echeanceOverrides).map(Number).sort((a,b)=>a-b);
    if (overrideIndices.length){
      const i0 = overrideIndices[0];
      const overrideDate = new Date(e.echeanceOverrides[i0]);
      const deltaMs = overrideDate.getTime() - computed[i0].getTime();
      const shifted = computed.map((d,i)=> i >= i0 ? new Date(d.getTime() + deltaMs) : d);
      // Un override explicite sur un autre indice reste prioritaire sur le décalage propagé.
      overrideIndices.forEach(idx=>{ if (idx !== i0) shifted[idx] = new Date(e.echeanceOverrides[idx]); });
      return shifted;
    }
  }
  return computed;
}
function advanceCycle(e){
  const stages = stagesFor(e);
  if (e.cycleIndex < stages.length - 1){
    e.cycleIndex += 1;
    return false;
  } else {
    e.accreditationCount += 1;
    e.cycleIndex = 0;
    e.dateDerniereAccreditation = TODAY.toISOString().slice(0,10);
    e.echeanceOverrides = {};
    return true;
  }
}
// Retour en arrière (mode test uniquement) : au mieux, ne rejoue pas l'historique exact
// d'une éventuelle date d'accréditation antérieure, mais permet de se débloquer.
function retreatCycle(e){
  if (e.cycleIndex > 0){
    e.cycleIndex -= 1;
    return;
  }
  if (e.accreditationCount > 0){
    e.accreditationCount -= 1;
    e.echeanceOverrides = {};
    const stages = stagesFor(e);
    e.cycleIndex = stages.length - 1;
    if (e.accreditationCount === 0) e.dateDerniereAccreditation = null;
  }
}

ns professionnelles sur la thématique équipe ou facteurs humains et organisationnels","obligatoire":false,"attendus":"Participation d’un membre de l’équipe à un groupe de travail pour élaborer des recommandations professionnelles sur la thématique équipe ou facteurs humains et organisationnels?","motscles":[],"exemple":""},{"nom":"Participation à un programme labellisé de simulation, serious game, réalité virtuelle sur la thématique équipe ou facteurs humains et organisationnels","obligatoire":false,"attendus":"Avez-vous participé à ce genre d’activité sur la thématique équipe ou facteurs humains et organisationnels?\nRq: voir les autres onglets pour de telles activités sur d’autres thématiques","motscles":["simulation en santé"],"exemple":""},{"nom":"CRM santé","obligatoire":false,"attendus":"Avez-vous participé à un atelier CRM?","motscles":["Crew Resource Management en Santé (CRM Santé)"],"exemple":""},{"nom":"Activité de recherche clinique, publication d’articles, communications scientifiques sur la thématique équipe ou facteurs humains et organisationnels","obligatoire":false,"attendus":"Avez-vous des activités de recherche, publications ou communication sur la thématique équipe ou facteurs humains et organisationnels?","motscles":[],"exemple":""},{"nom":"Prévention et gestion des conflits autour de la campagne « 1 patient, 1 équipe »","obligatoire":false,"attendus":"Dans l’environnement à forte pression des plateaux techniques, les situations conflictuelles sont une réalité vécue par la majorité des soignants et impactent la qualité du travail. Quel est votre expérience? Connaissez vous la campagne « 1 patient, 1 équipe »","motscles":["Conflit dans l’équipe"],"exemple":""},{"nom":"Protocolisation des prises en charge interdisciplinaires ou pluriprofessionnelles pour mettre en œuvre les recommandations de bonne pratique","obligatoire":false,"attendus":"Certaines recommandations sont, par essence, interdisciplinaires (Gestion des anticoagulants, antibioprophylaxie,.)… Comment les appropriez-vous, en équipe, au sein de votre établissement?","motscles":["Antibioprophylaxie","Anticoagulants (défaillance de gestion)","Ciment en orthopédie","Pneumopéritoine"],"exemple":""},{"nom":"Mise en œuvre de la SSP « Coopération anesthésistes-réanimateurs et chirurgiens »","obligatoire":false,"attendus":"Une charte de coopération entre anesthésistes et chirurgiens a-t-elle été rédigée dans votre établissement?","motscles":["Coopération anesthésistes - chirurgiens"],"exemple":""},{"nom":"Mise en œuvre concertée et évaluée de la RAAC","obligatoire":false,"attendus":"Avez-vous mis en place, en équipe pluri-disciplinaire des programmes de Récupération Améliorée Après Chirurgie","motscles":["RAAC"],"exemple":""},{"nom":"Analyse et décisions cliniques concertées en RCP (Heart Team, périnéatologie, infectiologie orthopédique, etc.)","obligatoire":false,"attendus":"Des Réunions de Concertation Pluridisciplinaires sont-elles en place dans votre établissement?","motscles":["RCP"],"exemple":""},{"nom":"Actions d’évaluation des pratiques professionnelles du travail en équipe réalisées en établissement (audit, suivi d’indicateurs, patient traceurs…)","obligatoire":false,"attendus":"Listez l’ensemble des Evaluations des Pratiques Professionnelles, portant sur le travail en équipe, réalisées ou en cours dans votre établissement (EPP, audit, patient traceur, suivi d’indicateurs.)","motscles":["Patient traceur","Indicateurs en santé","Certification d'établissement","AlgoSfar","EPP: Evaluation des Pratiques Professionnelles","Réseau Recherche"],"exemple":""},{"nom":"Identification de situations à risques en équipe propres à l’établissement et protocolisation concertée en interdisciplinaire de barrières de prévention, récupération ou atténuation","obligatoire":false,"attendus":"Avez-vous repéré des Situations à Risque (SAR) au sein de votre établissement et proposé collectivement des axes d’amélioration?","motscles":["SAR"],"exemple":""},{"nom":"Enquête cul onnel de santé et actions à mener urgemment","obligatoire":false,"attendus":"Repérez les situations à risques urgentes: burn-out, dépression, addiction, suicide, cyber-dépendance, sommeil, stress post-traumatique…\nConnaissez-vous les outils mis à disposition?","motscles":["Tests SMART en individuel","Tests SMART en équipe","Fiches pratiques SFAR","Burn-out (Vidal Actu)","Santé du MAR"],"exemple":""},{"nom":"Programme de prévention des risques spécifiques selon les disciplines","obligatoire":false,"attendus":"Risque musculo-squelettique, Bruits et nuisances sonores au bloc, Accident d’Exposition au Sang, radioprotection, gaz d’anesthésie ( fumées du bistouri électrique, réduction de l’impact environnemental (proto? Desflurane?…). Vous en êtes où?","motscles":["Gaz d’anesthésie","Nuisances sonores","Fumées chirurgicales","Radioprotection","Impact environnemental","Santé du MAR"],"exemple":""},{"nom":"Questionnaire Santé globale (année 1)","obligatoire":false,"attendus":"Vous pouvez remplir le questionnaire qui sera anonymisé dès validation, tant pour l’HAS que pour votre référent d’équipe","motscles":[],"exemple":""},{"nom":"Questionnaire Vie professionnelle (année 2)","obligatoire":false,"attendus":"Vous pouvez remplir le questionnaire qui sera anonymisé dès validation, tant pour l’HAS que pour votre référent d’équipe","motscles":[],"exemple":""},{"nom":"Questionnaire Vie extra professionnelle (année 3)","obligatoire":false,"attendus":"Vous pouvez remplir le questionnaire qui sera anonymisé dès validation, tant pour l’HAS que pour votre référent d’équipe","motscles":[],"exemple":""},{"nom":"Questionnaire « Tenir compte de son état de santé dans son exercice »","obligatoire":false,"attendus":"Vous pouvez remplir le questionnaire qui sera anonymisé dès validation, tant pour l’HAS que pour votre référent d’équipe","motscles":[],"exemple":""},{"nom":"Réalisation en individuel ou en équipe des autotests CFAR, identification des points de difficulté, mise en œuvre d’actions d’amélioration","obligatoire":false,"attendus":"Connaissez-vous ces auto-tests?\nEtes-vous Workaholiste? Cyber-dépendant? Le burn-out vous guette?","motscles":["Auto-tests CFAR (individuel ou équipe)"],"exemple":""},{"nom":"Ecoconception des soins","obligatoire":false,"attendus":"Questionnaire éco-responsabilité à remplir.\nSensibilisation ou formation des professionnels?\nParticipation à un comité développement durable?\nEvaluation de son impact environnemental (bilan carbone du service, pesée des déchets, bilan médico-économique…)?\nDescription des réflexions ou des actions réalisées par l’équipe.","motscles":["Cadre juridique","Décarboner la santé","Impact environnemental et anesthésie (SFAR)","Eco-conception des soins","Développement durable"],"exemple":""},{"nom":"Autres activités d’amélioration de la santé du professionnel","obligatoire":false,"attendus":"D’autres idées? Soyez inventifs!","motscles":[],"exemple":""}]},{"id":"p5","nom":"Relation Patient","req":"1 activité au choix","activites":[{"nom":"Actions de formation sur le thème de la relation avec le patient","obligatoire":false,"attendus":"Formations sur le thème de la relation avec le patient: outil HAS « Faire dire - communiquer avec son patient », hypnose conversationnelle, hypnose au bloc opératoire","motscles":["Information patient","Annonce cancer","Annonce dommage associé aux soins","Annonce mauvaise nouvelle","Annonce maladie chronique","Outil « Faire dire »","Relations Patients"],"exemple":"Exemple concret : vous avez suivi une formation d'une journée sur l'annonce d'un dommage associé aux soins, et l'avez mise en pratique lors d'un entretien avec un patient suite à une complication per-opératoire."},{"nom":"Participation à un programme labellisé de simulation, serious game, réalité virtuelle sur la relation avec le patient","obligatoire":false,"attendus":"Avez-vous participé à ce genre d’activité sur la thématique Relation patients?\nRq: voir les autres onglets pour de telles activités sur d’autres thématiques","motscles":["Simulation en santé"],"exemple":""},{"nom":"Activités de recherche clinique, publication d’articles sur la thématique « Relations avec les patients »","obligatoire":false,"attendus":"Avez-vous des activités de recherche, publications ou communication sur la thématique Relation Patient?","motscles":[],"exemple":""},{"nom":"Programmes visant à améliorer l’accueil, l’accompagnement et l’organisation des soins en établissement de santé pour les personnes en situation de handicap","obligatoire":false,"attendus":"Où en êtes-vous concernant l’accueil des patients en situation de hadicap: en consultation, dans les services et au bloc opératoire?\nComment abordez vous le patient non communiquant (échelle douleur doloplus…)","motscles":["Handicap et établissements de soins","Accessibilité du cabinet médical","Relations Patients"],"exemple":""},{"nom":"Implication dans la gestion et la formation d’associations de patients","obligatoire":false,"attendus":"Gestion des conflits\nCommission des relations avec les usagers et de la qualité de prise en charge (CRUQ)\nDroit des patients\nAssociations de patients","motscles":[],"exemple":""},{"nom":"Fiches d’information et de recueil du consentement du patient, programmes de décision médicale partagée","obligatoire":false,"attendus":"Comment informer le patient de manière éclairée?\nQuid de la décision médicale partagée?\nRq: l’analyse de vos documents d’information se fait dans un item un peu plus bas","motscles":["Décider ensemble","Décision médicale partagée"],"exemple":""},{"nom":"Conception et participation à la mise en place de programmes de soins associant des patients / éducation thérapeutique","obligatoire":false,"attendus":"Avez-vous mis en place des programmes d’éducation thérapeutique dans votre établissement?","motscles":["Education thérapeutique","Relations Patients"],"exemple":""},{"nom":"Participation à un dispositif d’annonce","obligatoire":false,"attendus":"Participez-vous à un disp let MAIL_TEMPLATES = {"valide":{"label":"Bilan validé","subject":"Validation de votre bilan — Accréditation des Médecins","body":"Bonjour,\n\nJe vous confirme la validation de votre bilan qui permet la poursuite de votre parcours dans l'Accréditation des Médecins. Je vous félicite et vous remercie de votre confiance. Je reste à votre disposition pour toute question durant l'année à venir.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"},"complement_demande":{"label":"Complément demandé","subject":"Votre bilan nécessite un complément — Accréditation des Médecins","body":"Bonjour,\n\nJ'ai bien pris connaissance de votre bilan dans le cadre de votre parcours dans l'Accréditation des Médecins. Il apparaît que certains pré-requis indispensables ne sont pas remplis, il ne m'est donc pas possible de valider votre bilan en l'état. Votre bilan est de nouveau disponible sur le SIAM pour que vous puissiez le compléter et le renvoyer à l'OA-CFAR. Je reste à votre disposition pour toute question.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"},"information_contradictoire":{"label":"Information contradictoire","subject":"Information contradictoire — Accréditation des Médecins","body":"Bonjour,\n\nVotre bilan dans le cadre de votre parcours dans l'Accréditation des Médecins présente un retard important (> 90 jours) et/ou ne répond pas aux pré-requis du programme de notre spécialité malgré les compléments qui vous ont été demandés. Je suis contraint par la HAS d'avancer dans la procédure en déclenchant une information contradictoire. Vous devez adresser à l'OA-CFAR votre bilan dans un délai de 3 semaines, avant qu'un avis défavorable ne soit émis.\n\nVous pouvez également, si vous souhaitez faire une pause dans votre Accréditation, mettre en place une procédure de renoncement. Cette procédure amiable vous permettra un ré-engagement facilité quand vous le jugerez possible (sans publication sur le site de la HAS).\n\nJe reste à votre disposition pour toute question.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"},"avis_defavorable":{"label":"Avis défavorable (mise en demeure)","subject":"Avis défavorable — Accréditation des Médecins","body":"Bonjour,\n\nVotre bilan, dans le cadre de votre parcours dans l'Accréditation des Médecins, ne progresse pas favorablement malgré nos relances et en particulier l'information contradictoire qui vous a été adressée il y a 3 semaines. Nous sommes contraints par la HAS de prononcer un avis défavorable qui donnera lieu à une mise en demeure. Il vous reste désormais 3 mois pour mettre votre dossier en conformité, faute de quoi un avis défavorable définitif prononcera votre sortie de l'Accréditation des Médecins.\n\nVous pouvez également, si vous souhaitez faire une pause dans votre Accréditation, mettre en place une procédure de renoncement. Cette procédure amiable vous permettra un ré-engagement facilité quand vous le jugerez possible (sans publication sur le site de la HAS).\n\nJe reste à votre disposition pour toute question.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"},"avis_defavorable_definitif":{"label":"Avis défavorable définitif (retrait)","subject":"Avis défavorable définitif — Accréditation des Médecins","body":"Bonjour,\n\nLa HAS nous impose, malheureusement, de prononcer un avis défavorable définitif sur votre bilan dans le cadre de votre parcours dans l'Accréditation des Médecins. Malgré un long processus et la possibilité d'un renoncement amiable, vous n'avez pas donné suite à nos propositions d'aide ; dès lors cet avis définitif vaut pour retrait de l'Accréditation des Médecins.\n\nJe reste à votre disposition pour toute question.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"},"sortie_non_demande":{"label":"Sortie pour non-demande (>18 mois)","subject":"Sortie du dispositif — Accréditation des Médecins","body":"Bonjour,\n\nVous n'avez pas donné suite à votre démarche d'Accréditation des Médecins depuis plus de 18 mois. De fait, la HAS va prononcer une mesure de retrait pour non-demande d'Accréditation. Vous gardez la possibilité de vous ré-engager si vous le souhaitez.\n\nJe reste à votre disposition pour toute question.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"},"bilan_vide":{"label":"Bilan vide (grossesse / longue maladie)","subject":"Bilan vide justifié — Accréditation des Médecins","body":"Bonjour,\n\nCompte tenu de votre situation et de votre volonté de reprendre dès que possible votre parcours dans l'Accréditation des Médecins, je demande un délai de tolérance à la HAS. Dans ce sens, un bilan vide a été déclenché. Je reste à votre disposition pour toute question et vous remercie de me tenir informé de l'évolution de votre situation.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"},"renoncement":{"label":"Renoncement de l'engagé","subject":"Renoncement à l'Accréditation des Médecins","body":"Bonjour,\n\nJ'ai bien pris connaissance de votre volonté de renoncer à votre parcours dans l'Accréditation des Médecins. Cette procédure amiable vous permettra de vous ré-engager si vous le souhaitez et ne donnera pas lieu à publication sur le site de la HAS. Je vous souhaite le meilleur pour la suite et vous remercie de votre confiance durant ces années d'accompagnement, de collaboration et d'échanges.\n\nJe reste à votre disposition pour toute question.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"},"retraite":{"label":"Retraite de l'engagé","subject":"Sortie du dispositif pour départ à la retraite","body":"Bonjour,\n\nJ'ai bien pris connaissance de votre sortie du parcours de l'Accréditation des Médecins au motif de votre départ à la retraite. Je me charge d'informer la HAS de votre situation ; dans ce cadre, ne vous étonnez pas qu'un bilan défavorable soit émis pour clôturer votre dossier.\n\nJe vous souhaite une retraite épanouie et vous remercie de votre confiance durant ces années de collaboration.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"},"eias_retour":{"label":"Retour didactique sur un EIAS (à l'engagé)","subject":"Retour sur votre analyse d'EIAS — {{titre}}","body":"Bonjour,\n\nSuite à votre déclaration d'EIAS, voici mon retour à visée didactique, dans l'esprit de l'analyse contradictoire prévue par le référentiel HAS :\n\n{{critique}}\n\nVous trouverez ci-dessous la synthèse telle que versée au SIAM :\n\n{{synthese}}\n\nJe reste à votre disposition pour en échanger de vive voix si vous le souhaitez.\n\nCordialement.\nVotre Expert au CFAR : {{expert}}"}};

// Règles de gestion — éditables par l'administrateur (cf. Didacticiel §Règles de gestion),
// car elles évoluent avec les décisions HAS/CFAR (ex. tolérances, seuils, tarifs).
/*__REGLES_START__*/
let REGLES_GESTION = {"delaiTraitementJours":30,"toleranceRetardJours":90,"eiasRatioSeuil":6,"eiasExceptions":{"7":6,"8":7,"9":8,"10":9},"eiasPlafondAuDela":10,"tarifEias":220,"tarifBilan":50,"effectifBilanPlafond":10,"responsableAccreditationEmail":"mnodanche@cfar.org","aideProcedures":""};
/*__REGLES_END__*/

// Construit une URL mailto: avec le destinataire, l'objet, le corps, et une copie systématique
// à la Responsable Accréditation du CFAR (adresse configurable par l'administrateur).
// La Responsable Accréditation n'est mise en copie QUE sur les mails de décision concernant le
// bilan en cours et les situations particulières (validé, complément demandé, avis défavorable,
// renoncement...) — jamais sur les mails de synthèse EIAS ou de synthèse de bilan adressés à
// l'engagé, ni sur les mails de simple point d'étape (frise), qui ne relèvent pas d'une décision.
function buildMailUrl(to, subject, body, includeCc){
  let url = "mailto:" + encodeURIComponent(to||"") + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
  if (includeCc && REGLES_GESTION.responsableAccreditationEmail) url += "&cc=" + encodeURIComponent(REGLES_GESTION.responsableAccreditationEmail);
  return url;
}

function eiasAttendus(effectif){
  const r = REGLES_GESTION;
  if (effectif <= r.eiasRatioSeuil) return Math.max(1, effectif);
  const key = String(effectif);
  if (r.eiasExceptions[key] !== undefined) return r.eiasExceptions[key];
  return r.eiasPlafondAuDela;
}

function daysBetween(d1, d2){ return Math.floor((d2 - new Date(d1)) / 86400000); }

// Rappel trimestriel : pas de vrai déclenchement automatique possible sans serveur (l'appli ne
// tourne que lorsque l'expert l'ouvre), donc on matérialise plutôt un signal — "c'est le moment
// d'en envoyer un" — dès que 90 jours se sont écoulés depuis le dernier rappel (ou l'entrée dans
// le dispositif si aucun rappel n'a encore été envoyé).
function isRappelDue(e){
  if (e.type === "membre_equipe") return false;
  const base = e.lastRappelDate || e.dateEntree;
  if (!base) return false;
  return daysBetween(base, TODAY) >= 90;
}
// Jusqu'à 3 activités à suggérer : en priorité celles obligatoires non encore traitées, puis
// d'autres en attente, dans l'ordre des piliers — pour rester un rappel court et actionnable.
function missingActivitiesForRappel(e, limit){
  limit = limit || 3;
  const year = e.cycleIndex || 0;
  const statuts = getBilanStatuts(e, year);
  const pending = [];
  const pendingObligatoire = [];
  PILIERS.forEach(p=> p.activites.forEach((a,ai)=>{
    const key = p.id+"_"+ai;
    const val = statuts[key];
    if (val === "realise" || val === "en_cours" || val === "non_retenue") return;
    (a.obligatoire ? pendingObligatoire : pending).push(a);
  }));
  return pendingObligatoire.concat(pending).slice(0, limit);
}

function delayStatus(echeance, statutBilan){
  const meta = STATUT_BILAN_META[statutBilan];
  if (statutBilan === "transmis") return { level:"ok", label:"Transmis", jours:0 }; // compatibilité descendante
  if (meta && (meta.terminal || meta.tolere || statutBilan === "valide")){
    return { level:"neutral", label: meta.label, jours:0 };
  }
  const j = daysBetween(echeance, TODAY);
  const delai = REGLES_GESTION.delaiTraitementJours, tolerance = REGLES_GESTION.toleranceRetardJours;
  if (j < 0) return { level:"ok", label:"Échéance dans " + (-j) + " j", jours:j };
  if (j < delai) return { level:"ok", label: j + " j après l'échéance (dans le délai HAS de " + delai + " j)", jours:j };
  if (j <= tolerance) return { level:"warn", label: j + " j de retard — au-delà du délai HAS de " + delai + " j", jours:j };
  return { level:"danger", label: j + " j de retard — retard critique (> tolérance " + tolerance + " j)", jours:j };
}

// Les dates de démonstration sont calculées par rapport au jour d'ouverture (TODAY), et non
// figées en dur : sans ça, chaque cas se rapprocherait ou s'éloignerait insensiblement de son
// échéance au fil des mois, jusqu'à ce que "l'exemple à jour" devienne lui-même en retard —
// exactement le problème qu'on vient de corriger. `echeanceOverrides` force la date de l'étape
// EN COURS de chaque cas, quel que soit le jour où le fichier est ouvert ; les autres dates
// (entrée, dernière accréditation) ne servent qu'à la cohérence visuelle du reste de la frise.
function demoDate(offsetDays){
  return new Date(TODAY.getTime() + offsetDays*86400000).toISOString().slice(0,10);
}

function attachAppEvents(){
  attachModeEmploiEvents();
  document.getElementById("logoutBtn").onclick = ()=> {
    persistEiasWork();
    if (STATE.currentExpert){
      ENGAGES_STORE[STATE.currentExpert.id] = ENGAGES;
      FACTURATION_STORE[STATE.currentExpert.id] = FACTURATION;
      FACTURATION_INFO_STORE[STATE.currentExpert.id] = FACTURATION_INFO;
    }
    // Réinitialiser la navigation : un autre profil peut se connecter ensuite, avec des
    // engagés différents — une sélection ou un onglet laissés en l'état ferait planter le rendu.
    setState({ screen:"login", currentExpert:null, activeTab:"engages", selectedEngageId:null, bilanYear:0, bilanSynthese:null, bilanSyntheseEngage:null, eiasDraft:null, eiasInputs: defaultEiasInputs(), eiasTestMode:false, anonymisationAccepted:false });
  };
  document.querySelectorAll(".nav-item").forEach(el=>{
    el.onclick = ()=> { persistEiasWork(); setState({ activeTab: el.getAttribute("data-tab"), selectedEngageId:null, eiasDraft:null, eiasInputs: defaultEiasInputs(), eiasValidated:false, eiasTestMode:false }); };
  });

  const exportBackupBtn = document.getElementById("exportBackupBtn");
  if (exportBackupBtn) exportBackupBtn.onclick = ()=>{
    // Cette sauvegarde restaure vos engagés et votre facturation — pas le référentiel partagé
    // (piliers, règles, modèles de mail, répertoire...), qui évolue indépendamment et se diffuse
    // via « Exporter l'application mise à jour » ou « Exporter le référentiel » (Didacticiel).
    const data = {
      version: 2,
      exportedAt: TODAY.toISOString(),
      exportedBy: STATE.currentExpert.name,
      engages: ENGAGES,
      facturation: FACTURATION,
      facturationInfo: FACTURATION_INFO,
    };
    const json = JSON.stringify(data, null, 2);
    const a = document.createElement("a");
    a.href = "data:application/json;charset=utf-8," + encodeURIComponent(json);
    a.download = "KitCFAR_sauvegarde_" + TODAY.toISOString().slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    toast("Sauvegarde téléchargée (" + ENGAGES.length + " engagé(s)).");
  };

  const importBackupInput = document.getElementById("importBackupInput");
  if (importBackupInput) importBackupInput.onchange = (ev)=>{
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = ""; // permet de recharger le même fichier une seconde fois si besoin
    if (!file) return;
    if (STATE.currentExpert && STATE.currentExpert.id === "exp2"){
      // Le compte de démonstration reconstruit ses cas d'exemple à jour à chaque ouverture du
      // fichier ; importer une sauvegarde ici — la sienne ou une autre — les remplace jusqu'au
      // prochain rechargement de la page, avec des dates qui ne se réactualiseront plus.
      const ok = window.confirm("Vous êtes connecté avec le compte de démonstration (Dr. Jean Test).\n\nImporter une sauvegarde ici remplacera les cas d'exemple (Camille Faure, etc.) jusqu'au prochain rechargement complet de la page — et si c'est une ancienne sauvegarde de ce même compte, ses dates ne se réactualiseront pas automatiquement.\n\nContinuer ?");
      if (!ok) return;
    }
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if (!data.engages || !Array.isArray(data.engages)) throw new Error('format non reconnu (clé "engages" manquante)');
        ENGAGES = migrateLegacyTeamMembres(data.engages.map(normalizeImportedEngage));
        if (STATE.currentExpert) ENGAGES_STORE[STATE.currentExpert.id] = ENGAGES;
        // Le référentiel (piliers, règles, modèles de mail, statuts, répertoire...) n'est
        // volontairement PAS restauré depuis une sauvegarde personnelle : celle-ci fige une
        // photo du référentiel au moment de l'export, qui peut être plus ancienne que le
        // référentiel déjà chargé (et donc l'écraser en arrière, effaçant des mises à jour
        // faites depuis — mots-clés, exemples concrets, onglets d'action…). Pour diffuser une
        // mise à jour du référentiel, utilisez « Exporter l'application mise à jour » ou
        // « Exporter le référentiel » (Didacticiel), pas cette sauvegarde-ci.
        if (data.facturation && Array.isArray(data.facturation)){
          FACTURATION = data.facturation;
          if (STATE.currentExpert) FACTURATION_STORE[STATE.currentExpert.id] = FACTURATION;
        }
        if (data.facturationInfo && typeof data.facturationInfo === "object"){
          FACTURATION_INFO = data.facturationInfo;
          if (STATE.currentExpert) FACTURATION_INFO_STORE[STATE.currentExpert.id] = FACTURATION_INFO;
        }
        setState({ selectedEngageId:null, bilanSynthese:null, bilanSyntheseEngage:null, eiasDraft:null, eiasInputs: defaultEiasInputs(), eiasValidated:false });
        toast("Sauvegarde chargée (" + ENGAGES.length + " engagé(s)) — le référentiel actuel (piliers, exemples, mots-clés...) a été conservé tel quel.");
      }catch(err){
        toast("Import impossible : " + err.message);
      }
    };
    reader.onerror = ()=> toast("Impossible de lire ce fichier.");
    reader.readAsText(file);
  };

  attachTabEvents();
}

function normalizeImportedEngage(e){
  e.bilanStatuts = e.bilanStatuts || {};
  e.bilanContenus = e.bilanContenus || {};
  e.bilanValence = e.bilanValence || {};
  e.bilanAnnotations = e.bilanAnnotations || {};
  e.bilanAppreciations = e.bilanAppreciations || {};
  e.dossiersEias = e.dossiersEias || [];
  e.dossiersBilan = e.dossiersBilan || [];
  e.bilanDrafts = e.bilanDrafts || {};
  if (e.lastRappelDate === undefined) e.lastRappelDate = null;
  e.membres = e.membres || [];
  e.echeanceOverrides = e.echeanceOverrides || {};
  if (typeof e.telephone !== "string") e.telephone = "";
  if (typeof e.email !== "string") e.email = "";
  if (typeof e.note !== "string") e.note = "";
  if (typeof e.prenom !== "string") e.prenom = "";
  if (typeof e.nomFamille !== "string") e.nomFamille = "";
  if (typeof e.accreditationCount !== "number") e.accreditationCount = 0;
  if (typeof e.cycleIndex !== "number") e.cycleIndex = 0;
  if (typeof e.eiasRealises !== "number") e.eiasRealises = 0;
  if (!e.statutBilan) e.statutBilan = "a_faire";
  if (!e.type) e.type = "individuel";
  if (e.type === "membre_equipe"){
    if (!e.qualif) e.qualif = "Anesthésiste";
    if (!e.role) e.role = "membre";
  }
  return e;
}

// Migration d'un ancien format (membres = objets {nom,qualif} imbriqués) vers le nouveau modèle
// (membres = identifiants d'engagés à part entière, cherchables, sans doublon). Sans effet si
// le fichier importé est déjà au nouveau format.
function migrateLegacyTeamMembres(list){
  const extra = [];
  list.forEach(e=>{
    if (e.type === "equipe" && Array.isArray(e.membres) && e.membres.length && typeof e.membres[0] === "object"){
      const newIds = e.membres.map((m,i)=>{
        const id = e.id + "_m" + i + "_" + Date.now();
        extra.push({ id, type:"membre_equipe", nom:m.nom||"Membre", qualif:m.qualif||"Anesthésiste", equipeId:e.id, role: i===0?"referent":"membre", email:"", telephone:"" });
        return id;
      });
      e.membres = newIds;
    }
  });
  return list.concat(extra);
}

// ---- Aides pour le modèle « membres d'équipe = engagés à part entière » ----
function findEngage(id){ return ENGAGES.find(x=>x.id===id); }
function resolveTeamMembers(equipe){
  return (equipe.membres||[]).map(id=>findEngage(id)).filter(Boolean);
}
function newEngageId(prefix){ return (prefix||"e") + Date.now() + Math.floor(Math.random()*10000); }
// Repli pour les engagés créés avant la séparation nom/prénom, ou pour amorcer la correction
// d'une inversion : dernier mot = nom de famille, le reste = prénom (règle simple, à ajuster
// manuellement par l'expert au besoin — la corriger est justement le but de ce formulaire).
function guessNomPrenom(nom){
  const s = (nom||"").replace(/^(Dr|Pr)\.?\s+/i, "").trim();
  const parts = s.split(/\s+/).filter(Boolean);
  if (parts.length <= 1) return { prenom:"", nomFamille: s };
  return { prenom: parts.slice(0,-1).join(" "), nomFamille: parts[parts.length-1] };
}
function blankIndividuelFields(){
  return { accreditationCount:0, dateDerniereAccreditation:null, cycleIndex:0, statutBilan:"a_faire",
    echeanceOverrides:{}, eiasRealises:0, dossiersEias:[], dossiersBilan:[], lastRappelDate:null,
    bilanStatuts:{}, bilanContenus:{}, bilanValence:{}, bilanAnnotations:{}, bilanAppreciations:{} };
}

/* ============================ MODULE 0 — ENGAGES ============================ */
function renderEngages(){
  // Les membres d'équipe (type "membre_equipe") sont de vrais engagés cherchables, mais ne sont
  // pas suivis (bilan/EIAS) indépendamment de leur équipe : on les exclut de cette liste et du
  // tableau de bord, on les retrouve via la fiche de l'équipe ou le module de recherche.
  const sortBy = STATE.engagesSortBy || "echeance";
  const sortByEcheance = (a,b)=>{
    const da = delayStatus(stageDates(a)[a.cycleIndex], a.statutBilan);
    const db = delayStatus(stageDates(b)[b.cycleIndex], b.statutBilan);
    const na = da.level === "neutral" ? 1 : 0;
    const nb = db.level === "neutral" ? 1 : 0;
    // Statuts "neutres" (validé, terminal...) en fin de liste — rien à traiter dans l'immédiat.
    if (na !== nb) return na - nb;
    if (na === 1) return normalizeSearch(a.nomFamille||a.nom).localeCompare(normalizeSearch(b.nomFamille||b.nom));
    // Le plus de jours de retard (ou le plus proche de l'échéance) d'abord.
    return db.jours - da.jours;
  };
  const sortByNom = (a,b)=> normalizeSearch(a.nomFamille||a.nom).localeCompare(normalizeSearch(b.nomFamille||b.nom));
  const trackedEngages = ENGAGES.filter(e=>e.type!=="membre_equipe")
    .sort(sortBy==="nom" ? sortByNom : sortByEcheance);
  const nbEngages = trackedEngages.length;
  const nbRetard = trackedEngages.filter(e=>{
    const d = delayStatus(stageDates(e)[e.cycleIndex], e.statutBilan);
    return d.level === "warn" || d.level === "danger";
  }).length;
  const nbEiasManquants = trackedEngages.reduce((sum,e)=>{
    const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;
    return sum + Math.max(0, attendu - e.eiasRealises);
  }, 0);
  const prochaine = trackedEngages.map(e=>({ e, date: stageDates(e)[e.cycleIndex] }))
    .filter(x=> !(STATUT_BILAN_META[x.e.statutBilan] && (STATUT_BILAN_META[x.e.statutBilan].terminal || STATUT_BILAN_META[x.e.statutBilan].tolere)))
    .sort((a,b)=> a.date - b.date)[0];

  const dashboard = `
  <div class="card">
    <div class="card-title" style="margin-bottom:12px;">Vue d'ensemble</div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14px;">
      <div style="text-align:center;">
        <div style="font-size:26px; font-weight:800; color:var(--navy);">${nbEngages}</div>
        <div class="muted-small">Engagés suivis</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:26px; font-weight:800; color:${nbRetard? 'var(--warning)':'var(--success)'};">${nbRetard}</div>
        <div class="muted-small">Bilan(s) en retard</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:26px; font-weight:800; color:${nbEiasManquants? 'var(--warning)':'var(--success)'};">${nbEiasManquants}</div>
        <div class="muted-small">EIAS manquant(s) sur l'année</div>
      </div>
      <div style="text-align:center;">
        <div style="font-size:15px; font-weight:800; color:var(--navy);">${prochaine ? fmtDate(prochaine.date) : "—"}</div>
        <div class="muted-small">Prochaine échéance${prochaine? " ("+prochaine.e.nom.split(" ").slice(0,2).join(" ")+"…)" : ""}</div>
      </div>
    </div>
  </div>`;

  const rows = trackedEngages.map(e=>{
    const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;
    const eiasBadge = e.eiasRealises >= attendu
      ? `<span class="badge ok">${e.eiasRealises}/${attendu} EIAS</span>`
      : `<span class="badge warn">${e.eiasRealises}/${attendu} EIAS</span>`;
    const delay = delayStatus(stageDates(e)[e.cycleIndex], e.statutBilan);
    const delayBadge = delay.level === "neutral" ? statutBadge(e.statutBilan) : `<span class="badge ${delay.level}"><span class="dot"></span>${delay.label}</span>`;
    return `
      <tr class="clickable" data-id="${e.id}">
        <td><b>${e.nom}</b>${isRappelDue(e) ? ' <span title="Rappel trimestriel dû" style="cursor:default;">🔔</span>' : ''}<div class="muted-small">${e.modeExercice}</div></td>
        <td>${e.type==="equipe"? "Équipe ("+e.membres.length+")" : "Individuel"}</td>
        <td>${stagesFor(e)[e.cycleIndex]}</td>
        <td>${eiasBadge}</td>
        <td>${delayBadge}</td>
        <td><a class="linklike" data-open="${e.id}">Ouvrir →</a></td>
      </tr>`;
  }).join("");


  const allSearchable = ENGAGES; // recherche : y compris les membres d'équipe, pour éviter les doublons
  const searchQuery = normalizeSearch(STATE.engageSearchQuery||"");
  const searchResults = searchQuery ? allSearchable.filter(e=> normalizeSearch(e.nom).includes(searchQuery)) : [];
  const searchLabel = (e)=>{
    if (e.type==="equipe") return "Équipe";
    if (e.type==="membre_equipe"){
      const eq = findEngage(e.equipeId);
      return (e.role==="referent"?"Référent":"Membre") + " — " + (eq?eq.nom:"équipe introuvable");
    }
    return "Individuel";
  };
  const searchCard = `
  <div class="card">
    <div class="card-title" style="margin-bottom:8px;">🔍 Rechercher un engagé</div>
    <input type="text" id="engageSearchInput" placeholder="Nom (y compris les membres au sein d'une équipe)…" value="${escapeHtml(STATE.engageSearchQuery||"")}" />
    ${searchQuery ? `
      <div class="muted-small" style="margin:8px 0;">${searchResults.length} résultat(s)</div>
      ${searchResults.map(e=>`
        <div class="activite-row" data-search-result="${e.id}" style="cursor:pointer;">
          <div class="txt"><b>${escapeHtml(e.nom)}</b></div>
          <div class="muted-small">${searchLabel(e)}</div>
        </div>`).join("") || `<div class="muted-small">Aucun engagé ne correspond.</div>`}
    ` : ""}
  </div>`;

  const doublonsCard = `
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Doublons potentiels</div><div class="card-desc">Repère les noms identiques ou très proches, individuels comme membres d'équipe</div></div>
      <a class="linklike" id="toggleDoublonsBtn">${STATE.showDoublons?"Masquer":"🔎 Rechercher les doublons"}</a>
    </div>
    ${STATE.showDoublons ? (()=>{
      const groups = {};
      allSearchable.forEach(e=>{
        const key = normalizeSearch(e.nom).replace(/^(dr|pr|docteur|professeur)\.?\s+/,"").trim();
        if (!groups[key]) groups[key] = [];
        groups[key].push(e);
      });
      const dups = Object.values(groups).filter(g=>g.length>1);
      return dups.length ? dups.map(g=>`
        <div class="activite-row" style="flex-direction:column; align-items:stretch;">
          <div class="txt" style="color:var(--danger);">⚠️ ${dups.length>1?"":""}${g.length} entrées pour un nom proche :</div>
          ${g.map(e=>`<div class="muted-small">• ${escapeHtml(e.nom)} — ${searchLabel(e)}</div>`).join("")}
        </div>`).join("") : `<div class="muted-small">Aucun doublon détecté pour l'instant.</div>`;
    })() : ""}
  </div>`;

  return `
  ${dashboard}
  ${searchCard}
  ${doublonsCard}
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">Engagés suivis (${trackedEngages.length})</div><div class="card-desc">Individuels et équipes gérés par ${STATE.currentExpert.name}</div></div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn secondary small" id="downloadEngagesTemplateBtn">⬇️ Modèle Excel</button>
        <button class="btn secondary small" id="toggleImportEngagesBtn">${STATE.showImportEngages?"Masquer":"📥 Importer depuis Excel"}</button>
        <button class="btn small" id="addEngageBtn">+ Ajouter un engagé</button>
      </div>
    </div>
    ${STATE.showImportEngages ? `
    <div class="card" style="background:#F7F9FC; margin-bottom:14px;">
      <div class="muted-small" style="margin-bottom:8px;">1. Téléchargez le modèle ci-dessus si ce n'est pas déjà fait. 2. Remplissez un onglet "Individuels", un onglet "Équipes" et, pour chaque membre d'équipe, une ligne dans l'onglet "Membres d'équipe" (colonne "Équipe" = nom exact de l'équipe). 3. Déposez le fichier complété ici.</div>
      <input type="file" id="importEngagesFile" accept=".xlsx,.xls" />
      <button class="btn small" id="loadEngagesImportBtn" style="margin-top:8px;">Importer</button>
      <div id="importEngagesMsg" style="margin-top:10px; font-size:13px; white-space:pre-wrap;">${escapeHtml(STATE.importEngagesResultMsg||"")}</div>
    </div>` : ""}
    <div class="muted-small" style="margin-bottom:8px;">Trier par :
      <a class="linklike" data-sort-engages="echeance" style="font-weight:${sortBy==="echeance"?"800":"400"};">Échéance (le plus urgent d'abord)</a> ·
      <a class="linklike" data-sort-engages="nom" style="font-weight:${sortBy==="nom"?"800":"400"};">Nom</a>
    </div>
    <table>
      <thead><tr><th>Engagé</th><th>Type</th><th>Étape du cycle</th><th>EIAS de l'année</th><th>Délai bilan${sortBy==="echeance"?" ▾":""}</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
  ${renderEngageDetail()}
  ${STATE.showAddEngageModal ? renderAddEngageModal() : ""}
  `;
}

function renderEngageDetail(){
  if (!STATE.selectedEngageId) return "";
  const e = ENGAGES.find(x=>x.id===STATE.selectedEngageId);
  if (!e) return "";
  const isAdmin = STATE.currentExpert && STATE.currentExpert.isAdmin;
  const stages = stagesFor(e);
  const dates = stageDates(e);
  const currentMeta = STATUT_BILAN_META[e.statutBilan] || STATUT_BILAN_META.a_faire;
  const stepsHtml = stages.map((s,i)=>{
    const cls = i < e.cycleIndex ? "done" : (i===e.cycleIndex ? "current" : "");
    const circleStyle = i===e.cycleIndex ? `style="background:${currentMeta.color}; border-color:${currentMeta.color}; color:#fff;"` : "";
    return `<div class="step ${cls}"><div class="line"></div><div class="circle" ${circleStyle}>${i<e.cycleIndex?"✓":i+1}</div><div class="label">${s}<br/><span style="opacity:.75;">${fmtDate(dates[i])}</span></div></div>`;
  }).join("");
  const cycleNote = e.accreditationCount === 0
    ? "Premier cycle : le bilan d'inscription (bilan d'accréditation « 1 ») ne réapparaîtra plus une fois validé — le cycle suivant repart directement sur les bilans annuels, jusqu'au bilan d'accréditation « 2 ». Frise calée sur la date d'entrée dans le dispositif."
    : `${e.accreditationCount} accréditation(s) déjà validée(s) le ${fmtDate(e.dateDerniereAccreditation)} — cycle actuel sans bilan d'inscription, frise calée sur cette date.`;

  // Navigation manuelle du cycle : sert à explorer librement la frise (compte de démonstration)
  // mais aussi, pour tout compte, à corriger une avancée accidentelle en double — par exemple si
  // un bilan a été archivé à la fois depuis le module Bilan et depuis les actions rapides
  // ci-dessous (l'une de ces deux voies ne doit plus être utilisée pour la validation depuis
  // cette mise à jour, mais d'anciennes données peuvent encore en porter la trace).
  const cycleNav = `
    <div style="margin-top:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
      <button class="btn secondary small" data-retreat="${e.id}">🔧 Corriger : reculer d'une étape</button>
      <button class="btn secondary small" data-advance="${e.id}">🔧 Corriger : avancer d'une étape</button>
      <span class="muted-small">déplace directement l'étape en cours sur la frise ci-dessus (cercle foncé) et l'échéance qui en découle — sans effet sur les dossiers déjà archivés</span>
    </div>`;

  let membresHtml = "";
  if (e.type === "equipe"){
    const members = resolveTeamMembers(e);
    const individuelsDisponibles = ENGAGES.filter(x=>x.type==="individuel");
    const addMembreForm = STATE.addMembreOpen === e.id ? `
      <div style="margin-top:8px; padding:10px; background:#fbfcfe; border:1px dashed var(--border); border-radius:8px;">
        <div class="section-label">Comment ajouter ce membre ?</div>
        <select id="addMembreMode">
          <option value="direct" ${STATE.addMembreMode!=="import"?"selected":""}>Nouveau membre (renseignement direct)</option>
          <option value="import" ${STATE.addMembreMode==="import"?"selected":""}>Importer un engagé individuel existant (évite les doublons)</option>
        </select>
        ${STATE.addMembreMode==="import" ? `
          <div class="section-label" style="margin-top:8px;">Engagé individuel à intégrer</div>
          <select id="importMembreSelect">
            ${individuelsDisponibles.length ? individuelsDisponibles.map(x=>`<option value="${x.id}">${escapeHtml(x.nom)}</option>`).join("") : `<option value="">Aucun engagé individuel disponible</option>`}
          </select>
        ` : `
          <div class="section-label" style="margin-top:8px;">Nom</div>
          <input type="text" id="newMembreNom" placeholder="Dr. Prénom Nom" />
          <div class="section-label" style="margin-top:8px;">Qualification</div>
          <input type="text" id="newMembreQualif" placeholder="Anesthésiste, Réanimateur…" value="Anesthésiste" />
          <div class="section-label" style="margin-top:8px;">Téléphone</div>
          <input type="text" id="newMembreTel" placeholder="06 xx xx xx xx" />
          <div class="section-label" style="margin-top:8px;">Adresse mail</div>
          <input type="text" id="newMembreEmail" placeholder="nom@exemple.fr" />
        `}
        <div style="margin-top:8px; display:flex; gap:8px;">
          <button class="btn small" data-confirm-add-membre="${e.id}">Ajouter</button>
          <button class="btn secondary small" data-cancel-add-membre>Annuler</button>
        </div>
      </div>` : "";
    membresHtml = `
      <div class="section-label">Composition de l'équipe</div>
      <table>
        <thead><tr><th>Médecin</th><th>Qualification</th><th>Rôle</th><th></th></tr></thead>
        <tbody>${members.map(m=>`<tr>
          <td>${escapeHtml(m.nom)}</td><td>${escapeHtml(m.qualif||"")}</td>
          <td>${m.role==="referent" ? `<span class="badge ok">⭐ Référent</span>` : `<span class="muted-small">Membre</span>`}</td>
          <td>
            ${m.role!=="referent" ? `<a class="linklike" data-make-referent="${m.id}" style="font-size:11.5px;">Devenir référent</a> · ` : ""}
            <a class="linklike" data-remove-membre="${m.id}" style="font-size:11.5px;">Sortir de l'équipe</a>
          </td>
        </tr>`).join("")}</tbody>
      </table>
      <div style="margin-top:8px;"><a class="linklike" id="addMembreBtn">+ Ajouter un membre</a></div>
      ${addMembreForm}
      <div class="muted-small" style="margin-top:6px;">Un nouvel entrant doit être actif ≥ 6 mois avant le bilan pour être accrédité. Mouvements possibles uniquement hors période de bilan.</div>
    `;
  }

  const attendu = e.type==="equipe" ? eiasAttendus(e.membres.length) : 1;

  const isPerson = e.type==="individuel" || e.type==="membre_equipe";
  const nomPrenomGuess = (e.prenom || e.nomFamille) ? { prenom:e.prenom||"", nomFamille:e.nomFamille||"" } : guessNomPrenom(e.nom);
  const editingContact = STATE.engageEditContact === e.id;
  const contactBlock = editingContact ? `
    ${isPerson ? `
    <div class="grid2">
      <div class="field"><label>Prénom</label><input type="text" id="editPrenom" name="editP_${e.id}" value="${escapeHtml(nomPrenomGuess.prenom)}" autocomplete="off" /></div>
      <div class="field"><label>Nom</label><input type="text" id="editNomFamille" name="editN_${e.id}" value="${escapeHtml(nomPrenomGuess.nomFamille)}" autocomplete="off" /></div>
    </div>
    <div class="muted-small" style="margin:-4px 0 8px;">Utile en cas de changement de nom, ou pour corriger une inversion nom/prénom saisie précédemment.</div>
    ` : ""}
    <div class="field"><label>Téléphone</label><input type="text" id="editTelephone" value="${escapeHtml(e.telephone||"")}" /></div>
    <div class="field"><label>Adresse mail</label><input type="text" id="editEmail" value="${escapeHtml(e.email||"")}" /></div>
    <div class="field"><label>N° RPPS <span class="muted-small">(utile pour distinguer les homonymes)</span></label><input type="text" id="editRpps" value="${escapeHtml(e.rpps||"")}" /></div>
    <button class="btn small" data-save-contact="${e.id}">Enregistrer</button>
    <a class="linklike" data-cancel-contact style="margin-left:10px;">Annuler</a>
  ` : `
    <div class="muted-small">📞 ${e.telephone ? escapeHtml(e.telephone) : "non renseigné"} &nbsp;·&nbsp; ✉️ ${e.email ? escapeHtml(e.email) : "non renseigné"}${e.rpps ? ` &nbsp;·&nbsp; RPPS ${escapeHtml(e.rpps)}` : ""} &nbsp; <a class="linklike" data-edit-contact="${e.id}" style="font-size:11.5px;">✎ Modifier</a></div>
  `;

  const editingNote = STATE.engageEditNote === e.id;
  const noteBlock = editingNote ? `
    <textarea rows="3" id="editNoteInput" placeholder="Notes libres — échanges, évolution de situation…">${escapeHtml(e.note||"")}</textarea>
    <div style="margin-top:6px;">
      <button class="btn small" data-save-note="${e.id}">Enregistrer</button>
      <a class="linklike" data-cancel-note style="margin-left:10px;">Annuler</a>
    </div>
  ` : (e.note ? `
    <div class="muted-small" style="white-space:pre-wrap; background:#F7F9FC; padding:8px 10px; border-radius:6px; margin-top:6px;">📝 ${escapeHtml(e.note)}</div>
    <div style="margin-top:4px;"><a class="linklike" data-edit-note="${e.id}" style="font-size:11.5px;">✎ Modifier la note</a> &nbsp; <a class="linklike" data-clear-note="${e.id}" style="font-size:11.5px; color:var(--danger);">Effacer</a></div>
  ` : `
    <div style="margin-top:4px;"><a class="linklike" data-edit-note="${e.id}" style="font-size:11.5px;">📝 + Ajouter une note</a></div>
  `);

  const editingEcheance = STATE.engageEditEcheance === e.id;
  const currentEcheance = dates[e.cycleIndex];
  const echeanceBlock = editingEcheance ? `
    <div class="field" style="max-width:240px;"><label>Nouvelle date limite</label><input type="date" id="editEcheanceInput" value="${currentEcheance.toISOString().slice(0,10)}" /></div>
    <button class="btn small" data-save-echeance="${e.id}">Enregistrer</button>
    ${e.echeanceOverrides && e.echeanceOverrides[e.cycleIndex] ? `<a class="linklike" data-reset-echeance="${e.id}" style="margin-left:10px;">Réinitialiser au calcul automatique</a>` : ""}
    <a class="linklike" data-cancel-echeance style="margin-left:10px;">Annuler</a>
  ` : "";

  // Suggestion contextuelle (aide, jamais automatique) selon le règlement retards/procédures.
  const suggestion = suggestedAction(e);
  const suggestionBanner = suggestion ? `
    <div class="badge warn" style="display:block; margin-bottom:12px; white-space:normal; padding:10px 12px;">
      ⚠️ À envisager : <b>${STATUT_BILAN_META[suggestion.key].label}</b> — ${suggestion.reason}. Mail correspondant disponible ci-dessous.
    </div>` : "";

  const actionDefs = ACTION_DEFS;
  const actionBtn = (a)=> `<button class="btn secondary small" data-action="${a.key}" data-engage="${e.id}" style="margin:0 6px 6px 0;">${a.icon} ${STATUT_BILAN_META[a.key].label}</button>`;
  const actionsHtml = `
    <div class="section-label">Échanger avec l'engagé</div>
    <div>
      <button class="btn secondary small" data-send-frise="${e.id}">📎 Envoyer un point d'étape (image de la frise)</button>
    </div>
    <div class="muted-small" style="margin-top:6px;">À usage informel — pour relancer ou simplement faire un point, sans changer de statut. L'image est copiée dans le presse-papiers (collez-la avec Ctrl+V dans le mail) et téléchargée en secours, un lien mailto: ne pouvant jamais joindre de fichier automatiquement.</div>

    <div class="section-label" style="margin-top:16px;">Décisions sur le bilan en cours</div>
    <div>${actionDefs.filter(a=>a.group==="cycle").map(actionBtn).join("")}</div>
    <div class="section-label" style="margin-top:12px;">Situations particulières</div>
    <div>${actionDefs.filter(a=>a.group==="special").map(actionBtn).join("")}</div>
    <div class="muted-small" style="margin-top:8px;">Chaque action met à jour le statut affiché dans la frise et ouvre le mail type correspondant dans votre messagerie — toujours modifiable avant envoi.</div>
  `;

  const helpOpen = STATE.showActionsHelp;
  const defaultAideText = `
        <b>Délais :</b> traitement attendu sous ${REGLES_GESTION.delaiTraitementJours} jours (indicateur qualité HAS) ; tolérance de retard de ${REGLES_GESTION.toleranceRetardJours} jours avant escalade.<br/>
        <b>Escalade en cas de retard persistant :</b> transmission forcée du bilan → information contradictoire (3 semaines pour réagir) → avis défavorable / mise en demeure (3 mois) → avis défavorable définitif → retrait d'accréditation.<br/>
        <b>Renoncement :</b> à privilégier à tout moment plutôt qu'un retrait subi — procédure amiable, ré-engagement facilité, pas de publication HAS.<br/>
        <b>Non-demande :</b> bilan d'accréditation 1 resté vide plus de 18 mois → retrait pour non-demande (ré-engagement possible).<br/>
        <b>Bilan vide toléré :</b> grossesse ou longue maladie — bilan vide déclenché par l'expert, motif justifié dans la synthèse, tolérance demandée à la HAS.<br/>
        <b>Retraite :</b> clôture du dossier ; un bilan techniquement « défavorable » peut être émis pour clore administrativement, sans portée négative réelle.<br/>
        <b>Accréditation échue</b> (> 4 ans ou déjà engagés) : clôture du dossier SIAM à la demande, hors procédure d'escalade ci-dessus.`;
  const helpPanel = helpOpen ? `
    <div class="card" style="background:#F7F9FC;">
      <div class="card-title" style="margin-bottom:8px;">Rappel des procédures</div>
      <div style="font-size:12.8px; line-height:1.6; white-space:pre-wrap;">
        ${REGLES_GESTION.aideProcedures ? escapeHtml(REGLES_GESTION.aideProcedures) : defaultAideText}
      </div>
      ${isAdmin ? `<div class="muted-small" style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">📧 Copie systématique sur ces mails : <b>${escapeHtml(REGLES_GESTION.responsableAccreditationEmail||"non renseignée")}</b> — modifiable dans <b>Didacticiel → ⚙️ Règles de gestion</b>.</div>` : ""}
      ${isAdmin ? `<div class="muted-small" style="margin-top:6px;"><a class="linklike" id="toggleMailEditBtn">${STATE.showMailTemplateEditor ? "Masquer l'édition des modèles de mail" : "✎ Modifier les modèles de mail (administrateur)"}</a></div>` : ""}
      ${isAdmin && STATE.showMailTemplateEditor ? renderMailTemplateEditor() : ""}
    </div>` : "";

  return `
  <div class="card">
    <div class="card-head">
      <div><div class="card-title">${e.nom}</div><div class="card-desc">Entré dans le dispositif le ${fmtDate(e.dateEntree)}</div></div>
      <div style="display:flex; gap:12px; align-items:center;">
        <a class="linklike" id="deleteEngageBtn" data-id="${e.id}" style="color:var(--danger);">🗑️ Supprimer</a>
        <a class="linklike" id="closeEngageBtn">Fermer ✕</a>
      </div>
    </div>
    ${contactBlock}
    ${noteBlock}
    ${isRappelDue(e) ? (()=>{
      const missing = missingActivitiesForRappel(e);
      return `<div class="card" style="background:#FFF8E8; border-color:#f0dca8; margin-top:10px;">
        <div style="font-size:12.8px;"><b>🔔 Rappel trimestriel dû</b> — aucun rappel envoyé depuis plus de 3 mois${e.lastRappelDate ? " (dernier le "+fmtDate(new Date(e.lastRappelDate))+")" : " (jamais envoyé)"}.</div>
        ${missing.length ? `<div class="muted-small" style="margin-top:6px;">Activités suggérées : ${missing.map(a=>escapeHtml(a.nom.replace(" (OBLIGATOIRE)",""))).join(" · ")}</div>` : `<div class="muted-small" style="margin-top:6px;">Aucune activité en attente identifiée pour cette étape — le rappel restera un simple point de contact.</div>`}
        <button class="btn small" id="sendRappelBtn" style="margin-top:8px;">✉️ Envoyer le rappel trimestriel</button>
      </div>`;
    })() : ""}
    <div class="stepper" style="margin-top:10px;">
      <div class="today-marker" style="left:${computeTodayMarkerPercent(dates)}%;"><span class="tag">Aujourd'hui</span><span class="arrow">▼</span></div>
      ${stepsHtml}
    </div>
    <div style="margin-top:8px;">${statutBadge(e.statutBilan)}</div>
    <div class="muted-small" style="margin-top:8px;">${cycleNote}</div>
    ${cycleNav}
    <div class="grid2" style="margin-top:18px;">
      <div>
        <div class="section-label">Pré-requis de l'année en cours</div>
        <div class="muted-small">EIAS attendus : <b>${attendu}</b> — réalisés : <b>${e.eiasRealises}</b>${STATE.engageEditEias!==e.id ? ` — <a class="linklike" data-edit-eias="${e.id}" style="font-size:11.5px;">✎ Corriger</a>` : ""}</div>
        ${STATE.engageEditEias===e.id ? `
        <div style="margin:6px 0;"><input type="number" min="0" id="editEiasInput" value="${e.eiasRealises}" style="max-width:100px; display:inline-block;" />
          <button class="btn small" data-save-eias="${e.id}">Enregistrer</button>
          <a class="linklike" data-cancel-eias style="margin-left:8px;">Annuler</a>
        </div>` : ""}
        <div class="muted-small">Échéance : ${fmtDate(dates[e.cycleIndex])} (${delayStatus(dates[e.cycleIndex], e.statutBilan).label})${!editingEcheance ? ` — <a class="linklike" data-edit-echeance="${e.id}" style="font-size:11.5px;">✎ Modifier</a>` : ""}</div>
        ${echeanceBlock}
      </div>
      <div>
        <div class="section-label">Aller vers</div>
        <a class="linklike" data-goto-bilan="${e.id}">→ Ouvrir le Bilan annuel de cet engagé</a><br/>
        <a class="linklike" data-goto-eias="${e.id}">→ Déclarer / analyser un EIAS pour cet engagé</a>
      </div>
    </div>
    ${membresHtml}

    ${(e.dossiersEias && e.dossiersEias.length) ? `
    <div class="section-label" style="margin-top:18px;">📁 Dossiers EIAS archivés (${e.dossiersEias.length})</div>
    ${e.dossiersEias.slice().reverse().map(dos=>{
      const isOpen = STATE.eiasArchiveOpen === dos.id;
      const kwChips = (dos.motsCles||[]).map(k=>`<span class="kw-chip" style="cursor:default;">${escapeHtml(k)}</span>`).join("");
      const syn = dos.synthese || {};
      const cr2 = dos.critique || {};
      const detail = isOpen ? `
        <div style="padding:12px 14px; background:#fbfcfe; border-top:1px dashed var(--border);">
          <div style="font-size:12.8px; white-space:pre-wrap;"><b>Description :</b> ${escapeHtml(syn.description||"")}</div>
          <div style="font-size:12.8px; white-space:pre-wrap; margin-top:8px;"><b>Comment :</b> ${escapeHtml(syn.causeImmediate||"")}</div>
          <div style="font-size:12.8px; white-space:pre-wrap; margin-top:8px;"><b>Pourquoi (grille ALARM) :</b> ${escapeHtml(syn.causesProfondes||"")}</div>
          <div style="font-size:12.8px; white-space:pre-wrap; margin-top:8px;"><b>Barrières :</b> ${escapeHtml(syn.barrieres||"")}</div>
          <div style="font-size:12.8px; white-space:pre-wrap; margin-top:8px;"><b>Axes d'amélioration :</b> ${escapeHtml(syn.axes||"")}</div>
          ${syn.confrontationLitterature ? `<div class="muted-small" style="margin-top:8px;"><b>Confrontation littérature :</b> ${escapeHtml(syn.confrontationLitterature)}</div>` : ""}
          ${(cr2.pointsForts||cr2.pointsAmeliorer||cr2.complementExpert) ? `
          <div class="section-label" style="margin-top:10px;">Analyse contradictoire</div>
          ${cr2.pointsForts?`<div class="muted-small"><b>Points forts :</b> ${escapeHtml(cr2.pointsForts)}</div>`:""}
          ${cr2.pointsAmeliorer?`<div class="muted-small" style="margin-top:4px;"><b>Points à compléter :</b> ${escapeHtml(cr2.pointsAmeliorer)}</div>`:""}
          ${cr2.complementExpert?`<div class="muted-small" style="margin-top:4px;"><b>Complément de l'expert :</b> ${escapeHtml(cr2.complementExpert)}</div>`:""}
          ` : ""}
          <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn secondary small" data-redownload-eias="${dos.id}" data-engage="${e.id}">⬇️ Réexporter en Word</button>
            <button class="btn secondary small" data-resend-eias="${dos.id}" data-engage="${e.id}">✉️ Renvoyer à l'engagé</button>
          </div>
        </div>` : "";
      return `<div class="pilier-block">
        <div class="pilier-header" data-toggle-archive="${dos.id}" style="cursor:pointer;">
          <div class="name">${escapeHtml(dos.titre)}</div>
          <div class="req">${fmtDate(dos.date)} ${isOpen?"▾":"▸"}</div>
        </div>
        ${!isOpen ? `<div style="padding:8px 14px;">${kwChips}</div>` : ""}
        ${detail}
      </div>`;
    }).join("")}
    ` : ""}

    ${(e.dossiersBilan && e.dossiersBilan.length) ? `
    <div class="section-label" style="margin-top:18px;">📁 Bilans archivés (${e.dossiersBilan.length})</div>
    ${e.dossiersBilan.slice().reverse().map(dos=>{
      const isOpen = STATE.bilanArchiveOpen === dos.id;
      const detail = isOpen ? `
        <div style="padding:12px 14px; background:#fbfcfe; border-top:1px dashed var(--border);">
          <div style="font-size:12.8px; white-space:pre-wrap;"><b>Synthèse (SIAM) :</b>\n${escapeHtml(dos.syntheseSiam||"")}</div>
          <div style="font-size:12.8px; white-space:pre-wrap; margin-top:8px;"><b>Message adressé à l'engagé :</b>\n${escapeHtml(dos.syntheseEngage||"")}</div>
          ${dos.appreciation ? `<div class="muted-small" style="margin-top:8px;"><b>Appréciation de l'expert :</b> ${escapeHtml(dos.appreciation)}</div>` : ""}
          <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn secondary small" data-recopy-bilan="${dos.id}" data-engage="${e.id}">📋 Copier l'appréciation pour le SIAM</button>
            <button class="btn secondary small" data-download-bilan="${dos.id}" data-engage="${e.id}">⬇️ Télécharger (Word)</button>
            <button class="btn secondary small" data-resend-bilan="${dos.id}" data-engage="${e.id}">✉️ Renvoyer à l'engagé</button>
          </div>
        </div>` : "";
      return `<div class="pilier-block">
        <div class="pilier-header" data-toggle-bilan-archive="${dos.id}" style="cursor:pointer;">
          <div class="name">${escapeHtml(dos.etape)}</div>
          <div class="req">${fmtDate(dos.date)} ${isOpen?"▾":"▸"}</div>
        </div>
        ${detail}
      </div>`;
    }).join("")}
    ` : ""}

    <div class="section-label" style="margin-top:18px; display:flex; justify-content:space-between; align-items:center;">
      <span>Actions</span>
      <a class="linklike" id="toggleActionsHelpBtn" style="font-size:11.5px;">${helpOpen ? "Masquer l'aide ▴" : "❓ Aide — rappel des procédures ▾"}</a>
    </div>
    ${suggestionBanner}
    ${helpPanel}
    ${actionsHtml}
  </div>`;
}

/*__ACTIONDEFS_START__*/
let ACTION_DEFS = [{"key":"complement_demande","icon":"✎","group":"cycle","core":true},{"key":"information_contradictoire","icon":"⚠️","group":"cycle","core":true},{"key":"avis_defavorable","icon":"⛔","group":"cycle","core":true},{"key":"avis_defavorable_definitif","icon":"🚫","group":"cycle","core":true},{"key":"bilan_vide","icon":"🤰","group":"special","core":true},{"key":"renoncement","icon":"⏸️","group":"special","core":true},{"key":"retraite","icon":"🎓","group":"special","core":true},{"key":"sortie_non_demande","icon":"🚪","group":"special","core":true}];
/*__ACTIONDEFS_END__*/

function renderMailTemplateEditor(){
  const templatesHtml = Object.keys(MAIL_TEMPLATES).filter(key=>STATUT_BILAN_META[key]).map(key=>{
    const tpl = MAIL_TEMPLATES[key];
    const meta = STATUT_BILAN_META[key];
    const editing = STATE.editingMailTemplate === key;
    if (!editing){
      return `<div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--border);">
        <b style="font-size:12.5px;">${tpl.label}</b> — <a class="linklike" data-edit-template="${key}" style="font-size:11.5px;">✎ Modifier</a>
        ${!meta.core ? ` — <a class="linklike" data-remove-action="${key}" style="font-size:11.5px; color:var(--danger);">🗑️ Retirer cet onglet</a>` : ""}
      </div>`;
    }
